openapi: 3.1.0
info:
  title: RawDrive User Settings API
  version: 1.0.0
  description: |
    User profile, security, notification, privacy, and account management endpoints.
    All endpoints require authentication via Bearer token.

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

paths:
  # ==========================================================================
  # Profile Endpoints
  # ==========================================================================

  /users/me:
    get:
      summary: Get current user profile
      description: Returns full profile including preferences and settings
      operationId: getCurrentUserProfile
      tags: [Profile]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      summary: Update user profile
      description: Partial update of profile fields
      operationId: updateUserProfile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/avatar:
    post:
      summary: Upload profile avatar
      description: Upload and optionally crop a profile photo
      operationId: uploadAvatar
      tags: [Profile]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPG, PNG, WebP, max 5MB)
                crop_x:
                  type: number
                  description: Crop X offset (0-1)
                crop_y:
                  type: number
                  description: Crop Y offset (0-1)
                crop_scale:
                  type: number
                  description: Crop scale factor
              required: [file]
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: File too large

    delete:
      summary: Remove profile avatar
      description: Delete the current profile photo
      operationId: deleteAvatar
      tags: [Profile]
      responses:
        '200':
          description: Avatar removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /users/me/email:
    post:
      summary: Request email change
      description: Initiate email change with verification to new address
      operationId: requestEmailChange
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already in use

  # ==========================================================================
  # Security Endpoints
  # ==========================================================================

  /users/me/password:
    post:
      summary: Change password
      description: Change password with current password verification
      operationId: changePassword
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Current password incorrect

  /users/me/2fa/setup:
    post:
      summary: Begin 2FA setup
      description: Generate TOTP secret and QR code for authenticator app
      operationId: setup2FA
      tags: [Security]
      responses:
        '200':
          description: 2FA setup initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'
        '409':
          description: 2FA already enabled

  /users/me/2fa/verify:
    post:
      summary: Verify and enable 2FA
      description: Verify TOTP code to enable two-factor authentication
      operationId: verify2FA
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify2FARequest'
      responses:
        '200':
          description: 2FA enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnabledResponse'
        '400':
          description: Invalid code
        '409':
          description: No pending 2FA setup

  /users/me/2fa:
    get:
      summary: Get 2FA status
      description: Check if 2FA is enabled for current user
      operationId: get2FAStatus
      tags: [Security]
      responses:
        '200':
          description: 2FA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatusResponse'

    delete:
      summary: Disable 2FA
      description: Disable two-factor authentication (requires password and TOTP code)
      operationId: disable2FA
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disable2FARequest'
      responses:
        '200':
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid password or code

  /users/me/2fa/backup-codes:
    post:
      summary: Regenerate backup codes
      description: Generate new backup codes (invalidates existing ones)
      operationId: regenerateBackupCodes
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmRequest'
      responses:
        '200':
          description: New backup codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodesResponse'
        '401':
          description: Invalid password

  /users/me/sessions:
    get:
      summary: List active sessions
      description: Get all active sessions for current user
      operationId: listSessions
      tags: [Security]
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'

    delete:
      summary: Terminate all other sessions
      description: Log out from all devices except current
      operationId: terminateAllSessions
      tags: [Security]
      responses:
        '200':
          description: Sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /users/me/sessions/{session_id}:
    delete:
      summary: Terminate specific session
      description: Log out from a specific device
      operationId: terminateSession
      tags: [Security]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Session not found

  # ==========================================================================
  # Notification Endpoints
  # ==========================================================================

  /users/me/notifications:
    get:
      summary: Get notification preferences
      description: Get all notification preference settings
      operationId: getNotificationPreferences
      tags: [Notifications]
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'

    patch:
      summary: Update notification preferences
      description: Partial update of notification toggles
      operationId: updateNotificationPreferences
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'

  # ==========================================================================
  # Privacy Endpoints
  # ==========================================================================

  /users/me/privacy:
    get:
      summary: Get privacy settings
      description: Get privacy and data settings
      operationId: getPrivacySettings
      tags: [Privacy]
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'

    patch:
      summary: Update privacy settings
      description: Update analytics and public profile settings
      operationId: updatePrivacySettings
      tags: [Privacy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrivacySettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'

  /users/me/export:
    post:
      summary: Request data export
      description: Initiate GDPR data export
      operationId: requestDataExport
      tags: [Privacy]
      responses:
        '200':
          description: Export requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportResponse'
        '429':
          description: Rate limited (1 export per 24 hours)

    get:
      summary: Get export status
      description: Check status of most recent export request
      operationId: getExportStatus
      tags: [Privacy]
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportResponse'
        '404':
          description: No export requests found

  # ==========================================================================
  # Account Deletion Endpoints
  # ==========================================================================

  /users/me/delete:
    post:
      summary: Request account deletion
      description: Initiate account deletion with 14-day grace period
      operationId: requestAccountDeletion
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Deletion scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestResponse'
        '400':
          description: Active subscriptions must be cancelled first
        '401':
          description: Invalid password

    delete:
      summary: Cancel account deletion
      description: Cancel pending deletion request (automatically cancelled on login)
      operationId: cancelAccountDeletion
      tags: [Account]
      responses:
        '200':
          description: Deletion cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No pending deletion request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    # ==========================================================================
    # Common Schemas
    # ==========================================================================

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error, code]

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    # ==========================================================================
    # Profile Schemas
    # ==========================================================================

    UserProfileResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        email_verified:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        job_title:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
        bio:
          type: string
          nullable: true
        preferred_language:
          type: string
        workspace_id:
          type: string
          format: uuid
          nullable: true
        totp_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - user_id
        - email
        - display_name
        - email_verified
        - timezone
        - preferred_language
        - totp_enabled
        - created_at

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        job_title:
          type: string
          maxLength: 100
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        timezone:
          type: string
        bio:
          type: string
          maxLength: 500
          nullable: true
        preferred_language:
          type: string

    AvatarResponse:
      type: object
      properties:
        avatar_url:
          type: string
        thumbnails:
          type: object
          properties:
            small:
              type: string
            medium:
              type: string
            large:
              type: string
      required: [avatar_url, thumbnails]

    EmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
        password:
          type: string
      required: [new_email, password]

    # ==========================================================================
    # Security Schemas
    # ==========================================================================

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12
          description: Must contain uppercase, lowercase, number, special character
      required: [current_password, new_password]

    TwoFactorSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP secret (show only during setup)
        qr_code_uri:
          type: string
          description: otpauth:// URI for QR code generation
        issuer:
          type: string
      required: [secret, qr_code_uri, issuer]

    Verify2FARequest:
      type: object
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
      required: [code]

    TwoFactorEnabledResponse:
      type: object
      properties:
        message:
          type: string
        backup_codes:
          type: array
          items:
            type: string
          description: One-time backup codes (show only once)
      required: [message, backup_codes]

    TwoFactorStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
        enabled_at:
          type: string
          format: date-time
          nullable: true
        backup_codes_remaining:
          type: integer
          nullable: true
      required: [enabled]

    Disable2FARequest:
      type: object
      properties:
        password:
          type: string
        code:
          type: string
          pattern: '^\d{6}$'
      required: [password, code]

    PasswordConfirmRequest:
      type: object
      properties:
        password:
          type: string
      required: [password]

    BackupCodesResponse:
      type: object
      properties:
        backup_codes:
          type: array
          items:
            type: string
      required: [backup_codes]

    SessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'

    SessionItem:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        device_info:
          type: object
          properties:
            browser:
              type: string
            os:
              type: string
            device_type:
              type: string
        ip_address:
          type: string
        location:
          type: object
          nullable: true
          properties:
            country:
              type: string
            city:
              type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        is_current:
          type: boolean
      required:
        - session_id
        - created_at
        - last_used_at
        - is_current

    # ==========================================================================
    # Notification Schemas
    # ==========================================================================

    NotificationPreferencesResponse:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/NotificationChannelPrefs'
        in_app:
          $ref: '#/components/schemas/NotificationChannelPrefs'
      required: [email, in_app]

    NotificationChannelPrefs:
      type: object
      properties:
        gallery_activity:
          type: boolean
        client_interactions:
          type: boolean
        system_alerts:
          type: boolean
        marketing:
          type: boolean
      required:
        - gallery_activity
        - client_interactions
        - system_alerts
        - marketing

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        email:
          type: object
          additionalProperties:
            type: boolean
        in_app:
          type: object
          additionalProperties:
            type: boolean

    # ==========================================================================
    # Privacy Schemas
    # ==========================================================================

    PrivacySettingsResponse:
      type: object
      properties:
        analytics_enabled:
          type: boolean
        public_profile_enabled:
          type: boolean
      required: [analytics_enabled, public_profile_enabled]

    UpdatePrivacySettingsRequest:
      type: object
      properties:
        analytics_enabled:
          type: boolean
        public_profile_enabled:
          type: boolean

    DataExportResponse:
      type: object
      properties:
        export_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, completed, failed, expired]
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [export_id, status, requested_at]

    # ==========================================================================
    # Account Deletion Schemas
    # ==========================================================================

    DeleteAccountRequest:
      type: object
      properties:
        email_confirmation:
          type: string
          format: email
          description: Must match user's email
        password:
          type: string
      required: [email_confirmation, password]

    DeletionRequestResponse:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        requested_at:
          type: string
          format: date-time
        scheduled_deletion_at:
          type: string
          format: date-time
        message:
          type: string
      required:
        - request_id
        - requested_at
        - scheduled_deletion_at
        - message

tags:
  - name: Profile
    description: User profile management
  - name: Security
    description: Password, 2FA, and session management
  - name: Notifications
    description: Email and in-app notification preferences
  - name: Privacy
    description: Privacy settings and data export
  - name: Account
    description: Account deletion management
