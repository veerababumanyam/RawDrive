openapi: 3.0.3
info:
  title: Gallery Password Reset API
  version: 1.0.0
  description: API for gallery password recovery flow

paths:
  /api/v1/public/galleries/{gallery_id}/password-reset/request:
    post:
      summary: Request password reset for a gallery
      description: |
        Initiates password reset flow. Sends email with access link if email
        is registered for this gallery (from previous email_registration).
        Link is valid for 1 hour and grants single-session access.
      operationId: requestPasswordReset
      tags:
        - Password Reset
      parameters:
        - name: gallery_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email previously registered with this gallery
                  example: "client@example.com"
      responses:
        '200':
          description: |
            Request processed. Email sent if address is registered.
            (Same response for registered/unregistered to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If this email is registered, you will receive a reset link shortly."
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gallery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many reset requests (rate limited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "rate_limit_exceeded"
                  message:
                    type: string
                    example: "Too many reset requests. Please try again later."
                  retry_after:
                    type: integer
                    description: Seconds to wait
                    example: 300

  /api/v1/public/galleries/{gallery_id}/password-reset/verify:
    post:
      summary: Verify password reset token and grant access
      description: |
        Verifies the reset token from the email link.
        If valid, grants session access to the gallery.
        Token is single-use and expires after 1 hour.
      operationId: verifyPasswordReset
      tags:
        - Password Reset
      parameters:
        - name: gallery_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  format: uuid
                  description: Reset token from email link
      responses:
        '200':
          description: Token verified - access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  session_token:
                    type: string
                    description: Session token for gallery access
                  expires_at:
                    type: string
                    format: date-time
                    description: Session expiry (24 hours)
                  gallery:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "invalid_token"
                  message:
                    type: string
                    example: "This reset link is invalid or has expired."
        '404':
          description: Gallery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
        requestId:
          type: string
