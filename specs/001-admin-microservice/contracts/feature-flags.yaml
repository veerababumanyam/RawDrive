openapi: 3.1.0
info:
  title: Feature Flags API
  version: 1.0.0
  description: |
    Feature flag management and evaluation endpoints.
    Covers FR-056 to FR-065.

servers:
  - url: /admin/v1
    description: Admin Service API

tags:
  - name: Flags
    description: Feature flag CRUD operations
  - name: Evaluation
    description: Flag evaluation for services
  - name: Targeting
    description: Targeting rules and segments
  - name: Audit
    description: Flag change history

paths:
  /feature-flags:
    get:
      summary: List feature flags
      description: List all feature flags with optional filtering
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [enabled, disabled, all]
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search in flag key or description
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Feature flag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create feature flag
      description: Create a new feature flag (FR-056)
      tags: [Flags]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureFlagRequest'
      responses:
        '201':
          description: Feature flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '400':
          description: Invalid flag configuration
        '409':
          description: Flag key already exists

  /feature-flags/{flag_key}:
    get:
      summary: Get feature flag
      description: Get detailed information about a feature flag
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      responses:
        '200':
          description: Feature flag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update feature flag
      description: Update feature flag configuration (FR-058)
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureFlagRequest'
      responses:
        '200':
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '400':
          description: Invalid configuration
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Archive feature flag
      description: Archive a feature flag (soft delete)
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      responses:
        '204':
          description: Feature flag archived
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot archive enabled flag

  /feature-flags/{flag_key}/enable:
    post:
      summary: Enable feature flag
      description: Enable a feature flag globally or for specific targets
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableFlagRequest'
      responses:
        '200':
          description: Flag enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /feature-flags/{flag_key}/disable:
    post:
      summary: Disable feature flag
      description: Disable a feature flag globally
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      responses:
        '200':
          description: Flag disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /feature-flags/{flag_key}/rollout:
    put:
      summary: Update rollout percentage
      description: Update gradual rollout percentage (FR-060)
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolloutRequest'
      responses:
        '200':
          description: Rollout updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '400':
          description: Invalid rollout configuration
        '404':
          $ref: '#/components/responses/NotFound'

  # Targeting Rules
  /feature-flags/{flag_key}/rules:
    get:
      summary: List targeting rules
      description: List all targeting rules for a flag
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      responses:
        '200':
          description: Targeting rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetingRuleListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Add targeting rule
      description: Add a targeting rule to a flag (FR-059)
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetingRuleRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetingRuleResponse'
        '400':
          description: Invalid rule configuration
        '404':
          $ref: '#/components/responses/NotFound'

  /feature-flags/{flag_key}/rules/{rule_id}:
    put:
      summary: Update targeting rule
      description: Update a targeting rule
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTargetingRuleRequest'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetingRuleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete targeting rule
      description: Delete a targeting rule
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Rule deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /feature-flags/{flag_key}/rules/reorder:
    post:
      summary: Reorder targeting rules
      description: Update the evaluation order of targeting rules
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRulesRequest'
      responses:
        '200':
          description: Rules reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetingRuleListResponse'
        '400':
          description: Invalid rule order
        '404':
          $ref: '#/components/responses/NotFound'

  # Segments
  /feature-flags/segments:
    get:
      summary: List segments
      description: List all targeting segments
      tags: [Targeting]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Segment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentListResponse'

    post:
      summary: Create segment
      description: Create a reusable targeting segment
      tags: [Targeting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentRequest'
      responses:
        '201':
          description: Segment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
        '409':
          description: Segment key already exists

  /feature-flags/segments/{segment_key}:
    get:
      summary: Get segment
      description: Get segment details
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - name: segment_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Segment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update segment
      description: Update segment definition
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - name: segment_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSegmentRequest'
      responses:
        '200':
          description: Segment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete segment
      description: Delete a segment (fails if in use by flags)
      tags: [Targeting]
      security:
        - BearerAuth: []
      parameters:
        - name: segment_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Segment deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Segment in use by flags

  # Evaluation (for services)
  /feature-flags/evaluate:
    post:
      summary: Evaluate flags
      description: |
        Evaluate multiple flags for a context (FR-061).
        Used by services to get flag values. Results cached for 30s.
      tags: [Evaluation]
      security:
        - ServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateFlagsRequest'
      responses:
        '200':
          description: Evaluation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateFlagsResponse'

  /feature-flags/{flag_key}/evaluate:
    post:
      summary: Evaluate single flag
      description: Evaluate a single flag for a context
      tags: [Evaluation]
      security:
        - ServiceAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateContextRequest'
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateFlagResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # Audit History
  /feature-flags/{flag_key}/history:
    get:
      summary: Get flag change history
      description: Get audit history of flag changes (FR-064)
      tags: [Audit]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagKeyParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Flag change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagHistoryListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /feature-flags/categories:
    get:
      summary: List flag categories
      description: List all flag categories for organization
      tags: [Flags]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service authentication token

  parameters:
    FlagKeyParam:
      name: flag_key
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{2,63}$'
      description: Unique flag key (lowercase, underscores, hyphens)
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  responses:
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CreateFeatureFlagRequest:
      type: object
      required: [key, name, type]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{2,63}$'
          description: Unique flag key
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        type:
          type: string
          enum: [boolean, string, number, json]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        default_value:
          description: Default value when flag is disabled or no rules match
        enabled:
          type: boolean
          default: false

    UpdateFeatureFlagRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        default_value:
          description: Default value
        variations:
          type: array
          items:
            $ref: '#/components/schemas/FlagVariation'

    FeatureFlagResponse:
      type: object
      properties:
        flag_id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [boolean, string, number, json]
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        default_value: {}
        rollout_percentage:
          type: number
          minimum: 0
          maximum: 100
        variations:
          type: array
          items:
            $ref: '#/components/schemas/FlagVariation'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner_id:
          type: string
          format: uuid

    FeatureFlagDetailResponse:
      allOf:
        - $ref: '#/components/schemas/FeatureFlagResponse'
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/TargetingRuleResponse'
            targeting_count:
              type: integer
              description: Number of active targeting rules
            evaluation_stats:
              type: object
              properties:
                total_evaluations_24h:
                  type: integer
                true_percentage:
                  type: number
                false_percentage:
                  type: number

    FeatureFlagListResponse:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    FlagVariation:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}
        description:
          type: string
        weight:
          type: integer
          minimum: 0
          maximum: 100

    EnableFlagRequest:
      type: object
      properties:
        targets:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [workspace, user, plan]
              id:
                type: string
          description: Optional specific targets to enable for

    UpdateRolloutRequest:
      type: object
      required: [percentage]
      properties:
        percentage:
          type: number
          minimum: 0
          maximum: 100
        variation_weights:
          type: array
          items:
            type: object
            properties:
              variation_key:
                type: string
              weight:
                type: integer

    CreateTargetingRuleRequest:
      type: object
      required: [conditions, variation]
      properties:
        name:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        variation:
          type: string
          description: Variation key to serve when rule matches
        priority:
          type: integer
          minimum: 0

    UpdateTargetingRuleRequest:
      type: object
      properties:
        name:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        variation:
          type: string
        enabled:
          type: boolean

    TargetingRuleResponse:
      type: object
      properties:
        rule_id:
          type: string
          format: uuid
        name:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        variation:
          type: string
        priority:
          type: integer
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    TargetingRuleListResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TargetingRuleResponse'

    ReorderRulesRequest:
      type: object
      required: [rule_ids]
      properties:
        rule_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Rule IDs in desired evaluation order

    RuleCondition:
      type: object
      required: [attribute, operator, value]
      properties:
        attribute:
          type: string
          description: Context attribute (e.g., 'workspace_id', 'plan', 'country')
        operator:
          type: string
          enum: [equals, not_equals, contains, not_contains, starts_with, ends_with, in, not_in, greater_than, less_than, regex, segment]
        value:
          description: Value to compare against

    CreateSegmentRequest:
      type: object
      required: [key, name, conditions]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{2,63}$'
        name:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'

    UpdateSegmentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'

    SegmentResponse:
      type: object
      properties:
        segment_id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        used_by_flags:
          type: integer
          description: Number of flags using this segment

    SegmentDetailResponse:
      allOf:
        - $ref: '#/components/schemas/SegmentResponse'
        - type: object
          properties:
            flags:
              type: array
              items:
                type: object
                properties:
                  flag_key:
                    type: string
                  flag_name:
                    type: string

    SegmentListResponse:
      type: object
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentResponse'

    EvaluateFlagsRequest:
      type: object
      required: [context]
      properties:
        flag_keys:
          type: array
          items:
            type: string
          description: Specific flags to evaluate (all if omitted)
        context:
          $ref: '#/components/schemas/EvaluationContext'

    EvaluationContext:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        plan:
          type: string
        country:
          type: string
        attributes:
          type: object
          additionalProperties: true
          description: Custom attributes for targeting

    EvaluateFlagsResponse:
      type: object
      properties:
        evaluations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EvaluateFlagResponse'
        context_hash:
          type: string
          description: Hash for caching

    EvaluateContextRequest:
      type: object
      required: [context]
      properties:
        context:
          $ref: '#/components/schemas/EvaluationContext'

    EvaluateFlagResponse:
      type: object
      properties:
        key:
          type: string
        value: {}
        variation:
          type: string
        reason:
          type: string
          enum: [default, rule_match, rollout, disabled, error]
        rule_id:
          type: string
          format: uuid

    FlagHistoryEntry:
      type: object
      properties:
        history_id:
          type: string
          format: uuid
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
          format: uuid
        changed_by_email:
          type: string
          format: email
        change_type:
          type: string
          enum: [created, enabled, disabled, updated, rule_added, rule_removed, archived]
        previous_value:
          type: object
        new_value:
          type: object
        description:
          type: string

    FlagHistoryListResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/FlagHistoryEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              flag_count:
                type: integer

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        request_id:
          type: string
