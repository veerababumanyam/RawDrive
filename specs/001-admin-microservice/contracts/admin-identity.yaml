openapi: 3.1.0
info:
  title: Admin Identity API
  version: 1.0.0
  description: |
    Admin identity management, authentication, and role assignment endpoints.
    Covers FR-001 to FR-010, FR-091-094 (self-service).

servers:
  - url: /admin/v1
    description: Admin Service API

tags:
  - name: Authentication
    description: Admin login and MFA
  - name: Admins
    description: Admin account management
  - name: Invites
    description: Admin invitation management
  - name: Roles
    description: Role and permission management
  - name: Self-Service
    description: Admin self-service operations (FR-091-094)

paths:
  /auth/login:
    post:
      summary: Admin login
      description: Authenticate admin with email/password, returns partial token requiring MFA
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAChallenge'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/mfa/verify:
    post:
      summary: Verify MFA code
      description: Complete login with TOTP code or backup code
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Logout admin
      description: Invalidate current session
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logout successful

  /admins:
    get:
      summary: List platform admins
      description: List all platform admin accounts with pagination
      tags: [Admins]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, disabled, all]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Admin list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admins/{admin_id}:
    get:
      summary: Get admin details
      description: Get details of a specific admin account
      tags: [Admins]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminIdParam'
      responses:
        '200':
          description: Admin details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update admin account
      description: Update admin status or settings
      tags: [Admins]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateRequest'
      responses:
        '200':
          description: Admin updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admins/{admin_id}/roles:
    put:
      summary: Assign roles to admin
      description: Replace admin's role assignments (requires step-up auth)
      tags: [Roles]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Roles assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admins/{admin_id}/disable:
    post:
      summary: Disable admin account
      description: Permanently disable admin, terminates all sessions (FR-005)
      tags: [Admins]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableRequest'
      responses:
        '200':
          description: Admin disabled
        '403':
          $ref: '#/components/responses/Forbidden'

  /invites:
    get:
      summary: List pending invites
      description: List all pending admin invitations
      tags: [Invites]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Invite list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteListResponse'

    post:
      summary: Create admin invite
      description: Send invitation to new admin (FR-004)
      tags: [Invites]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '409':
          description: Invite already exists for email

  /invites/{invite_id}:
    delete:
      summary: Revoke invite
      description: Cancel a pending invitation
      tags: [Invites]
      security:
        - BearerAuth: []
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invite revoked

  /invites/accept:
    post:
      summary: Accept invite
      description: Accept invitation and setup MFA (public endpoint)
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: MFA setup required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'
        '400':
          description: Invalid or expired token

  /roles:
    get:
      summary: List role templates
      description: List all available role templates
      tags: [Roles]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'

  /permissions:
    get:
      summary: List permissions
      description: List all platform permissions
      tags: [Roles]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'

  # Self-Service Endpoints (FR-091-094)
  /me:
    get:
      summary: Get current admin profile
      description: Get profile of the authenticated admin
      tags: [Self-Service]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current admin profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'

  /me/sessions:
    get:
      summary: List my active sessions
      description: List all active sessions for current admin (FR-091)
      tags: [Self-Service]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'

  /me/sessions/{session_id}:
    delete:
      summary: Terminate my session
      description: Terminate one of my own sessions (FR-091)
      tags: [Self-Service]
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session terminated

  /me/mfa/rotate:
    post:
      summary: Rotate MFA device
      description: Generate new MFA secret, invalidate old (FR-092)
      tags: [Self-Service]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFARotateRequest'
      responses:
        '200':
          description: New MFA setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFASetupResponse'

  /me/audit:
    get:
      summary: View my audit log
      description: View audit log entries for current admin (FR-093)
      tags: [Self-Service]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AdminIdParam:
      name: admin_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [email, password, device_fingerprint]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        device_fingerprint:
          type: string
          description: Device fingerprint for session binding

    MFAChallenge:
      type: object
      properties:
        challenge_token:
          type: string
          description: Temporary token for MFA verification
        expires_at:
          type: string
          format: date-time

    MFAVerifyRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
        code:
          type: string
          pattern: '^\d{6}$|^[A-Z0-9]{8}$'
          description: TOTP code or backup code

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
        admin:
          $ref: '#/components/schemas/AdminResponse'

    AdminResponse:
      type: object
      properties:
        admin_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending_mfa, active, suspended, disabled]
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    AdminListResponse:
      type: object
      properties:
        admins:
          type: array
          items:
            $ref: '#/components/schemas/AdminResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AdminUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended]

    RoleAssignmentRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: string
          minItems: 1

    DisableRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10

    InviteRequest:
      type: object
      required: [email, role_template]
      properties:
        email:
          type: string
          format: email
        role_template:
          type: string

    InviteResponse:
      type: object
      properties:
        invite_id:
          type: string
          format: uuid
        email:
          type: string
        role_template:
          type: string
        expires_at:
          type: string
          format: date-time

    InviteListResponse:
      type: object
      properties:
        invites:
          type: array
          items:
            $ref: '#/components/schemas/InviteResponse'

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12

    MFASetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32 TOTP secret
        provisioning_uri:
          type: string
          description: QR code URI
        backup_codes:
          type: array
          items:
            type: string
          description: One-time backup codes

    MFARotateRequest:
      type: object
      required: [current_code]
      properties:
        current_code:
          type: string
          pattern: '^\d{6}$'
          description: Current MFA code to verify identity

    SessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              session_id:
                type: string
                format: uuid
              ip_address:
                type: string
              user_agent:
                type: string
              created_at:
                type: string
                format: date-time
              last_activity_at:
                type: string
                format: date-time
              is_current:
                type: boolean

    RoleListResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              role_id:
                type: string
                format: uuid
              name:
                type: string
              description:
                type: string
              is_system:
                type: boolean
              permissions:
                type: array
                items:
                  type: string

    PermissionListResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              category:
                type: string
              is_sensitive:
                type: boolean

    AuditLogListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AuditLogEntry:
      type: object
      properties:
        log_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        success:
          type: boolean
        ip_address:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        request_id:
          type: string
