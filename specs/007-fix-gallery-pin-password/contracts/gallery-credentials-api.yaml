openapi: 3.0.3
info:
  title: Gallery Credentials API
  description: API for managing and retrieving gallery access credentials (password/PIN)
  version: 1.0.0

paths:
  /v1/workspaces/{workspace_id}/galleries/{gallery_id}/credentials:
    get:
      summary: Get gallery credentials
      description: |
        Retrieves the decrypted password and PIN for a gallery.
        Requires workspace membership and appropriate permissions.
        Access is logged for audit purposes.
      operationId: getGalleryCredentials
      tags:
        - Galleries
      security:
        - bearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace ID
        - name: gallery_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Gallery ID
      responses:
        '200':
          description: Credentials retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryCredentialsResponse'
              examples:
                with_credentials:
                  summary: Gallery with recoverable credentials
                  value:
                    password: "MySecretPassword123"
                    pin: "1234"
                    has_password: true
                    has_pin: true
                    password_recoverable: true
                    pin_recoverable: true
                legacy_credentials:
                  summary: Legacy gallery (credentials not recoverable)
                  value:
                    password: null
                    pin: null
                    has_password: true
                    has_pin: true
                    password_recoverable: false
                    pin_recoverable: false
                no_credentials:
                  summary: Gallery without credentials
                  value:
                    password: null
                    pin: null
                    has_password: false
                    has_pin: false
                    password_recoverable: false
                    pin_recoverable: false
        '401':
          description: Unauthorized - Invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User lacks permission to view credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Gallery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token

  schemas:
    GalleryCredentialsResponse:
      type: object
      required:
        - password
        - pin
        - has_password
        - has_pin
        - password_recoverable
        - pin_recoverable
      properties:
        password:
          type: string
          nullable: true
          description: |
            Decrypted password if set and recoverable.
            Null if password not set or not recoverable (legacy).
          example: "MySecretPassword123"
        pin:
          type: string
          nullable: true
          description: |
            Decrypted PIN if set and recoverable.
            Null if PIN not set or not recoverable (legacy).
          example: "1234"
        has_password:
          type: boolean
          description: Whether password protection is enabled (password_hash exists)
          example: true
        has_pin:
          type: boolean
          description: Whether PIN protection is enabled (pin_hash exists)
          example: true
        password_recoverable:
          type: boolean
          description: |
            Whether the original password can be revealed.
            False for legacy galleries where only hash was stored.
          example: true
        pin_recoverable:
          type: boolean
          description: |
            Whether the original PIN can be revealed.
            False for legacy galleries where only hash was stored.
          example: true

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "GALLERY_NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "Gallery not found or has been deleted"
        request_id:
          type: string
          description: Request ID for support reference
          example: "req_abc123"
