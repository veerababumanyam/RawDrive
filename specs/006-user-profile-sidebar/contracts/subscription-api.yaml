openapi: 3.0.3
info:
  title: RawDrive Subscription API
  description: API endpoints for subscription management, billing, and invoices
  version: 1.0.0

tags:
  - name: subscription
    description: Subscription management
  - name: invoices
    description: Invoice and billing history
  - name: checkout
    description: Payment checkout

paths:
  /api/v1/workspaces/{workspace_id}/subscription:
    get:
      summary: Get subscription status
      description: Get detailed subscription status including plan, usage, and billing cycle
      operationId: getSubscriptionStatus
      tags: [subscription]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{workspace_id}/subscription/cancel:
    post:
      summary: Cancel subscription
      description: Request subscription cancellation at period end
      operationId: cancelSubscription
      tags: [subscription]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional cancellation reason
                  maxLength: 500
                immediate:
                  type: boolean
                  default: false
                  description: Cancel immediately instead of at period end
      responses:
        '200':
          description: Cancellation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{workspace_id}/subscription/reactivate:
    post:
      summary: Reactivate subscription
      description: Reactivate a subscription that was scheduled for cancellation
      operationId: reactivateSubscription
      tags: [subscription]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
      responses:
        '200':
          description: Reactivation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '400':
          description: Subscription cannot be reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{workspace_id}/subscription/checkout:
    post:
      summary: Create checkout session
      description: Create a Razorpay/Stripe checkout session for plan upgrade
      operationId: createCheckoutSession
      tags: [checkout]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan_id
              properties:
                plan_id:
                  type: string
                  format: uuid
                  description: Target plan ID
                billing_cycle:
                  type: string
                  enum: [monthly, annual]
                  default: monthly
                success_url:
                  type: string
                  format: uri
                  description: Redirect URL on success
                cancel_url:
                  type: string
                  format: uri
                  description: Redirect URL on cancellation
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url:
                    type: string
                    format: uri
                    description: URL to redirect user for payment
                  session_id:
                    type: string
                    description: Provider session ID
                  expires_at:
                    type: string
                    format: date-time
                    description: Session expiration time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{workspace_id}/invoices:
    get:
      summary: List invoices
      description: Get paginated list of invoices for workspace
      operationId: listInvoices
      tags: [invoices]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, failed, refunded]
      responses:
        '200':
          description: Invoice list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/workspaces/{workspace_id}/invoices/{invoice_id}:
    get:
      summary: Get invoice details
      description: Get detailed invoice information
      operationId: getInvoice
      tags: [invoices]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workspaces/{workspace_id}/invoices/{invoice_id}/pdf:
    get:
      summary: Download invoice PDF
      description: Download GST-compliant invoice PDF
      operationId: downloadInvoicePdf
      tags: [invoices]
      parameters:
        - $ref: '#/components/parameters/workspace_id'
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to PDF URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/razorpay:
    post:
      summary: Razorpay webhook
      description: Handle Razorpay payment events
      operationId: razorpayWebhook
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Razorpay webhook payload
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid signature

components:
  parameters:
    workspace_id:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SubscriptionStatus:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum: [trialing, active, past_due, canceled, expired]
        is_trial:
          type: boolean
        trial_days_remaining:
          type: integer
          nullable: true
        current_period_start:
          type: string
          format: date-time
          nullable: true
        current_period_end:
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          type: boolean
        usage:
          $ref: '#/components/schemas/UsageStats'

    Plan:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        price_monthly:
          type: number
          format: decimal
        price_annual:
          type: number
          format: decimal
          nullable: true
        currency:
          type: string
        storage_bytes:
          type: integer
          format: int64
        max_galleries:
          type: integer
        max_clients:
          type: integer
        max_team_members:
          type: integer
        ai_credits_monthly:
          type: integer
        features:
          type: object
          additionalProperties: true

    UsageStats:
      type: object
      properties:
        storage_used_bytes:
          type: integer
          format: int64
        storage_limit_bytes:
          type: integer
          format: int64
        storage_percentage:
          type: number
          format: float
        galleries_count:
          type: integer
        galleries_limit:
          type: integer
        clients_count:
          type: integer
        clients_limit:
          type: integer
        team_members_count:
          type: integer
        team_members_limit:
          type: integer
        ai_credits_used:
          type: integer
        ai_credits_limit:
          type: integer

    Invoice:
      type: object
      properties:
        invoice_id:
          type: string
          format: uuid
        invoice_number:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        tax_amount:
          type: number
          format: decimal
          nullable: true
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        billing_period_start:
          type: string
          format: date
        billing_period_end:
          type: string
          format: date
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'

    InvoiceLineItem:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
          format: decimal
        amount:
          type: number
          format: decimal

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
