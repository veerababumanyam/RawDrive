# Health Ready Endpoint Contract
# Enhanced readiness probe with connection pool status

openapi: 3.0.3
info:
  title: RawDrive Health API - Readiness Probe
  version: 1.1.0
  description: |
    Enhanced readiness probe that includes connection pool status
    for Kubernetes probing and capacity monitoring.

paths:
  /health/ready:
    get:
      summary: Readiness probe with detailed status
      description: |
        Returns detailed readiness status including database and cache
        connection pool utilization. Used by Kubernetes for traffic routing.
      operationId: getReadinessStatus
      tags:
        - Health
      responses:
        '200':
          description: Service is ready to receive traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: "ready"
                checks:
                  database:
                    status: "healthy"
                    pool_active: 8
                    pool_idle: 2
                    pool_max: 10
                  redis:
                    status: "healthy"
                    pool_active: 5
                    pool_max: 20
                  pgbouncer:
                    status: "healthy"
                    client_connections: 40
                    server_connections: 12
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: "not_ready"
                checks:
                  database:
                    status: "unhealthy"
                    error: "Connection timeout"
                  redis:
                    status: "healthy"
                    pool_active: 5
                    pool_max: 20

components:
  schemas:
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, not_ready]
          description: Overall readiness status
        checks:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/DatabaseCheck'
            redis:
              $ref: '#/components/schemas/RedisCheck'
            pgbouncer:
              $ref: '#/components/schemas/PgBouncerCheck'

    DatabaseCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        pool_active:
          type: integer
          description: Number of active database connections
        pool_idle:
          type: integer
          description: Number of idle database connections
        pool_max:
          type: integer
          description: Maximum pool size
        error:
          type: string
          description: Error message if unhealthy

    RedisCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        pool_active:
          type: integer
          description: Number of active Redis connections
        pool_max:
          type: integer
          description: Maximum pool size
        error:
          type: string
          description: Error message if unhealthy

    PgBouncerCheck:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, not_configured]
        client_connections:
          type: integer
          description: Current client connections to PgBouncer
        server_connections:
          type: integer
          description: Current server connections to PostgreSQL
        error:
          type: string
          description: Error message if unhealthy
