# OpenAPI Specification: Curation Session API
# Feature: 023-enhanced-smart-curate
# Version: 1.0.0

openapi: 3.1.0
info:
  title: Smart Curation Session API
  version: 1.0.0
  description: |
    API for managing AI-powered photo curation sessions.
    Supports session lifecycle, target-count culling, preset management,
    and preference learning.

    **Related FRs**: FR-009 to FR-012, FR-019 to FR-029, FR-033 to FR-035

servers:
  - url: /api/v1/workspaces/{workspace_id}
    description: Workspace-scoped API

paths:
  /galleries/{gallery_id}/curation-sessions:
    get:
      operationId: listCurationSessions
      summary: List curation sessions for a gallery
      description: Returns all curation sessions for a gallery, ordered by most recent first.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of curation sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CurationSessionSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createCurationSession
      summary: Create a new curation session
      description: |
        Creates a new curation session for the gallery. Optionally starts
        analysis immediately if `auto_start` is true.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Active session already exists for this gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /galleries/{gallery_id}/curation-sessions/{session_id}:
    get:
      operationId: getCurationSession
      summary: Get curation session details
      description: Returns full details of a curation session including progress and results.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationSession'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateCurationSession
      summary: Update curation session parameters
      description: |
        Updates session parameters. Can only update sessions in 'draft' or 'paused' status.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Session updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Cannot update session in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteCurationSession
      summary: Delete a curation session
      description: Permanently deletes a curation session and its results.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /galleries/{gallery_id}/curation-sessions/{session_id}/start:
    post:
      operationId: startCurationSession
      summary: Start or resume a curation session
      description: |
        Starts analysis for a draft session or resumes a paused session.
        Queues background jobs for quality analysis, similarity grouping, etc.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '202':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationSession'
        '409':
          description: Session cannot be started from current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /galleries/{gallery_id}/curation-sessions/{session_id}/pause:
    post:
      operationId: pauseCurationSession
      summary: Pause a running curation session
      description: Pauses analysis at the next checkpoint. Progress is saved.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationSession'
        '409':
          description: Session is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /galleries/{gallery_id}/curation-sessions/{session_id}/curate:
    post:
      operationId: executeCuration
      summary: Execute target-count curation
      description: |
        Runs the curation algorithm to select target_count photos from analyzed results.
        Requires quality analysis to be complete.
      tags: [Curation]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target_count:
                  type: integer
                  minimum: 1
                  description: Override session target count for this curation run
                diversity_weight:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.3
                  description: Balance between quality (0) and diversity (1)
      responses:
        '202':
          description: Curation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationResult'
        '400':
          description: Analysis not complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /galleries/{gallery_id}/curation-sessions/{session_id}/selections:
    get:
      operationId: getSelections
      summary: Get curated photo selections
      description: Returns the list of selected photos from the curation algorithm.
      tags: [Curation]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
        - name: include_reasons
          in: query
          schema:
            type: boolean
            default: false
          description: Include selection reasons for each photo
      responses:
        '200':
          description: Selection results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionResult'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateSelections
      summary: Override AI selections
      description: |
        Manually add or remove photos from the selection.
        Overrides are tracked for preference learning.
      tags: [Curation]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Asset IDs to add to selection
                remove:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Asset IDs to remove from selection
      responses:
        '200':
          description: Selections updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionResult'

  /galleries/{gallery_id}/curation-sessions/{session_id}/safety-set:
    get:
      operationId: getSafetySet
      summary: Get safety set (near-keepers)
      description: Returns photos that almost made the cut - alternates for expansion.
      tags: [Curation]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Safety set photos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetySetResult'

  /galleries/{gallery_id}/curation-sessions/{session_id}/expand:
    post:
      operationId: expandSelection
      summary: Expand selection from safety set
      description: Adds photos from safety set to main selection.
      tags: [Curation]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  description: Number of photos to add from safety set
                asset_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Specific asset IDs to promote (alternative to count)
      responses:
        '200':
          description: Selection expanded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionResult'

  /galleries/{gallery_id}/curation-sessions/{session_id}/export:
    post:
      operationId: exportCuration
      summary: Export curation results
      description: |
        Exports selected photos to a new sub-gallery, favorites list, or download.
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [export_type]
              properties:
                export_type:
                  type: string
                  enum: [sub_gallery, favorites, download]
                name:
                  type: string
                  description: Name for new sub-gallery or favorites list
      responses:
        '202':
          description: Export started
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending, processing]

  /curation-presets:
    get:
      operationId: listPresets
      summary: List available curation presets
      description: Returns system presets and user-created custom presets.
      tags: [Presets]
      responses:
        '200':
          description: List of presets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CurationPreset'

    post:
      operationId: createPreset
      summary: Create custom curation preset
      description: Creates a new user-defined preset with custom parameters.
      tags: [Presets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresetRequest'
      responses:
        '201':
          description: Preset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurationPreset'

  /curation-preferences:
    get:
      operationId: getPreferences
      summary: Get user's learned curation preferences
      description: Returns the user's learned preference patterns from past curation sessions.
      tags: [Preferences]
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'

    delete:
      operationId: resetPreferences
      summary: Reset learned preferences
      description: Clears all learned preference data, returning to default AI behavior.
      tags: [Preferences]
      responses:
        '204':
          description: Preferences reset

components:
  parameters:
    GalleryId:
      name: gallery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SessionStatus:
      type: string
      enum: [draft, analyzing, grouping, curating, completed, paused, failed]

    CurationSessionSummary:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        gallery_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SessionStatus'
        target_count:
          type: integer
        photos_analyzed:
          type: integer
        photos_selected:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CurationSession:
      allOf:
        - $ref: '#/components/schemas/CurationSessionSummary'
        - type: object
          properties:
            preset_id:
              type: string
              format: uuid
              nullable: true
            parameters:
              $ref: '#/components/schemas/SessionParameters'
            progress:
              $ref: '#/components/schemas/SessionProgress'
            metrics:
              $ref: '#/components/schemas/SessionMetrics'

    SessionParameters:
      type: object
      properties:
        quality_threshold:
          type: number
          minimum: 0
          maximum: 100
          default: 60
        similarity_threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.85
        diversity_weight:
          type: number
          minimum: 0
          maximum: 1
          default: 0.3
        enable_expression_filter:
          type: boolean
          default: true
        enable_moment_detection:
          type: boolean
          default: true
        enable_vip_coverage:
          type: boolean
          default: false
        vip_face_group_ids:
          type: array
          items:
            type: string
            format: uuid

    SessionProgress:
      type: object
      properties:
        current_stage:
          type: string
          enum: [pending, quality_analysis, similarity_grouping, scene_detection, curation, complete]
        photos_total:
          type: integer
        photos_processed:
          type: integer
        estimated_remaining_seconds:
          type: integer
          nullable: true

    SessionMetrics:
      type: object
      properties:
        quality_distribution:
          type: object
          additionalProperties:
            type: integer
          description: Count of photos per quality tier (excellent, good, fair, poor)
        similarity_groups_count:
          type: integer
        moments_detected:
          type: integer
        blur_flagged_count:
          type: integer
        expression_issues_count:
          type: integer

    CreateSessionRequest:
      type: object
      properties:
        target_count:
          type: integer
          minimum: 1
        preset_id:
          type: string
          format: uuid
          nullable: true
        parameters:
          $ref: '#/components/schemas/SessionParameters'
        auto_start:
          type: boolean
          default: false

    UpdateSessionRequest:
      type: object
      properties:
        target_count:
          type: integer
          minimum: 1
        parameters:
          $ref: '#/components/schemas/SessionParameters'

    CurationResult:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, completed]
        selected_count:
          type: integer
        safety_set_count:
          type: integer

    SelectionResult:
      type: object
      properties:
        selected:
          type: array
          items:
            $ref: '#/components/schemas/SelectedPhoto'
        total_count:
          type: integer
        coverage_metrics:
          $ref: '#/components/schemas/CoverageMetrics'

    SelectedPhoto:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        quality_score:
          type: number
        selection_reason:
          type: string
          nullable: true
          description: Why this photo was selected (quality, diversity, moment coverage, VIP)
        is_user_override:
          type: boolean
        group_id:
          type: string
          format: uuid
          nullable: true

    CoverageMetrics:
      type: object
      properties:
        moments_covered:
          type: object
          additionalProperties:
            type: integer
        vip_coverage:
          type: object
          additionalProperties:
            type: integer
        diversity_score:
          type: number

    SafetySetResult:
      type: object
      properties:
        photos:
          type: array
          items:
            type: object
            properties:
              asset_id:
                type: string
                format: uuid
              quality_score:
                type: number
              near_miss_reason:
                type: string
                description: Why this photo almost made the cut
        total_count:
          type: integer

    CurationPreset:
      type: object
      properties:
        preset_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        target_count_range:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        parameters:
          $ref: '#/components/schemas/SessionParameters'

    CreatePresetRequest:
      type: object
      required: [name, parameters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        target_count_range:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        parameters:
          $ref: '#/components/schemas/SessionParameters'

    UserPreferences:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        preference_vector:
          type: object
          description: Learned weights for quality dimensions
        sessions_analyzed:
          type: integer
        last_updated:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
