# OpenAPI Specification: Similarity Grouping API
# Feature: 023-enhanced-smart-curate
# Version: 1.0.0

openapi: 3.1.0
info:
  title: Photo Similarity Grouping API
  version: 1.0.0
  description: |
    API for similarity detection and grouping of photos using CLIP embeddings.
    Provides duplicate/near-duplicate clustering, best-shot recommendations,
    and side-by-side comparison functionality.

    **Related FRs**: FR-005 to FR-008, FR-023

servers:
  - url: /api/v1/workspaces/{workspace_id}
    description: Workspace-scoped API

paths:
  /galleries/{gallery_id}/similarity-groups:
    get:
      operationId: listSimilarityGroups
      summary: List similarity groups for gallery
      description: Returns all similarity groups (clusters of similar photos) for the gallery.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - name: min_size
          in: query
          schema:
            type: integer
            minimum: 2
            default: 2
          description: Minimum group size to include
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [size, best_quality, capture_time]
            default: size
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of similarity groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimilarityGroupSummary'
                  summary:
                    $ref: '#/components/schemas/GroupingSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: startSimilarityGrouping
      summary: Start similarity grouping analysis
      description: |
        Queues similarity analysis jobs to compute embeddings and cluster photos.
        Requires quality analysis to be complete first.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                similarity_threshold:
                  type: number
                  minimum: 0.5
                  maximum: 0.99
                  default: 0.85
                  description: Cosine similarity threshold for grouping
                force_recompute:
                  type: boolean
                  default: false
                  description: Recompute embeddings even if they exist
      responses:
        '202':
          description: Grouping started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupingJob'
        '400':
          description: Quality analysis not complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /galleries/{gallery_id}/similarity-groups/progress:
    get:
      operationId: getSimilarityGroupingProgress
      summary: Get similarity grouping progress
      description: Returns the current progress of similarity grouping for the gallery.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
      responses:
        '200':
          description: Grouping progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupingProgress'

  /galleries/{gallery_id}/similarity-groups/{group_id}:
    get:
      operationId: getSimilarityGroup
      summary: Get similarity group details
      description: Returns detailed information about a similarity group including all member photos.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/GroupId'
        - name: include_quality
          in: query
          schema:
            type: boolean
            default: true
          description: Include quality scores for each member
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityGroup'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateSimilarityGroup
      summary: Update similarity group
      description: Update group properties like best-shot selection or merge with another group.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityGroup'
        '404':
          $ref: '#/components/responses/NotFound'

  /galleries/{gallery_id}/similarity-groups/{group_id}/best-shot:
    put:
      operationId: setBestShot
      summary: Set best shot for group
      description: |
        Override AI's best-shot recommendation for a similarity group.
        The override is tracked for preference learning.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id]
              properties:
                asset_id:
                  type: string
                  format: uuid
                  description: Asset ID to set as best shot
      responses:
        '200':
          description: Best shot updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityGroup'
        '400':
          description: Asset not a member of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /galleries/{gallery_id}/similarity-groups/{group_id}/compare:
    get:
      operationId: getComparisonView
      summary: Get comparison view for group
      description: |
        Returns side-by-side comparison data for photos in a group,
        including quality deltas and recommendation explanations.
      tags: [Comparison]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - $ref: '#/components/parameters/GroupId'
        - name: asset_ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 6
          description: Specific assets to compare (default all in group up to 6)
      responses:
        '200':
          description: Comparison data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonView'

  /galleries/{gallery_id}/group-view:
    get:
      operationId: getGroupView
      summary: Get gallery in group view mode
      description: |
        Returns the gallery with one representative photo per similarity group.
        Ungrouped photos are returned individually.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [capture_time, quality_score, group_size]
            default: capture_time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Group view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupViewItem'
                  summary:
                    $ref: '#/components/schemas/GroupViewSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /assets/{asset_id}/similar:
    get:
      operationId: findSimilarAssets
      summary: Find photos similar to a specific asset
      description: |
        Returns photos visually similar to the specified asset using embedding similarity.
        Useful for ad-hoc similarity search outside of pre-computed groups.
      tags: [Similarity]
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - name: threshold
          in: query
          schema:
            type: number
            minimum: 0.5
            maximum: 0.99
            default: 0.8
          description: Minimum similarity score
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Similar assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_asset_id:
                    type: string
                    format: uuid
                  similar:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimilarAsset'

  /assets/{asset_id}/embedding:
    get:
      operationId: getAssetEmbedding
      summary: Get embedding for an asset
      description: Returns the CLIP embedding vector for the asset (if computed).
      tags: [Embeddings]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Embedding data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEmbedding'
        '404':
          description: Embedding not computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: computeAssetEmbedding
      summary: Compute embedding for an asset
      description: Triggers embedding computation for a single asset.
      tags: [Embeddings]
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '202':
          description: Embedding computation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, processing]

  /galleries/{gallery_id}/split-group:
    post:
      operationId: splitGroup
      summary: Split a similarity group
      description: Splits a group into multiple groups based on provided asset assignments.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_group_id, new_groups]
              properties:
                source_group_id:
                  type: string
                  format: uuid
                new_groups:
                  type: array
                  items:
                    type: object
                    properties:
                      asset_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
      responses:
        '200':
          description: Groups split successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimilarityGroupSummary'

  /galleries/{gallery_id}/merge-groups:
    post:
      operationId: mergeGroups
      summary: Merge multiple similarity groups
      description: Merges two or more groups into a single group.
      tags: [Groups]
      parameters:
        - $ref: '#/components/parameters/GalleryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_ids]
              properties:
                group_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 2
      responses:
        '200':
          description: Groups merged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityGroup'

components:
  parameters:
    GalleryId:
      name: gallery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SimilarityGroupSummary:
      type: object
      properties:
        group_id:
          type: string
          format: uuid
        member_count:
          type: integer
        best_asset_id:
          type: string
          format: uuid
        best_asset_thumbnail_url:
          type: string
        average_similarity:
          type: number
        best_quality_score:
          type: number
        capture_time_range:
          type: object
          properties:
            earliest:
              type: string
              format: date-time
            latest:
              type: string
              format: date-time
        is_user_modified:
          type: boolean
          description: True if user has overridden best-shot or split/merged

    SimilarityGroup:
      allOf:
        - $ref: '#/components/schemas/SimilarityGroupSummary'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/GroupMember'
            best_shot_reason:
              type: string
              description: Why this photo was selected as best
            similarity_threshold_used:
              type: number

    GroupMember:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        thumbnail_url:
          type: string
        similarity_to_centroid:
          type: number
          description: How similar to the group's average embedding
        similarity_to_best:
          type: number
          description: How similar to the best shot
        quality_score:
          type: number
          nullable: true
        is_best:
          type: boolean
        capture_time:
          type: string
          format: date-time

    GroupingSummary:
      type: object
      properties:
        total_photos:
          type: integer
        grouped_photos:
          type: integer
        ungrouped_photos:
          type: integer
        total_groups:
          type: integer
        largest_group_size:
          type: integer
        average_group_size:
          type: number
        similarity_threshold:
          type: number

    GroupingJob:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        gallery_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, embedding, clustering, completed, failed]
        photos_total:
          type: integer
        embeddings_computed:
          type: integer
        created_at:
          type: string
          format: date-time

    GroupingProgress:
      type: object
      properties:
        gallery_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [idle, computing_embeddings, clustering, completed]
        photos_total:
          type: integer
        embeddings_computed:
          type: integer
        groups_formed:
          type: integer
          nullable: true
        estimated_remaining_seconds:
          type: integer
          nullable: true
        current_stage:
          type: string
          enum: [embedding, clustering, best_shot_selection]
          nullable: true

    UpdateGroupRequest:
      type: object
      properties:
        best_asset_id:
          type: string
          format: uuid
          description: Override best shot selection
        remove_asset_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Remove assets from this group (creates new single-member group)

    ComparisonView:
      type: object
      properties:
        group_id:
          type: string
          format: uuid
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonPhoto'
        quality_deltas:
          type: array
          items:
            $ref: '#/components/schemas/QualityDelta'
        recommendation:
          type: object
          properties:
            best_asset_id:
              type: string
              format: uuid
            reason:
              type: string
            confidence:
              type: number

    ComparisonPhoto:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        thumbnail_url:
          type: string
        full_url:
          type: string
        quality_scores:
          type: object
          properties:
            overall:
              type: number
            sharpness:
              type: number
            exposure:
              type: number
            composition:
              type: number
        expression_score:
          type: number
          nullable: true
        is_ai_recommendation:
          type: boolean

    QualityDelta:
      type: object
      properties:
        asset_a_id:
          type: string
          format: uuid
        asset_b_id:
          type: string
          format: uuid
        dimension:
          type: string
          enum: [sharpness, exposure, composition, expression]
        delta:
          type: number
          description: Positive means A is better, negative means B is better
        description:
          type: string
          description: Human-readable explanation

    GroupViewItem:
      type: object
      properties:
        type:
          type: string
          enum: [group, single]
        group_id:
          type: string
          format: uuid
          nullable: true
          description: Null for ungrouped photos
        representative_asset_id:
          type: string
          format: uuid
        thumbnail_url:
          type: string
        member_count:
          type: integer
          description: 1 for ungrouped photos
        quality_score:
          type: number
        capture_time:
          type: string
          format: date-time

    GroupViewSummary:
      type: object
      properties:
        total_items:
          type: integer
          description: Groups + ungrouped photos
        groups_count:
          type: integer
        ungrouped_count:
          type: integer
        total_photos:
          type: integer
          description: Actual photo count (groups expanded)

    SimilarAsset:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        thumbnail_url:
          type: string
        similarity_score:
          type: number
        quality_score:
          type: number
          nullable: true
        is_in_same_group:
          type: boolean

    AssetEmbedding:
      type: object
      properties:
        asset_id:
          type: string
          format: uuid
        embedding_model:
          type: string
          description: Model used (e.g., ViT-B-32)
        embedding_dim:
          type: integer
          description: Embedding dimension (e.g., 512)
        computed_at:
          type: string
          format: date-time
        # Note: actual embedding vector not exposed in API for size/security

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
