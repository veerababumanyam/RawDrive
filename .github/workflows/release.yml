name: release

# Records a GitHub Release whenever a semver tag is pushed. Tagging stays the
# existing manual flow (bump package.json + frontend/package.json +
# cobolt-state.json, then `git tag vX.Y.Z && git push --tags`); this just turns
# the tag into a Release with auto-generated notes from the merged PRs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
