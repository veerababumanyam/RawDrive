name: production-gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  # Allow cd-production.yml to invoke this whole gate set against an exact
  # ref before deploying, so un-gated code can never reach production.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      # Fast, DB-free file-name scan: fail the build if a NEW migration reuses
      # an existing numeric prefix. The four historical duplicates
      # (006/133/160/164) are grandfathered (already merged + applied; never
      # renumbered); any new collision — including a THIRD file piled onto a
      # grandfathered number — fails. Runs before the Go work so it fails fast.
      # The same invariant is also asserted by the hermetic Go contract test
      # backend/internal/database/migrations/migration_number_uniqueness_test.go.
      - name: Guard against duplicate migration numbers
        run: node scripts/check-migration-numbers.mjs
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.4"
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        run: go test ./... -count=1 -timeout 120s
      - name: Go vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  # ──────────────────────────────────────────────────────────────────────
  # backend-lint: golangci-lint gate (golangci-lint v2).
  #
  # .golangci.yml (errcheck, govet, ineffassign, staticcheck, unused [v2
  # defaults] + misspell + gofmt/goimports formatters) existed in the repo but
  # was never enforced in CI — only `go test` + govulncheck ran.
  #
  # ENFORCING on NEW issues only (only-new-issues: true). The backend carries
  # ~520 pre-existing lint issues (mostly goimports/gofmt formatting + errcheck);
  # fixing all of them is a separate cleanup. only-new-issues grandfathers that
  # legacy debt and BLOCKS any PR that ADDS a new lint issue, so the codebase
  # cannot get worse and the debt is paid down as files are touched.
  #
  # golangci-lint v2 is REQUIRED: v1.x binaries are built with Go 1.24 and refuse
  # this repo's go1.25 target. v2.12.2 is built with go1.26. Config migrated to
  # the v2 schema via `golangci-lint migrate`.
  # ──────────────────────────────────────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # only-new-issues needs history to diff new code against the base.
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.4"
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout 5m
          # Block only issues introduced by the change set; grandfather the
          # ~520 pre-existing issues (tracked for incremental cleanup).
          only-new-issues: true

  # ──────────────────────────────────────────────────────────────────────
  # known-hosts-guard: prevent SSH host-key pin drift.
  #
  # deploy-prod.sh streams a source tarball over SSH and BUILDS the prod
  # image from it on the VPS, so the pinned host keys in deploy/known_hosts
  # are a supply-chain control. deploy/known_hosts.candidate is the rotation
  # staging copy; the two drifting apart silently is exactly the failure we
  # must catch. This asserts they are byte-identical and both pin all three
  # production nodes (.42 app, .44 app, .46 db).
  # ──────────────────────────────────────────────────────────────────────
  known-hosts-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - name: known_hosts == known_hosts.candidate and pin all 3 nodes
        run: |
          set -euo pipefail
          if ! cmp -s deploy/known_hosts deploy/known_hosts.candidate; then
            echo "::error::deploy/known_hosts and deploy/known_hosts.candidate differ. Reconcile them before merging."
            diff -u deploy/known_hosts deploy/known_hosts.candidate || true
            exit 1
          fi
          for ip in 187.127.142.42 187.127.142.44 187.127.142.46; do
            if ! grep -q "$ip" deploy/known_hosts; then
              echo "::error::deploy/known_hosts is missing a pinned key for $ip"
              exit 1
            fi
          done
          echo "✓ known_hosts reconciled and pins all 3 production nodes"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.22.3"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend audit
        working-directory: frontend
        run: pnpm audit --audit-level high
      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint
      - name: Design-token guard (no raw palette / backdrop-blur / arbitrary colors)
        working-directory: frontend
        run: pnpm lint:tokens
      - name: Design-token drift (design-tokens.json ↔ globals.css ↔ tokens.ts)
        working-directory: frontend
        run: node scripts/check-token-drift.mjs
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  # ──────────────────────────────────────────────────────────────────────
  # openapi: OpenAPI 3.1 spec validation for the canary-critical surface.
  #
  # Lints docs/api/openapi.yaml — the hand-written spec introduced by
  # ISSUE-004 — against the OpenAPI 3.1 schema plus the Redocly
  # `recommended` ruleset. Rule overrides (operationId deferral,
  # unused-component deferral, localhost server accepted) live in
  # `redocly.yaml` at the repo root and are auto-discovered.
  #
  # Hard-fails on errors (no continue-on-error). The initial fix pass
  # landed with zero errors and zero warnings, so any regression is a
  # real signal — the six `nullable: true` violations that this rule
  # caught on first run were OpenAPI-3.0 syntax in a file declared as
  # 3.1, which would have silently broken typed SDK generation in the
  # frontend.
  # ──────────────────────────────────────────────────────────────────────
  openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22.22.3"
      - name: Lint OpenAPI spec
        run: npx -y @redocly/cli@2.26.0 lint docs/api/openapi.yaml

  images:
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend
      - openapi
      - security
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t rawdrive-api:ci backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t rawdrive-frontend:ci frontend

  # ──────────────────────────────────────────────────────────────────────
  # security: SAST / secret / dependency scanning
  #
  # Covers ISSUE-008 inside this repo: the CoBolt sibling-dir scanner
  # wrapper is brittle on Windows hosts, so we run the real scanners here
  # in CI where Linux runners have everything we need. Three layers:
  #   - semgrep  → SAST (code patterns, security smells)
  #   - gitleaks → secret detection across full git history
  #   - trivy fs → dependency + IaC + secret scan of the filesystem
  #
  # Blocking policy (brownfield fix wave review §2.2):
  #   - gitleaks is BLOCKING. A leaked secret must stop the build. The
  #     ISSUE-001 history-rewrite plan is the one-time cleanup; gitleaks
  #     is the permanent forward guard. No continue-on-error.
  #   - semgrep and trivy are advisory during rollout — they can produce
  #     noisy first-run baselines that would block unrelated commits if
  #     we hard-gated immediately. Tighten once the baseline is tuned.
  #
  # The images job depends on this job, so a gitleaks failure now blocks
  # container publishing. Previously, `security` ran in parallel with
  # `images` and could not block a publish even without continue-on-error.
  #
  # Action pinning: gitleaks and trivy are pinned by released tag (not
  # @master) so a compromised upstream main branch cannot silently run
  # arbitrary code in CI with security-events: write permission.
  # ──────────────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # SARIF uploads to GitHub Code Scanning are intentionally omitted
      # — this repo does not have GitHub Advanced Security enabled, so
      # github/codeql-action/upload-sarif@v3 errors with
      #   ##[error]Code Security must be enabled for this repository
      #   to use code scanning
      # which used to cascade-skip gitleaks + trivy. Each scanner
      # blocks via its own exit code instead. If/when GHAS is enabled,
      # restore the upload-sarif steps and add:
      #   security-events: write
      #   actions: read
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # gitleaks needs full git history to scan every commit for
          # leaked secrets, not just the current tree.
          fetch-depth: 0

      - name: Set up Python for semgrep
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install --upgrade pip==26.1.2 semgrep==1.164.0

      - name: Run semgrep
        id: semgrep
        # SAST scan — advisory while the existing 6 findings on main
        # are triaged. To make findings blocking (SOC2 CC7.1 intent),
        # add `--error` here once the baseline is at zero.
        # --config p/ci is the Semgrep Registry's deterministic CI pack
        # (security + best-practice rules curated for build gates). We
        # previously used --config auto, but `auto` requires --metrics=on
        # because the auto-config selection is driven by registry
        # telemetry; running --config auto --metrics=off fails with
        # "Cannot create auto config when metrics are off". p/ci avoids
        # both the telemetry requirement and the variable rule-set that
        # `auto` produces — explicit ruleset = reproducible gate.
        # SARIF is written to a workflow artifact (Code Scanning is
        # disabled on this repo — see security: permissions block).
        run: |
          semgrep scan \
            --config p/ci \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            --exclude node_modules \
            --exclude _cobolt-output \
            --exclude frontend/.next \
            .

      - name: Archive semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30

      # gitleaks is BLOCKING by design — secret leakage is exactly the
      # class of finding that should stop a build. No continue-on-error.
      #
      # We run the gitleaks BINARY (MIT, free) rather than gitleaks-action,
      # because the ACTION requires a paid GITLEAKS_LICENSE for repos owned by
      # a GitHub organization (merupuai is an org), and was failing the gate
      # with "missing gitleaks license" — a licensing requirement, not a real
      # secret finding. The CLI has no such requirement and keeps the full
      # git-history scan (checkout uses fetch-depth: 0). Pinned by version.
      - name: Run gitleaks (binary, full history)
        id: gitleaks
        if: always()
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # detect scans the whole git history; --exit-code 1 makes any finding
          # fail the build; --redact keeps secret values out of the logs.
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      # trivy is BLOCKING on CRITICAL/HIGH DEPENDENCY vulns via exit-code: "1".
      # Pinned to v0.36.0 (released tag, not @master) so a compromised
      # upstream main cannot run arbitrary code in CI.
      #
      # scanners: vuln ONLY. trivy fs otherwise also runs its secret + misconfig
      # scanners, and the secret scanner was failing the gate on the SAME
      # findings gitleaks owns — but against the working tree only and with a
      # SEPARATE allowlist (.gitleaks.toml would not apply). Secret scanning is
      # the dedicated, full-history gitleaks gate above; trivy's job here is
      # Software Composition Analysis (dependency CVEs). Keeping them separate
      # means one secret allowlist, not two, and no duplicate/contradictory gate.
      - name: Run trivy filesystem scan
        id: trivy
        if: always()
        # SOC2 CC7.1: SCA findings (CRITICAL/HIGH) block the build.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Skip generated / vendored dirs. trivy already has sensible
          # defaults but these are the big ones for this repo.
          skip-dirs: node_modules,_cobolt-output,frontend/.next,backend/vendor
          # exit-code 1 causes the step (and job) to fail when CRITICAL/HIGH
          # findings are found.
          exit-code: "1"

      - name: Archive trivy SARIF
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 30
