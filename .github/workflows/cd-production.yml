name: cd-production

# Production deploy from GitHub.
#
# Automatic path:
#   main push -> this workflow rolls production from the self-hosted runner.
#
# production-gates remains the full CI gate set for PR/main hygiene, but the
# production deploy path must not depend on GitHub-hosted runner availability.
#
# Manual path:
#   workflow_dispatch remains available for rollback or operator-triggered
#   deploys of a specific ref.
#
# It requires the one-time setup in docs/runbooks/cicd.md:
#   1. Register a self-hosted runner on app Node 1 with the label `rawdrive-prod`.
#      (GitHub-hosted runners egress from rotating IPs and usually cannot reach
#       an SSH-allowlisted VPS; a self-hosted runner keeps the key on your box
#       and deploys over the internal network.)
#   2. Create a `production` Environment. Add a required reviewer only if you
#      want a human approval pause; omit it for fully automatic deploys.
#   3. Add the Environment secret RAWDRIVE_DEPLOY_SSH_KEY (the private half of
#      ~/.ssh/rawdrive_hostinger).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git ref (tag or SHA) to deploy. Empty = current main."
        required: false
        default: ""
      skip_gates:
        description: "Skip CI re-run (use for rollback to an already-gated ref)."
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false        # never cancel an in-flight rolling deploy

permissions:
  contents: read
  deployments: write

jobs:
  # Re-run the full CI gate set for manual operator deploys. Skippable only for
  # rollbacks/redeploys to a ref that already passed on main. Automatic deploys
  # from main do not wait on this job because they run on the self-hosted runner
  # path even when GitHub-hosted runners are degraded.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_gates }}
    uses: ./.github/workflows/production-gates.yml

  deploy:
    needs: [gate]
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            (inputs.skip_gates || needs.gate.result == 'success')
          )
        )
      }}
    runs-on: [self-hosted, rawdrive-prod]
    environment:
      name: production
      url: https://app.rawdrive.in
    env:
      DEPLOY_REF: ${{ inputs.deploy_ref || github.sha }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # deploy_ref is a maintainer-only workflow_dispatch input (write
          # access required to trigger), so it is trusted here.
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Write deploy key
        env:
          DEPLOY_KEY: ${{ secrets.RAWDRIVE_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

      - name: Rolling deploy (Node 1 → health → Node 2)
        env:
          SSH_KEY: ${{ runner.temp }}/deploy_key
          DEPLOY_KNOWN_HOSTS: ${{ github.workspace }}/deploy/known_hosts
          DEPLOY_REVISION: ${{ env.DEPLOY_REF }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/deploy-prod.sh
          deploy/scripts/deploy-prod.sh

      - name: Scrub deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo "- Ref: \`${{ env.DEPLOY_REF }}\`"
            echo "- Result: **${{ job.status }}**"
            echo "- Nodes: 187.127.142.42, 187.127.142.44"
          } >> "$GITHUB_STEP_SUMMARY"
