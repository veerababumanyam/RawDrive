name: branch-hygiene

# Keeps the branch list clean by deleting branches that are ALREADY MERGED
# into main (so their commits are preserved in main — deleting the ref loses
# nothing), older than 30 days, with no open PR. Protected branches and
# backup/* are never touched.
#
#   • Weekly schedule → actually deletes (criteria make this safe by construction).
#   • Manual run      → dry-run by default; set dry_run=false to delete on demand.

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not delete)"
        type: boolean
        default: true

permissions:
  contents: write              # delete merged branch refs
  pull-requests: read          # check for open PRs

jobs:
  prune:
    runs-on: ${{ fromJSON(vars.RAWDRIVE_ACTIONS_RUNNER || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0       # need full history to evaluate --merged

      - name: Prune stale merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Schedule → real delete; manual → honour the dry_run input (default true).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          AGE_DAYS: "30"
        run: |
          set -euo pipefail
          now=$(date +%s)
          age_cutoff=$(( now - AGE_DAYS * 86400 ))
          deleted=0; skipped=0; previewed=0

          echo "Mode: $([ "$DRY_RUN" = "true" ] && echo 'DRY-RUN (preview)' || echo 'DELETE')"
          echo ""

          # Remote branches fully merged into origin/main.
          git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's#^origin/##' \
            | while read -r br; do
                # Never touch protected or backup branches, or the HEAD pointer.
                case "$br" in
                  main|master|HEAD|backup/*) continue ;;
                esac

                # Must be fully merged into main.
                if ! git merge-base --is-ancestor "origin/$br" origin/main 2>/dev/null; then
                  continue
                fi

                # Age gate: last commit older than AGE_DAYS.
                ts=$(git log -1 --format=%ct "origin/$br" 2>/dev/null || echo "$now")
                if [ "$ts" -ge "$age_cutoff" ]; then
                  skipped=$((skipped+1)); continue
                fi

                # Never delete a branch with an open PR.
                open=$(gh pr list --head "$br" --state open --json number -q 'length' 2>/dev/null || echo 0)
                if [ "${open:-0}" -gt 0 ]; then
                  echo "skip   $br (open PR)"; skipped=$((skipped+1)); continue
                fi

                if [ "$DRY_RUN" = "true" ]; then
                  echo "would delete  $br (merged, $(( (now-ts)/86400 ))d old)"
                  previewed=$((previewed+1))
                else
                  if git push origin --delete "$br" >/dev/null 2>&1; then
                    echo "deleted       $br (merged, $(( (now-ts)/86400 ))d old)"
                    deleted=$((deleted+1))
                  else
                    echo "FAILED delete $br"
                  fi
                fi
              done

          {
            echo "## Branch hygiene"
            echo ""
            echo "- Mode: \`$([ "$DRY_RUN" = "true" ] && echo dry-run || echo delete)\`"
            echo "- Age threshold: ${AGE_DAYS} days"
            echo ""
            echo "See the step log above for per-branch detail. Only branches"
            echo "already merged into main were considered — no unmerged work,"
            echo "no open-PR branches, no protected/backup branches."
          } >> "$GITHUB_STEP_SUMMARY"
