name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: pgvector/pgvector:pg17
    # Mirror production planner + observability tuning so dev EXPLAIN plans match
    # prod (deploy/postgres/postgresql.conf): SSD random_page_cost, slow-query
    # log, and pg_stat_statements preloaded (PERF-05/06). The init script CREATEs
    # the pg_stat_statements view on a fresh volume.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${PROJECT_DB_NAME}
      POSTGRES_USER: ${PROJECT_USER}
      POSTGRES_PASSWORD: ${PROJECT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init/01-create-extensions.sql:/docker-entrypoint-initdb.d/01-create-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROJECT_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9.0-alpine
    ports:
      - "${VALKEY_PORT}:6379"
    # Bound memory + LRU eviction to match prod (deploy/valkey/valkey.conf) so a
    # runaway dev cache can't OOM the host (PERF-14).
    command: valkey-server --appendonly yes --appendfsync everysec --maxmemory 400mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.11-alpine
    container_name: cobolt-nats
    ports:
      - "${NATS_PORT}:4222"
      - "${NATS_MONITOR_PORT}:8222"
    command: -js -sd /data -m 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.30.1
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /app
    entrypoint: ["sleep", "infinity"]
    env_file:
      - .env
    volumes:
      # F-012 (audit 2026-04-10): was `../:/app`, which mounted the parent of
      # the repo root into the container so `/app/e2e` did not exist and
      # dockerized Playwright was unusable. `./` is resolved relative to this
      # compose file, i.e. the repo root, so /app becomes the repo root.
      - ./:/app

volumes:
  postgres_data:
  valkey_data:
  nats_data:

networks:
  default:
    name: cobolt-network-f651e4
