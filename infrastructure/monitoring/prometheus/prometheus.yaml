# Prometheus configuration for RawDrive
# Scrapes metrics from all services for 5000+ concurrent user monitoring
#
# See: specs/024-5k-concurrent-autoscale/contracts/metrics.yaml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # Labels to attach to all metrics
  external_labels:
    cluster: 'rawdrive-production'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/alerts.yaml

# Scrape configurations
scrape_configs:
  # ==========================================================================
  # Backend API Service
  # Main FastAPI application exposing /metrics endpoint
  # ==========================================================================
  - job_name: 'rawdrive-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          component: 'api'
    # In Kubernetes, use service discovery instead
    # kubernetes_sd_configs:
    #   - role: endpoints
    #     namespaces:
    #       names: ['rawdrive']

  # ==========================================================================
  # Health Endpoints for Kubernetes Probes
  # ==========================================================================
  - job_name: 'rawdrive-health'
    scrape_interval: 30s
    metrics_path: '/health/detailed'
    scheme: http
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          probe_type: 'health'
    # Convert health JSON to metrics via relabeling
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'up'
        action: keep

  # ==========================================================================
  # PgBouncer Metrics (Database Connection Pooling)
  # Critical for monitoring connection pool saturation
  # ==========================================================================
  - job_name: 'pgbouncer'
    scrape_interval: 10s
    static_configs:
      - targets: ['pgbouncer-exporter:9127']
        labels:
          service: 'pgbouncer'
          component: 'database'
    # If using built-in stats, use SHOW STATS via pg_exporter

  # ==========================================================================
  # Redis Metrics (Cache Layer)
  # Monitor connection pool and memory usage
  # ==========================================================================
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # ==========================================================================
  # Kubernetes Metrics (for HPA monitoring)
  # ==========================================================================
  # Uncomment when deploying to Kubernetes
  # - job_name: 'kubernetes-pods'
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
  #       action: keep
  #       regex: true
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
  #       action: replace
  #       target_label: __metrics_path__
  #       regex: (.+)
  #     - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
  #       action: replace
  #       regex: ([^:]+)(?::\d+)?;(\d+)
  #       replacement: $1:$2
  #       target_label: __address__
  #     - source_labels: [__meta_kubernetes_namespace]
  #       action: replace
  #       target_label: kubernetes_namespace
  #     - source_labels: [__meta_kubernetes_pod_name]
  #       action: replace
  #       target_label: kubernetes_pod_name

  # ==========================================================================
  # kube-state-metrics (HPA replicas, pod status)
  # ==========================================================================
  # - job_name: 'kube-state-metrics'
  #   static_configs:
  #     - targets: ['kube-state-metrics:8080']

  # ==========================================================================
  # Node Exporter (Host Metrics)
  # CPU, memory, disk usage at node level
  # ==========================================================================
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'

  # ==========================================================================
  # Face Detection Worker
  # ==========================================================================
  - job_name: 'face-worker'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['face-worker:8001']
        labels:
          service: 'face-worker'
          component: 'worker'

  # ==========================================================================
  # Content Analysis Worker
  # ==========================================================================
  - job_name: 'content-worker'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['content-worker:8002']
        labels:
          service: 'content-worker'
          component: 'worker'

  # ==========================================================================
  # Quality Analysis Worker
  # ==========================================================================
  - job_name: 'quality-worker'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['quality-worker:8003']
        labels:
          service: 'quality-worker'
          component: 'worker'

  # ==========================================================================
  # Invitations Microservice
  # ==========================================================================
  - job_name: 'invitations-api'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['invitations-api:8000']
        labels:
          service: 'invitations'
          component: 'api'

# Storage configuration for metrics retention
# Note: In production, use remote_write for long-term storage
# storage:
#   tsdb:
#     retention.time: 15d
#     retention.size: 10GB
