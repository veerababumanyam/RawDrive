# Promtail configuration for RawDrive log collection
# Scrapes logs from Docker containers and sends to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# Client configuration - where to send logs
clients:
  - url: http://loki:3100/loki/api/v1/push
    # Batching configuration for better performance
    batchwait: 1s
    batchsize: 1048576  # 1MB

    # External labels attached to all log lines
    external_labels:
      cluster: rawdrive
      environment: production

# Positions file to track read progress
positions:
  filename: /tmp/positions.yaml

# Scrape configurations
scrape_configs:
  # ==========================================================================
  # Docker Containers - Auto-discovery
  # ==========================================================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      # Container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Service name (from compose or k8s)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Stack name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'stack'

      # Image name
      - source_labels: ['__meta_docker_container_label_com_docker_image']
        target_label: 'image'

  # ==========================================================================
  # Client CRM Microservice
  # ==========================================================================
  - job_name: client-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["client-service"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'client-service'
        target_label: 'service'
      - replacement: 'crm'
        target_label: 'component'

    pipeline_stages:
      # Parse JSON logs from FastAPI
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            workspace_id: workspace_id
            user_id: user_id
            request_id: request_id
            endpoint: endpoint
            method: method
            status_code: status_code
            duration_ms: duration_ms

      # Extract timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Set log level as label
      - labels:
          level:
          service:
          component:
          workspace_id:
          endpoint:

      # Drop health check logs (too verbose)
      - match:
          selector: '{endpoint="/health"}'
          action: drop

  # ==========================================================================
  # Backend API Service
  # ==========================================================================
  - job_name: backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["rawdrive-backend"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'backend'
        target_label: 'service'
      - replacement: 'api'
        target_label: 'component'

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          service:

  # ==========================================================================
  # Gallery Microservice
  # ==========================================================================
  - job_name: gallery-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["gallery-service"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'gallery-service'
        target_label: 'service'
      - replacement: 'galleries'
        target_label: 'component'

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          service:

  # ==========================================================================
  # Upload Microservice
  # ==========================================================================
  - job_name: upload-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["upload-service"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'upload-service'
        target_label: 'service'
      - replacement: 'uploads'
        target_label: 'component'

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            chunk_id: chunk_id
            upload_id: upload_id
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          service:

  # ==========================================================================
  # Billing Microservice
  # ==========================================================================
  - job_name: billing-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["billing-service"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'billing-service'
        target_label: 'service'
      - replacement: 'billing'
        target_label: 'component'

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            subscription_id: subscription_id
            payment_method: payment_method
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          service:
          payment_method:

  # ==========================================================================
  # Traefik API Gateway
  # ==========================================================================
  - job_name: traefik
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["traefik"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'traefik'
        target_label: 'service'
      - replacement: 'gateway'
        target_label: 'component'

    pipeline_stages:
      # Traefik access logs (common log format)
      - regex:
          expression: '^(?P<client_ip>[\d\.]+) - (?P<user>\S+) \[(?P<timestamp>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status_code>\d+) (?P<response_size>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)" (?P<duration_ms>\d+)'
      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'
      - labels:
          service:
          component:
          method:
          status_code:

# Log level
log_level: info
