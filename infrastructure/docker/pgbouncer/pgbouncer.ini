;; PgBouncer configuration for RawDrive
;; Optimized for 5000 concurrent users with autoscaling (10-100 pods)
;; See: https://www.pgbouncer.org/config.html

[databases]
;; Connection string to PostgreSQL
;; The actual host/port will be overridden by environment variables
rawdrive = host=${POSTGRES_HOST:-rawdrive-postgres} port=${POSTGRES_PORT:-5432} dbname=${POSTGRES_DB:-rawdrive}

[pgbouncer]
;; Listen address and port
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool Mode
;; transaction: Connections are returned to pool after each transaction
;; This is optimal for web applications with short transactions
pool_mode = transaction

;; Connection Limits
;; max_client_conn: Maximum number of client connections allowed
;; At 100 pods with ~20 connections each = 2000 connections
max_client_conn = 2000

;; default_pool_size: Default number of server connections per database/user pair
;; With transaction pooling, this can be lower than client connections
default_pool_size = 50

;; min_pool_size: Minimum pool size maintained even when idle
min_pool_size = 10

;; reserve_pool_size: Extra connections for burst traffic
reserve_pool_size = 10

;; reserve_pool_timeout: How long to wait before using reserve pool
reserve_pool_timeout = 5

;; max_db_connections: Hard limit on server connections per database
;; This should be less than PostgreSQL max_connections
max_db_connections = 60

;; max_user_connections: Hard limit on connections per user
max_user_connections = 60

;; Timeouts
;; server_connect_timeout: Timeout for connecting to PostgreSQL
server_connect_timeout = 15

;; server_idle_timeout: Close server connection if unused for this long
server_idle_timeout = 600

;; server_lifetime: Close server connection after this many seconds
server_lifetime = 3600

;; client_idle_timeout: Close client connection if idle this long
client_idle_timeout = 0

;; client_login_timeout: Timeout for client authentication
client_login_timeout = 60

;; query_timeout: Maximum time a query can run (0 = disabled)
query_timeout = 0

;; query_wait_timeout: Maximum time a query can wait for a connection
query_wait_timeout = 120

;; Logging
;; admin_users: Users allowed to connect to pgbouncer admin console
admin_users = rawdrive_admin

;; stats_users: Users allowed to access read-only stats
stats_users = rawdrive_admin, rawdrive

;; log_connections: Log client connects/disconnects
log_connections = 1

;; log_disconnections: Log client disconnections
log_disconnections = 1

;; log_pooler_errors: Log pooler errors to log file
log_pooler_errors = 1

;; stats_period: How often to write stats to log
stats_period = 60

;; verbose: Increase logging verbosity
verbose = 0

;; TCP keepalive settings
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 30
tcp_keepcnt = 3

;; Application name shown in pg_stat_activity
application_name_add_host = 1

;; Ignore startup parameters that pgbouncer doesn't understand
ignore_startup_parameters = extra_float_digits,geqo
