# Traefik Dynamic Configuration for RawDrive (Local Development)
# Defines routers, middlewares, and services for local dev (HTTP only)
#
# This file is watched by Traefik and changes are applied without restart

# =============================================================================
# HTTP Configuration
# =============================================================================
http:

  # ===========================================================================
  # Routers - Define how requests are routed to services
  # ===========================================================================
  routers:
    # -------------------------------------------------------------------------
    # Traefik Dashboard (accessible at traefik.localhost)
    # -------------------------------------------------------------------------
    traefik-dashboard:
      rule: "Host(`traefik.localhost`)"
      entryPoints:
        - web
      service: api@internal
      priority: 200

    # -------------------------------------------------------------------------
    # Main API Router (localhost, HTTP only)
    # -------------------------------------------------------------------------
    api-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 100

    # -------------------------------------------------------------------------
    # Frontend Web App Router (localhost, HTTP only)
    # -------------------------------------------------------------------------
    web-router-local:
      rule: "Host(`localhost`)"
      entryPoints:
        - web
      service: frontend-service
      middlewares:
        - security-headers-dev
        - compress
      priority: 50

    # -------------------------------------------------------------------------
    # Multi-tenant Studio Subdomains (*.localhost, HTTP only)
    # -------------------------------------------------------------------------
    studio-localhost-router:
      rule: "HostRegexp(`{subdomain:[a-z0-9-]+}.localhost`)"
      entryPoints:
        - web
      service: frontend-service
      middlewares:
        - security-headers-dev
        - compress
      priority: 40

    # -------------------------------------------------------------------------
    # Upload Endpoint - Higher rate limits, larger body size
    # -------------------------------------------------------------------------
    upload-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/photos/upload`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-uploads
        - security-headers-dev
        - large-body-size
      priority: 150

    # -------------------------------------------------------------------------
    # Upload Microservice - TUS chunked uploads
    # -------------------------------------------------------------------------
    upload-service-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/uploads`)"
      entryPoints:
        - web
      service: upload-service
      middlewares:
        - rate-limit-uploads
        - security-headers-dev
        - large-body-size
        - cors-headers-dev
      priority: 155

    # -------------------------------------------------------------------------
    # Invitations Microservice
    # -------------------------------------------------------------------------
    invitations-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/invitations`)"
      entryPoints:
        - web
      service: invitations-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
      priority: 120

    # -------------------------------------------------------------------------
    # WebSocket Router - Routes to backend service (highest priority for WS)
    # -------------------------------------------------------------------------
    websocket-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/ws`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - cors-headers-dev
      priority: 160

    # -------------------------------------------------------------------------
    # Gallery Microservice - Authenticated Endpoints
    # -------------------------------------------------------------------------
    gallery-auth-router-local:
      rule: "Host(`localhost`) && (PathPrefix(`/api/v1/galleries`) || PathPrefix(`/api/v1/magic-links`))"
      entryPoints:
        - web
      service: gallery-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 140

    # -------------------------------------------------------------------------
    # Gallery Microservice - Public Endpoints
    # -------------------------------------------------------------------------
    gallery-public-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/public/galleries`)"
      entryPoints:
        - web
      service: gallery-service
      middlewares:
        - rate-limit-gallery-public
        - security-headers-dev
      priority: 135

    # -------------------------------------------------------------------------
    # Onboarding Microservice - User registration and onboarding flow
    # -------------------------------------------------------------------------
    onboarding-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/onboarding`)"
      entryPoints:
        - web
      service: onboarding-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
      priority: 140

    # -------------------------------------------------------------------------
    # Billing Microservice - Webhooks (Highest Priority)
    # -------------------------------------------------------------------------
    billing-webhooks-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/webhooks/razorpay`, `/webhooks/stripe`)"
      entryPoints:
        - web
      service: billing-service
      middlewares:
        - rate-limit-webhooks
        - security-headers-dev
      priority: 148

    # -------------------------------------------------------------------------
    # Billing Microservice - API Endpoints
    # -------------------------------------------------------------------------
    billing-api-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/subscription`)"
      entryPoints:
        - web
      service: billing-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
      priority: 145

    # -------------------------------------------------------------------------
    # Client Avatar Endpoints - Route to main backend (has full avatar service)
    # Higher priority than client-service to intercept avatar requests
    # -------------------------------------------------------------------------
    client-avatar-router-local:
      rule: "Host(`localhost`) && PathRegexp(`^/api/v1/workspaces/[0-9a-f-]+/clients/[0-9a-f-]+/avatar`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-uploads
        - security-headers-dev
        - cors-headers-dev
        - large-body-size
      priority: 170

    # -------------------------------------------------------------------------
    # Client CRM Microservice - Fix: Use PathRegexp for correct variable matching
    # -------------------------------------------------------------------------
    client-service-router-local:
      rule: "Host(`localhost`) && PathRegexp(`^/api/v1/workspaces/[0-9a-f-]+/clients`)"
      entryPoints:
        - web
      service: client-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 160

    # -------------------------------------------------------------------------
    # Notifications Microservice - Webhooks (SendGrid callbacks)
    # Higher priority to match before generic notifications routes
    # -------------------------------------------------------------------------
    notifications-webhooks-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/notifications/webhooks`)"
      entryPoints:
        - web
      service: notifications-service
      middlewares:
        - rate-limit-webhooks
        - security-headers-dev
      priority: 150

    # -------------------------------------------------------------------------
    # Notifications Microservice - API Endpoints
    # -------------------------------------------------------------------------
    notifications-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/notifications`)"
      entryPoints:
        - web
      service: notifications-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 145

    # -------------------------------------------------------------------------
    # Notifications Microservice - Preferences Endpoints
    # Higher priority to match before generic api-router-local
    # -------------------------------------------------------------------------
    notifications-preferences-router-local:
      rule: "Host(`localhost`) && PathRegexp(`^/api/v1/workspaces/[^/]+/preferences`)"
      entryPoints:
        - web
      service: notifications-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 150

    # -------------------------------------------------------------------------
    # Notifications Microservice - Event Types Endpoints  
    # Uses PathRegexp like preferences router (which works)
    # Pattern [^/]+ matches any workspace_id format (UUID with dashes)
    # -------------------------------------------------------------------------
    notifications-event-types-router-local:
      rule: "Host(`localhost`) && PathRegexp(`^/api/v1/workspaces/[^/]+/event-types`)"
      entryPoints:
        - web
      service: notifications-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 165

    # -------------------------------------------------------------------------
    # Webhooks Microservice - External webhook subscriptions
    # -------------------------------------------------------------------------
    webhooks-service-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/webhooks`)"
      entryPoints:
        - web
      service: webhooks-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
        - cors-headers-dev
      priority: 142

    # -------------------------------------------------------------------------
    # Webhooks Microservice - Admin endpoints
    # -------------------------------------------------------------------------
    webhooks-admin-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/admin/webhooks`)"
      entryPoints:
        - web
      service: webhooks-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
      priority: 147

    # -------------------------------------------------------------------------
    # SEC-001: Face Detection Endpoints - Dedicated rate limiting
    # -------------------------------------------------------------------------
    face-search-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/faces/search`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-face-search
        - security-headers-dev
        - cors-headers-dev
      priority: 175

    face-detect-router-local:
      rule: "Host(`localhost`) && PathRegexp(`^/api/v1/photos/[0-9a-f-]+/detect-faces`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-face-detect
        - security-headers-dev
        - cors-headers-dev
      priority: 175

    face-bulk-assign-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/faces/bulk-assign`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-face-bulk
        - security-headers-dev
        - cors-headers-dev
      priority: 175

    face-groups-merge-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/face-groups/merge`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-face-bulk
        - security-headers-dev
        - cors-headers-dev
      priority: 175

    # -------------------------------------------------------------------------
    # AI Service - Stricter rate limiting
    # -------------------------------------------------------------------------
    ai-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/ai`)"
      entryPoints:
        - web
      service: ai-service
      middlewares:
        - rate-limit-ai
        - security-headers-dev
      priority: 130


    # -------------------------------------------------------------------------
    # Smart Tagging Routes - AI-powered content analysis
    # Routes to ai-service FastAPI
    # Higher priority to match before generic api-router-local
    # -------------------------------------------------------------------------
    smart-tagging-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/workspaces/`) && PathRegexp(`^/api/v1/workspaces/[0-9a-f\\-]+/smart-tagging`)"
      entryPoints:
        - web
      service: ai-service
      middlewares:
        - rate-limit-ai
        - security-headers-dev
        - cors-headers-dev
      priority: 150

    # -------------------------------------------------------------------------
    # A2A Service Registry Endpoints (Phase 4: A2A Integration)
    # -------------------------------------------------------------------------
    a2a-registry-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/a2a/registry`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-a2a
        - security-headers-dev
        - a2a-headers
      priority: 165

    # -------------------------------------------------------------------------
    # A2A Agent API Keys Management (Phase 4: A2A Integration)
    # -------------------------------------------------------------------------
    a2a-api-keys-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/api/v1/workspaces/`) && PathRegexp(`/agent-api-keys`)"
      entryPoints:
        - web
      service: backend-service
      middlewares:
        - rate-limit-api
        - security-headers-dev
      priority: 142

    # -------------------------------------------------------------------------
    # Monitoring - Grafana
    # -------------------------------------------------------------------------
    grafana-router-local:
      rule: "Host(`localhost`) && PathPrefix(`/grafana`)"
      entryPoints:
        - web
      service: grafana-service
      middlewares:
        - strip-grafana-prefix
      priority: 110

  # ===========================================================================
  # Services - Backend targets
  # ===========================================================================
  services:
    backend-service:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
        healthCheck:
          path: /live
          interval: 10s
          timeout: 3s
        sticky:
          cookie:
            name: rawdrive_backend
            httpOnly: true

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
        passHostHeader: true

    invitations-service:
      loadBalancer:
        servers:
          - url: "http://invitations-api:8007"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    gallery-service:
      loadBalancer:
        servers:
          - url: "http://gallery-service:8004"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        sticky:
          cookie:
            name: rawdrive_gallery
            httpOnly: true

    onboarding-service:
      loadBalancer:
        servers:
          - url: "http://onboarding-service:8006"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    billing-service:
      loadBalancer:
        servers:
          - url: "http://billing-service:8005"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    client-service:
      loadBalancer:
        servers:
          - url: "http://client-service:8011"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        sticky:
          cookie:
            name: rawdrive_client
            httpOnly: true

    upload-service:
      loadBalancer:
        servers:
          - url: "http://upload-service:8008"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    notifications-service:
      loadBalancer:
        servers:
          - url: "http://notifications-service:8010"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    webhooks-service:
      loadBalancer:
        servers:
          - url: "http://webhooks-service:8015"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    ai-service:
      loadBalancer:
        servers:
          - url: "http://ai-service:8013"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    grafana-service:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

  # ===========================================================================
  # Middlewares
  # ===========================================================================
  middlewares:
    # -------------------------------------------------------------------------
    # Rate Limiting (Relaxed for local dev)
    # -------------------------------------------------------------------------
    rate-limit-api:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-uploads:
      rateLimit:
        average: 20
        burst: 40
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-ai:
      rateLimit:
        average: 10
        burst: 20
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-gallery-public:
      rateLimit:
        average: 1000
        burst: 2000
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-webhooks:
      rateLimit:
        average: 100
        burst: 200
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-a2a:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    # -------------------------------------------------------------------------
    # SEC-001: Face Detection Rate Limiting (Relaxed for local dev)
    # -------------------------------------------------------------------------
    rate-limit-face-search:
      rateLimit:
        average: 200  # 200/min in dev (20/min in prod)
        burst: 400
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-face-detect:
      rateLimit:
        average: 10000  # 10000/day in dev (1000/day in prod)
        burst: 20000
        period: 1440m  # 24 hours
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-face-bulk:
      rateLimit:
        average: 300  # 300/min in dev (30/min in prod)
        burst: 600
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # -------------------------------------------------------------------------
    # Security Headers (Relaxed for local dev)
    # -------------------------------------------------------------------------
    security-headers-dev:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: false  # Allow iframe for local dev
        customFrameOptionsValue: "SAMEORIGIN"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # -------------------------------------------------------------------------
    # CORS Configuration (Permissive for local dev)
    # -------------------------------------------------------------------------
    cors-headers-dev:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Request-ID
          - X-Workspace-ID
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:80"
          - "http://localhost"
          - "http://localhost:5173"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
        addVaryHeader: true

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------
    compress:
      compress:
        excludedContentTypes:
          - text/event-stream

    # -------------------------------------------------------------------------
    # Large Body Size for Uploads
    # -------------------------------------------------------------------------
    large-body-size:
      buffering:
        maxRequestBodyBytes: 524288000  # 500MB

    # -------------------------------------------------------------------------
    # Strip Prefix
    # -------------------------------------------------------------------------
    strip-grafana-prefix:
      stripPrefix:
        prefixes:
          - /grafana

    # -------------------------------------------------------------------------
    # A2A Service Headers (Phase 4: A2A Integration)
    # -------------------------------------------------------------------------
    a2a-headers:
      headers:
        customRequestHeaders:
          X-A2A-Enabled: "true"
          X-Service-Name: "traefik-gateway"
        customResponseHeaders:
          X-A2A-Version: "1.0"

# =============================================================================
# TCP Configuration (for future use)
# =============================================================================
# tcp: {} # Commented out - Traefik v3 doesn't allow empty tcp sections
