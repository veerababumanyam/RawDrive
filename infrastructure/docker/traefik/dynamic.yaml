# Traefik Dynamic Configuration for RawDrive
# Defines routers, middlewares, and services
#
# This file is watched by Traefik and changes are applied without restart

# =============================================================================
# HTTP Configuration
# =============================================================================
http:

  # ===========================================================================
  # Routers - Define how requests are routed to services
  # ===========================================================================
  routers:
    # -------------------------------------------------------------------------
    # Main API Router
    # -------------------------------------------------------------------------
    api-router:
      rule: "Host(`api.rawdrive.ai`) || (Host(`rawdrive.ai`) && PathPrefix(`/api`))"
      entryPoints:
        - websecure
      service: backend-service
      middlewares:
        - rate-limit-api
        - security-headers
        - cors-headers
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Frontend Web App Router
    # -------------------------------------------------------------------------
    web-router:
      rule: "Host(`rawdrive.ai`) || Host(`www.rawdrive.ai`)"
      entryPoints:
        - websecure
      service: frontend-service
      middlewares:
        - security-headers
        - compress
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Multi-tenant Studio Subdomains (*.rawdrive.ai)
    # -------------------------------------------------------------------------
    studio-router:
      rule: "HostRegexp(`{subdomain:[a-z0-9-]+}.rawdrive.ai`)"
      entryPoints:
        - websecure
      service: frontend-service
      middlewares:
        - security-headers
        - compress
      tls:
        certResolver: letsencrypt
        domains:
          - main: "rawdrive.ai"
            sans:
              - "*.rawdrive.ai"

    # -------------------------------------------------------------------------
    # Local Development Multi-tenant Subdomains (*.localhost)
    # -------------------------------------------------------------------------
    studio-localhost-router:
      rule: "HostRegexp(`{subdomain:[a-z0-9-]+}.localhost`)"
      entryPoints:
        - web
      service: frontend-service
      middlewares:
        - security-headers
        - compress

    # -------------------------------------------------------------------------
    # Upload Endpoint - Higher rate limits, larger body size
    # -------------------------------------------------------------------------
    upload-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/photos/upload`)"
      entryPoints:
        - websecure
      service: backend-service
      middlewares:
        - rate-limit-uploads
        - security-headers
        - large-body-size
      priority: 100
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Upload Microservice - TUS chunked uploads
    # -------------------------------------------------------------------------
    upload-service-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/uploads`)"
      entryPoints:
        - websecure
      service: upload-service
      middlewares:
        - rate-limit-uploads
        - security-headers
        - large-body-size
        - cors-headers
      priority: 135
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Magic Links - Public gallery access
    # -------------------------------------------------------------------------
    magic-link-router:
      rule: "Host(`rawdrive.ai`) && PathPrefix(`/g/`)"
      entryPoints:
        - websecure
      service: frontend-service
      middlewares:
        - rate-limit-public
        - security-headers
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Invitations Microservice
    # -------------------------------------------------------------------------
    invitations-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/invitations`)"
      entryPoints:
        - websecure
      service: invitations-service
      middlewares:
        - rate-limit-api
        - security-headers
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Gallery Microservice - Authenticated Endpoints
    # -------------------------------------------------------------------------
    gallery-auth-router:
      rule: "Host(`api.rawdrive.ai`) && (PathPrefix(`/api/v1/galleries`) || PathPrefix(`/api/v1/magic-links`))"
      entryPoints:
        - websecure
      service: gallery-service
      middlewares:
        - rate-limit-api
        - security-headers
        - cors-headers
      priority: 140
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Gallery Microservice - Public Endpoints
    # -------------------------------------------------------------------------
    gallery-public-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/public/galleries`)"
      entryPoints:
        - websecure
      service: gallery-service
      middlewares:
        - rate-limit-public
        - security-headers
      priority: 135
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Onboarding Microservice - User registration and onboarding flow
    # -------------------------------------------------------------------------
    onboarding-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/onboarding`)"
      entryPoints:
        - websecure
      service: onboarding-service
      middlewares:
        - rate-limit-api
        - security-headers
      priority: 140
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Billing Microservice - Webhooks (Highest Priority)
    # -------------------------------------------------------------------------
    billing-webhooks-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/webhooks/razorpay`, `/webhooks/stripe`)"
      entryPoints:
        - websecure
      service: billing-service
      middlewares:
        - rate-limit-webhooks
        - security-headers
      priority: 148
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Billing Microservice - API Endpoints
    # -------------------------------------------------------------------------
    billing-api-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/subscription`)"
      entryPoints:
        - websecure
      service: billing-service
      middlewares:
        - rate-limit-api
        - security-headers
      priority: 145
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Client CRM Microservice
    # -------------------------------------------------------------------------
    client-service-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/workspaces/{workspace_id:[0-9a-f-]+}/clients`)"
      entryPoints:
        - websecure
      service: client-service
      middlewares:
        - rate-limit-api
        - security-headers
        - cors-headers
      priority: 138
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # LiveSync Service - Real-time photo sync from camera/folder to gallery
    # -------------------------------------------------------------------------
    livesync-service-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/livesync`)"
      entryPoints:
        - websecure
      service: livesync-service
      middlewares:
        - rate-limit-api
        - security-headers
        - cors-headers
      priority: 130
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Gallery Service - MCP Tools (Highest Priority)
    # -------------------------------------------------------------------------
    gallery-mcp-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/mcp/gallery/`)"
      entryPoints:
        - websecure
      service: gallery-service
      middlewares:
        - rate-limit-mcp
        - security-headers
        - cors-headers
      priority: 155
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Gallery Service - A2A Agent Endpoints
    # -------------------------------------------------------------------------
    gallery-agents-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/agents/`)"
      entryPoints:
        - websecure
      service: gallery-service
      middlewares:
        - rate-limit-agents
        - security-headers
        - cors-headers
      priority: 150
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Gallery Service - WebSocket Agent Notifications
    # -------------------------------------------------------------------------
    gallery-websocket-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/ws/agents/`)"
      entryPoints:
        - websecure
      service: gallery-service
      middlewares:
        - security-headers
        - cors-headers
      priority: 148
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Gallery Service - Batch Operations
    # -------------------------------------------------------------------------
    gallery-batch-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/batch/`)"
      entryPoints:
        - websecure
      service: gallery-service
      middlewares:
        - rate-limit-batch
        - security-headers
        - cors-headers
      priority: 146
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Notifications Microservice - Webhooks (SendGrid callbacks)
    # Higher priority to match before generic notifications routes
    # -------------------------------------------------------------------------
    notifications-webhooks-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/notifications/webhooks`)"
      entryPoints:
        - websecure
      service: notifications-service
      middlewares:
        - rate-limit-webhooks
        - security-headers
      priority: 145
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Notifications Microservice - API Endpoints
    # -------------------------------------------------------------------------
    notifications-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/notifications`)"
      entryPoints:
        - websecure
      service: notifications-service
      middlewares:
        - rate-limit-api
        - security-headers
        - cors-headers
      priority: 140
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # LiveSync Service - Local Development
    # -------------------------------------------------------------------------
    livesync-service-localhost-router:
      rule: "PathPrefix(`/api/v1/livesync`)"
      entryPoints:
        - web
      service: livesync-service
      middlewares:
        - rate-limit-api
        - cors-headers
      priority: 130

    # -------------------------------------------------------------------------
    # AI Service - Stricter rate limiting
    # -------------------------------------------------------------------------
    ai-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/ai`)"
      entryPoints:
        - websecure
      service: backend-service
      middlewares:
        - rate-limit-ai
        - security-headers
      priority: 100
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Smart Tagging Routes - AI-powered content analysis
    # Routes to ai-service FastAPI
    # -------------------------------------------------------------------------
    smart-tagging-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/workspaces/`) && PathRegexp(`/api/v1/workspaces/[0-9a-f-]+/smart-tagging`)"
      entryPoints:
        - websecure
      service: ai-service
      middlewares:
        - rate-limit-ai
        - security-headers
        - cors-headers
      priority: 132
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # A2A Service Registry Endpoints (Phase 4: A2A Integration)
    # -------------------------------------------------------------------------
    a2a-registry-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/a2a/registry`)"
      entryPoints:
        - websecure
      service: backend-service
      middlewares:
        - rate-limit-a2a
        - security-headers
        - a2a-headers
      priority: 165
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # A2A Agent API Keys Management (Phase 4: A2A Integration)
    # -------------------------------------------------------------------------
    a2a-api-keys-router:
      rule: "Host(`api.rawdrive.ai`) && PathPrefix(`/api/v1/workspaces/`) && PathRegexp(`/agent-api-keys`)"
      entryPoints:
        - websecure
      service: backend-service
      middlewares:
        - rate-limit-api
        - security-headers
      priority: 142
      tls:
        certResolver: letsencrypt

    # -------------------------------------------------------------------------
    # Monitoring (Internal access only)
    # -------------------------------------------------------------------------
    grafana-router:
      rule: "Host(`monitoring.rawdrive.ai`) && PathPrefix(`/grafana`)"
      entryPoints:
        - websecure
      service: grafana-service
      middlewares:
        - strip-grafana-prefix
        - basic-auth
      tls:
        certResolver: letsencrypt

  # ===========================================================================
  # Services - Backend targets
  # ===========================================================================
  services:
    backend-service:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        sticky:
          cookie:
            name: rawdrive_backend
            secure: true
            httpOnly: true

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
        passHostHeader: true

    invitations-service:
      loadBalancer:
        servers:
          - url: "http://invitations-api:8007"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    upload-service:
      loadBalancer:
        servers:
          - url: "http://upload-service:8008"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    livesync-service:
      loadBalancer:
        servers:
          - url: "http://livesync-service:8007"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    notifications-service:
      loadBalancer:
        servers:
          - url: "http://notifications-service:8007"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    gallery-service:
      loadBalancer:
        servers:
          - url: "http://gallery-service:8004"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        sticky:
          cookie:
            name: rawdrive_gallery_agent
            secure: true
            httpOnly: true

    grafana-service:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    onboarding-service:
      loadBalancer:
        servers:
          - url: "http://onboarding-service:8006"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    billing-service:
      loadBalancer:
        servers:
          - url: "http://billing-service:8005"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    client-service:
      loadBalancer:
        servers:
          - url: "http://client-service:8011"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s
        sticky:
          cookie:
            name: rawdrive_client
            secure: true
            httpOnly: true

  # ===========================================================================
  # Middlewares
  # ===========================================================================
  middlewares:
    # -------------------------------------------------------------------------
    # Rate Limiting (Critical for KEDA scaling decisions)
    # -------------------------------------------------------------------------
    rate-limit-global:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    rate-limit-api:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-uploads:
      rateLimit:
        average: 10
        burst: 20
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-ai:
      rateLimit:
        average: 5
        burst: 10
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-public:
      rateLimit:
        average: 30
        burst: 60
        period: 1s

    rate-limit-webhooks:
      rateLimit:
        average: 100
        burst: 200
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-mcp:
      rateLimit:
        average: 100
        burst: 200
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-a2a:
      rateLimit:
        average: 50
        burst: 100
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-agents:
      rateLimit:
        average: 50
        burst: 100
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    rate-limit-batch:
      rateLimit:
        average: 20
        burst: 40
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # -------------------------------------------------------------------------
    # CORS Configuration
    # -------------------------------------------------------------------------
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Request-ID
          - X-Workspace-ID
        accessControlAllowOriginList:
          - "https://rawdrive.ai"
          - "https://www.rawdrive.ai"
          - "https://*.rawdrive.ai"
        accessControlMaxAge: 86400
        addVaryHeader: true

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------
    compress:
      compress:
        excludedContentTypes:
          - text/event-stream

    # -------------------------------------------------------------------------
    # Large Body Size for Uploads
    # -------------------------------------------------------------------------
    large-body-size:
      buffering:
        maxRequestBodyBytes: 524288000  # 500MB

    # -------------------------------------------------------------------------
    # Basic Auth for Admin Routes
    # -------------------------------------------------------------------------
    basic-auth:
      basicAuth:
        users:
          - "admin:$apr1$H6uskkkW$IgXLP6ewTrSuBkTrqE8wj/"  # Change in production!
        removeHeader: true

    # -------------------------------------------------------------------------
    # Strip Prefix
    # -------------------------------------------------------------------------
    strip-grafana-prefix:
      stripPrefix:
        prefixes:
          - /grafana

    # -------------------------------------------------------------------------
    # A2A Service Headers (Phase 4: A2A Integration)
    # -------------------------------------------------------------------------
    a2a-headers:
      headers:
        customRequestHeaders:
          X-A2A-Enabled: "true"
          X-Service-Name: "traefik-gateway"
        customResponseHeaders:
          X-A2A-Version: "1.0"

# =============================================================================
# TCP Configuration (for future use)
# =============================================================================
tcp: {}

# =============================================================================
# TLS Options
# =============================================================================
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
