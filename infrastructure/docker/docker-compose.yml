      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT: ${CIRCUIT_BREAKER_RECOVERY_TIMEOUT:-30}

      # Metrics
      METRICS_ENABLED: true
      METRICS_CUSTOM_PREFIX: billing
      PORT: ${PORT_BILLING}
    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_BILLING}:${PORT_BILLING}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_BILLING}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Client CRM Microservice
  # Comprehensive client relationship management with gallery linking, activity tracking,
  # visitor conversion, and KEDA autoscaling (2-20 replicas)
  # ============================================================================
  client-service:
    build:
      context: ../../services/client-service
      dockerfile: Dockerfile
    container_name: rawdrive-client-service
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service
      SERVICE_NAME: client-service
      SERVICE_VERSION: "1.0.0"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database (shared with backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      # Reduced pool size: 4 workers × 3 min = 12 connections total
      DB_POOL_MIN_SIZE: 2
      DB_POOL_MAX_SIZE: 10
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-60}

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      # Redis - 3-tier caching (L1: 5min, L2: 2min, L3: 30sec)
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      REDIS_MAX_CONNECTIONS: ${CLIENT_REDIS_MAX_CONNECTIONS:-30}
      REDIS_KEY_PREFIX: "client:"

      # JWT (must match backend - EdDSA with public key)
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: EdDSA

      # CORS
      CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: "100/minute"
      RATE_LIMIT_IMPORT: "10/hour"
      RATE_LIMIT_EXPORT: "20/hour"
      RATE_LIMIT_BULK_OPS: "30/minute"

      # Cache TTLs (seconds)
      CACHE_TTL_CLIENT_METADATA: 300 # 5 min - L1
      CACHE_TTL_CLIENT_DETAILS: 120 # 2 min - L2
      CACHE_TTL_ACTIVITY_TIMELINE: 30 # 30 sec - L3
      CACHE_TTL_SMART_LIST: 180 # 3 min

      # Import/Export Settings
      IMPORT_MAX_FILE_SIZE_MB: 10
      IMPORT_MAX_RECORDS: 10000
      EXPORT_BATCH_SIZE: 1000

      # Duplicate Detection
      DUPLICATE_SIMILARITY_THRESHOLD: 0.85
      DUPLICATE_EMAIL_FUZZY_MATCH: "true"

      # Storage (R2) for client avatars
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-rawdrive}

      # Circuit Breaker
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT: ${CIRCUIT_BREAKER_RECOVERY_TIMEOUT:-30}

      # Metrics
      METRICS_ENABLED: "true"
      METRICS_CUSTOM_PREFIX: client

      PORT: ${PORT_CLIENT:-8011}

    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_CLIENT:-8011}:${PORT_CLIENT:-8011}"

    volumes:
      # Mount JWT public key for token verification
      - ../../backend/secrets/ed25519_public_key.pem:/run/secrets/jwt_public_key:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_CLIENT:-8011}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Notifications Microservice
  # Centralized notification service for multi-channel communications
  # Handles email (SendGrid), SMS (Twilio placeholder), and in-app notifications
  # Supports user preferences, templating, delivery tracking, and digest aggregation
  # ============================================================================
  notifications-service:
    build:
      context: ../../services/notifications-service
      dockerfile: Dockerfile
    container_name: rawdrive-notifications-service
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service
      SERVICE_NAME: notifications-service
      SERVICE_VERSION: "1.0.0"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database (shared with backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      DB_POOL_MIN_SIZE: ${NOTIFICATIONS_DB_POOL_MIN_SIZE:-10}
      DB_POOL_MAX_SIZE: ${NOTIFICATIONS_DB_POOL_MAX_SIZE:-50}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-60}

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      # Redis - Caching and queue management
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      REDIS_MAX_CONNECTIONS: ${NOTIFICATIONS_REDIS_MAX_CONNECTIONS:-30}
      REDIS_KEY_PREFIX: "notifications:"

      # JWT (must match backend - backend uses EdDSA with public/private key pairs)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM:-EdDSA}

      # CORS
      CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: "100/minute"
      RATE_LIMIT_SEND_NOTIFICATION: "50/minute"
      RATE_LIMIT_WEBHOOK: "500/minute"

      # Email Provider - SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${EMAIL_FROM_ADDRESS:-noreply@rawdrive.ai}
      SENDGRID_FROM_NAME: ${EMAIL_FROM_NAME:-RawDrive}
      SENDGRID_WEBHOOK_SIGNING_KEY: ${SENDGRID_WEBHOOK_SIGNING_KEY:-}

      # SMS Provider - Twilio (placeholder for Phase 1)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMS_ENABLED: "false"

      # Cache TTLs (seconds)
      CACHE_TTL_PREFERENCES: 300
      CACHE_TTL_TEMPLATE: 600
      CACHE_TTL_DELIVERY_STATUS: 120

      # Queue Settings
      QUEUE_BATCH_SIZE: 100
      QUEUE_RETRY_MAX_ATTEMPTS: 3
      QUEUE_RETRY_DELAY_SECONDS: 60

      # Digest Settings
      DIGEST_ENABLED: "true"
      DIGEST_MIN_INTERVAL_MINUTES: 60
      DIGEST_MAX_ITEMS: 20

      # Delivery Tracking
      DELIVERY_TRACKING_ENABLED: "true"
      DELIVERY_TRACKING_TTL_DAYS: 30

      # Circuit Breaker
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT: ${CIRCUIT_BREAKER_RECOVERY_TIMEOUT:-30}

      # Metrics
      METRICS_ENABLED: "true"
      METRICS_CUSTOM_PREFIX: notifications

      PORT: ${PORT_NOTIFICATIONS:-8010}

    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_NOTIFICATIONS:-8010}:${PORT_NOTIFICATIONS:-8010}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_NOTIFICATIONS:-8010}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    volumes:
      # Mount JWT public key for token verification (EdDSA)
      - ../../backend/secrets/ed25519_public_key.pem:/run/secrets/jwt_public_key:ro

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Webhooks Microservice
  # Event-driven webhook delivery system for external integrations
  # Supports HMAC-SHA256 signatures, exponential backoff retry, and circuit breaker
  # ============================================================================
  webhooks-service:
    build:
      context: ../../services/webhooks-service
      dockerfile: Dockerfile
    container_name: rawdrive-webhooks-service
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service
      SERVICE_NAME: webhooks-service
      SERVICE_VERSION: "1.0.0"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database (shared with backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      DB_POOL_MIN_SIZE: ${WEBHOOKS_DB_POOL_MIN_SIZE:-5}
      DB_POOL_MAX_SIZE: ${WEBHOOKS_DB_POOL_MAX_SIZE:-30}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-60}

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      # Redis - Circuit breaker state and caching
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      REDIS_MAX_CONNECTIONS: ${WEBHOOKS_REDIS_MAX_CONNECTIONS:-30}
      REDIS_KEY_PREFIX: "webhooks:"

      # JWT (must match backend)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

      # CORS
      CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: "100/minute"
      RATE_LIMIT_DELIVERY: "1000/minute"

      # Kafka (optional - for event consumption)
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_CONSUMER_GROUP: webhooks-service

      # Webhook Delivery Settings
      DELIVERY_TIMEOUT_SECONDS: 30
      DELIVERY_MAX_RETRIES: 5
      DELIVERY_RETRY_SCHEDULE: "10,60,300,1800,3600"
      DELIVERY_CONCURRENT_LIMIT: 50

      # Circuit Breaker
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT: ${CIRCUIT_BREAKER_RECOVERY_TIMEOUT:-60}
      CIRCUIT_BREAKER_HALF_OPEN_SUCCESSES: 2

      # Signature Settings
      SIGNATURE_MAX_TIMESTAMP_AGE: 300

      # Metrics
      METRICS_ENABLED: "true"
      METRICS_CUSTOM_PREFIX: webhooks

      PORT: ${PORT_WEBHOOKS:-8015}

    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_WEBHOOKS:-8015}:${PORT_WEBHOOKS:-8015}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_WEBHOOKS:-8015}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Upload Microservice
  # Dedicated service for high-performance bulk file uploads with TUS protocol
  # Supports chunked uploads with Redis buffering and KEDA autoscaling
  # ============================================================================
  upload-service:
    build:
      context: ../../services/upload-service
      dockerfile: Dockerfile
    container_name: rawdrive-upload-service
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service
      SERVICE_NAME: upload-service
      SERVICE_VERSION: "1.0.0"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: DEBUG
      HOST: 0.0.0.0
      PORT: ${PORT_UPLOAD}

      # Database (shared with backend)
      DATABASE_URL: postgresql+asyncpg://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DB_POOL_MIN_SIZE: ${UPLOAD_DB_POOL_MIN_SIZE:-5}
      DB_POOL_MAX_SIZE: ${UPLOAD_DB_POOL_MAX_SIZE:-20}

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      # Redis - Chunk buffering
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      REDIS_MAX_CONNECTIONS: ${UPLOAD_REDIS_MAX_CONNECTIONS:-50}

      # Chunk settings
      CHUNK_TTL_SECONDS: 86400
      CHUNK_METADATA_TTL_SECONDS: 86400
      MAX_CHUNK_SIZE_BYTES: 10485760

      # TUS Protocol
      TUS_RESUMABLE_VERSION: "1.0.0"
      TUS_MAX_SIZE: 2147483648
      TUS_EXTENSIONS: "creation,creation-with-upload,termination,checksum"

      # JWT (must match backend)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-EdDSA}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: rawdrive

      # CORS (JSON array format for proper parsing)
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8000","https://rawdrive.in","https://www.rawdrive.in","https://rawdrive.ai","https://www.rawdrive.ai"]'

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

      # Storage (R2)
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-rawdrive}

      # Encryption
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}

      # Kafka (for event publishing)
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TOPIC_ASSET_PROCESSING: asset-processing

      # Metrics
      METRICS_ENABLED: true

    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      # Changed from 8080 to 8081 to avoid conflict with Traefik dashboard
      - "127.0.0.1:${PORT_UPLOAD}:${PORT_UPLOAD}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/upload-service:/app
      - ../../backend/secrets/ed25519_public_key.pem:/run/secrets/jwt_public_key:ro

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_UPLOAD}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # AI Processing Service
  # Handles duplicate detection, content moderation, and AI tagging
  # ============================================================================
  ai-processing-service:
    build:
      context: ../../services/ai-processing-service
      dockerfile: Dockerfile
    container_name: rawdrive-ai-processing
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PORT: ${PORT_AI_PROCESSING:-8012}
      DATABASE_URL: postgresql+asyncpg://rawdrive:rawdrive@postgres:5432/${POSTGRES_DB:-rawdrive}
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
    ports:
      - "127.0.0.1:${PORT_AI_PROCESSING:-8012}:${PORT_AI_PROCESSING:-8012}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # AI Service (MCP)
  # Workspace agent tools and RAG integration
  # ============================================================================
  ai-service:
    build:
      context: ../../services/ai-service
      dockerfile: Dockerfile
    container_name: rawdrive-ai-service-mcp
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service configuration
      PORT_AI_SERVICE: ${PORT_AI_SERVICE:-8013}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database connection
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:5432/${POSTGRES_DB:-rawdrive}
      DB_POOL_MIN_SIZE: 2
      DB_POOL_MAX_SIZE: 10
      DB_COMMAND_TIMEOUT: 60

      # Redis
      REDIS_URL: redis://redis:6379/0

      # AI Processing integration
      AI_PROCESSING_URL: http://ai-processing-service:${PORT_AI_PROCESSING:-8012}

      # Milvus Vector DB
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530

      # JWT Authentication (EdDSA with public key)
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: EdDSA
      JWT_ISSUER: rawdrive

      # CORS - Security hardening (comma-separated list)
      ALLOWED_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8000}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: "100/minute"
      RATE_LIMIT_HEALTH: "60/minute"
      RATE_LIMIT_AI_FILTER: "30/minute"

      # Circuit Breaker
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT: ${CIRCUIT_BREAKER_RECOVERY_TIMEOUT:-30}

      # Prometheus Metrics
      METRICS_ENABLED: "true"

    ports:
      - "127.0.0.1:${PORT_AI_SERVICE:-8013}:${PORT_AI_SERVICE:-8013}"

    volumes:
      # Mount JWT public key for token verification
      - ../../backend/secrets/ed25519_public_key.pem:/run/secrets/jwt_public_key:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_AI_SERVICE:-8013}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Prometheus - Metrics Collection (for production monitoring)
  # ============================================================================
  # ============================================================================
  # Milvus - Vector Database
  # Handles face and image embeddings for high-performance similarity search
  # ============================================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rawdrive-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:${PORT_ETCD:-2379} -listen-client-urls http://0.0.0.0:${PORT_ETCD:-2379} --data-dir /etcd
    ports:
      - "127.0.0.1:${PORT_ETCD:-2379}:${PORT_ETCD:-2379}"
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rawdrive-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:${PORT_MINIO:-9000}:9000"
      - "127.0.0.1:${PORT_MINIO_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: rawdrive-milvus
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:${PORT_ETCD:-2379}
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:${PORT_MILVUS:-19530}:19530"
      - "127.0.0.1:${PORT_MILVUS_METRICS:-9091}:9091"
    depends_on:
      - "etcd"
      - "minio"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: rawdrive-prometheus
    restart: unless-stopped
    user: root
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:${PORT_PROMETHEUS}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../monitoring/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ../monitoring/prometheus/traefik-alerts.yaml:/etc/prometheus/traefik-alerts.yaml:ro
      - ../monitoring/prometheus/client-service-alerts.yaml:/etc/prometheus/client-service-alerts.yaml:ro
      - ../monitoring/prometheus/webhooks-service-alerts.yaml:/etc/prometheus/webhooks-service-alerts.yaml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT_PROMETHEUS}/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
  loki_data:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  traefik_letsencrypt:
    name: rawdrive-traefik-letsencrypt
  traefik_logs:
    name: rawdrive-traefik-logs
  etcd_data:
  minio_data:
  milvus_data:


networks:
  default:
    name: rawdrive-network
    driver: bridge
