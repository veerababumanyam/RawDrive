      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_API: "1000/minute"
      RATE_LIMIT_WEBHOOK: "100/minute"

      # Payment Providers
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}

      # Invoice Settings
      INVOICE_PDF_STORAGE_PATH: workspaces/{workspace_id}/invoices/
      GST_NUMBER: ${GST_NUMBER:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_NAME: ${COMPANY_NAME:-RawDrive}

      # Subscription Settings
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      GRACE_PERIOD_DAYS: ${GRACE_PERIOD_DAYS:-7}

      # Storage (R2) for invoice PDFs
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
