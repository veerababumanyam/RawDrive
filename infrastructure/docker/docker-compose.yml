services:
  # ============================================================================
  # Traefik - Cloud-Native API Gateway
  # ============================================================================
  traefik:
    image: traefik:v3.0
    container_name: rawdrive-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # HTTP - redirects to HTTPS
      - "${PORT_TRAEFIK_HTTP}:80"
      # HTTPS - main entry point
      - "${PORT_TRAEFIK_HTTPS}:443"
      # Dashboard (dev only, disable in prod)
      - "127.0.0.1:${PORT_TRAEFIK_DASHBOARD}:8080"
      # Metrics for Prometheus/KEDA
      - "127.0.0.1:${PORT_TRAEFIK_METRICS}:8082"
    volumes:
      # Traefik configuration (use dev config for local development)
      - ./traefik/traefik.dev.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic.dev.yaml:/etc/traefik/dynamic.yaml:ro
      # Docker socket for service discovery (Windows Docker Desktop)
      - //var/run/docker.sock:/var/run/docker.sock:ro
      # Let's Encrypt certificates
      - traefik_letsencrypt:/letsencrypt
      # Logs
      - traefik_logs:/var/log/traefik
    environment:
      # Cloudflare DNS challenge (for wildcard certs)
      # CF_API_EMAIL: ${CF_API_EMAIL:-}
      # CF_API_KEY: ${CF_API_KEY:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@rawdrive.ai}
    # NOTE: All routing is defined in dynamic.dev.yaml (File Provider)
    # No Docker labels needed - dashboard router is in dynamic.dev.yaml
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
    depends_on:
      backend:
        condition: service_started

  postgres:
    # timescaledb-ha:pg16 - Official TimescaleDB High Availability image
    # Includes: PostgreSQL 16, pgvector (0.8.1), pgvectorscale (0.9.0), TimescaleDB (2.24.0)
    # pgvectorscale provides StreamingDiskANN indexes for optimal vector search at scale
    image: timescale/timescaledb-ha:pg16
    container_name: rawdrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rawdrive}
      POSTGRES_USER: ${POSTGRES_USER:-rawdrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rawdrive}
    # Expose port to host for local development
    ports:
      - "127.0.0.1:${PORT_POSTGRES}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/enable_pgvector.sql:/docker-entrypoint-initdb.d/enable_pgvector.sql:ro
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-rawdrive}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rawdrive-redis
    restart: unless-stopped
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    # Expose port to host for local development
    ports:
      - "127.0.0.1:${PORT_REDIS}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PgBouncer - Connection Pooler for PostgreSQL
  # Required for scaling to 5000+ concurrent users (50+ pods × 20 connections each)
  # Uses transaction pooling mode for optimal connection reuse
  # ============================================================================
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: rawdrive-pgbouncer
    restart: unless-stopped
    environment:
      # PostgreSQL connection settings
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DB: ${POSTGRES_DB:-rawdrive}
      DATABASES_USER: ${POSTGRES_USER:-rawdrive}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-rawdrive}
      # PgBouncer admin password
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:-rawdrive_admin}
    ports:
      # Expose port 6432 for connections through PgBouncer
      - "127.0.0.1:${PORT_PGBOUNCER}:6432"
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Check if pgbouncer is accepting connections
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-rawdrive}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:2.9.0
    container_name: rawdrive-loki
    restart: unless-stopped
    # Port 3100 only exposed internally via Docker network (not to host)
    ports:
      - "127.0.0.1:${PORT_LOKI}:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT_LOKI}/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G # Limit memory to prevent OOM
        reservations:
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.0
    container_name: rawdrive-promtail
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_PROMTAIL}:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: rawdrive-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yaml'
      - '--storage.path=/alertmanager'
    ports:
      - "127.0.0.1:${PORT_ALERTMANAGER}:9093"
    volumes:
      - ../monitoring/prometheus/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT_ALERTMANAGER}/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:10.2.0
    container_name: rawdrive-grafana
    restart: unless-stopped
    # Port 3000 only exposed internally - access via Traefik reverse proxy
    ports:
      - "127.0.0.1:${PORT_GRAFANA}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Disable anonymous access for security
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: rawdrive-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Override to use service hostnames inside the compose network
      # Force postgres hostname for Docker networking (ignore .env DATABASE_URL)
      DATABASE_URL: postgresql+asyncpg://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      # Force redis hostname for Docker networking (ignore .env REDIS_URL)
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      LOKI_URL: http://loki:${PORT_LOKI}
      LOKI_TENANT_ID: rawdrive
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: ${PORT_BACKEND}
      PORT: ${PORT_BACKEND}
      # Force Docker secrets path (ignore .env JWT paths which use host paths)
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM:-EdDSA}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-10}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-50}
      DB_POOL_MAX_LIFETIME_SEC: ${DB_POOL_MAX_LIFETIME_SEC:-1800}
      # Public base URL for API (fixes localhost issues)
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      # Public URL for profile pages (QR codes, public URLs)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      # Disable embedded face detection worker (now separate service)
      DISABLE_FACE_WORKER: "true"
      # Invitations microservice URL for proxy routing
      INVITATIONS_SERVICE_URL: http://invitations-api:${PORT_INVITATIONS}
      # Feature flags
      FEATURE_AI_FILTER_SIMPLIFY: "true"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy, not directly from internet
      - "127.0.0.1:${PORT_BACKEND}:${PORT_BACKEND}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      - ../../backend/secrets/jwtEd25519.key:/run/secrets/jwt_private_key:ro
      - ../../backend/secrets/ed25519_public_key.pem:/run/secrets/jwt_public_key:ro
  face-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: rawdrive-face-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Database connection (same as backend)
      DATABASE_URL: postgresql+asyncpg://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT_FACE_WORKER}
      # Worker-specific settings
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 5
      # Encryption - ensure ENCRYPTION_MASTER_KEY is set (same as backend)
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      # Google Cloud Vision credentials (mounted to /run/secrets/ to avoid nested mount conflict with /app)
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials.json
    # Health check endpoint on port ${PORT_FACE_WORKER}
    ports:
      - "127.0.0.1:${PORT_FACE_WORKER}:${PORT_FACE_WORKER}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      # Mount Google Cloud credentials from path defined in .env (GOOGLE_APPLICATION_CREDENTIALS_FILE)
      - ../../${GOOGLE_APPLICATION_CREDENTIALS_FILE:-docs/docparser-468004-9b82008238af.json}:/run/secrets/gcp-credentials.json:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  content-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.content-worker
    container_name: rawdrive-content-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Database connection (same as backend)
      DATABASE_URL: postgresql+asyncpg://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT_CONTENT_WORKER}
      # Worker-specific settings
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 5
      # Google Cloud Vision credentials (for label detection)
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials.json
    # Health check endpoint on port ${PORT_CONTENT_WORKER}
    ports:
      - "127.0.0.1:${PORT_CONTENT_WORKER}:${PORT_CONTENT_WORKER}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      # Mount Google Cloud credentials from path defined in .env
      - ../../${GOOGLE_APPLICATION_CREDENTIALS_FILE:-docs/docparser-468004-9b82008238af.json}:/run/secrets/gcp-credentials.json:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  quality-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.quality-worker
    container_name: rawdrive-quality-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:${PORT_QUALITY_WORKER}:${PORT_QUALITY_WORKER}"
    environment:
      # Database connection (same as backend)
      DATABASE_URL: postgresql+asyncpg://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT_QUALITY_WORKER}
      # Worker-specific settings
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_QUALITY_WORKER}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  one-api:
    image: justsong/one-api:latest
    platform: linux/amd64
    container_name: rawdrive-one-api
    restart: unless-stopped
    # Port 4000 only exposed internally - access via Traefik reverse proxy
    ports:
      - "127.0.0.1:${PORT_ONE_API}:${PORT_ONE_API_INTERNAL:-3002}"
    environment:
      SQL_DSN: "postgres://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/one_api" # Use dedicated DB
      REDIS_CONN_STRING: "redis://redis:${PORT_REDIS}/0"
      SESSION_SECRET: "${LITELLM_MASTER_KEY:-randomsecret123}" # Reusing a secret env var or default
      NODE_TYPE: "master"
      PORT: ${PORT_ONE_API_INTERNAL:-3002}
      # One API can read standard OpenAI vars if we want to pre-seed, but mostly configured via UI
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Invitations Microservice
  # Dedicated service for digital wedding invitations, RSVP, and guest management
  # ============================================================================
  invitations-api:
    build:
      context: ../../services/invitations-service
      dockerfile: Dockerfile
    container_name: rawdrive-invitations-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Database connection (shared with main backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DB_POOL_MIN_SIZE: 5
      DB_POOL_MAX_SIZE: 20
      DB_COMMAND_TIMEOUT: 60

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      REDIS_URL: redis://redis:${PORT_REDIS}/0
      # Celery configuration (use separate Redis DBs to avoid key collisions)
      CELERY_BROKER_URL: redis://redis:${PORT_REDIS}/3
      CELERY_RESULT_BACKEND: redis://redis:${PORT_REDIS}/4
      # JWT secret for token validation (must match backend)
      JWT_SECRET: ${JWT_SECRET:-}
      # Email service (SendGrid)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@rawdrive.ai}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RawDrive}
      # Storage (for invitation media assets)
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Service config
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      PORT: ${PORT_INVITATIONS}
    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_INVITATIONS}:${PORT_INVITATIONS}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_INVITATIONS}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  invitations-worker:
    build:
      context: ../../services/invitations-service
      dockerfile: Dockerfile
    container_name: rawdrive-invitations-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_INVITATIONS_WORKER}:${PORT_INVITATIONS_WORKER}"
    command: celery -A src.workers.celery_app worker --loglevel=info --queues=emails
    env_file:
      - ../../.env
    environment:
      # Database connection (shared with main backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      # Celery configuration
      CELERY_BROKER_URL: redis://redis:${PORT_REDIS}/3
      CELERY_RESULT_BACKEND: redis://redis:${PORT_REDIS}/4
      # Email service
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@rawdrive.ai}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RawDrive}
    depends_on:
      invitations-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Celery worker health check - verify Redis broker connectivity
    # Python slim doesn't have ps/pgrep, so use redis-cli via Python
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import redis; r=redis.from_url('redis://redis:${PORT_REDIS}/3'); r.ping()\" || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================================================
  # Onboarding Microservice
  # Dedicated service for user registration and onboarding flow
  # ============================================================================
  onboarding-service:
    build:
      context: ../../services/onboarding-service
      dockerfile: Dockerfile
    container_name: rawdrive-onboarding-service
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service identification
      SERVICE_NAME: onboarding-service
      SERVICE_VERSION: 1.0.0
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}

      # Database connection (shared with main backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DB_POOL_MIN_SIZE: 5
      DB_POOL_MAX_SIZE: 20
      DB_COMMAND_TIMEOUT: 60

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      # Redis
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      REDIS_MAX_CONNECTIONS: 20

      # JWT - CRITICAL: Must match backend exactly
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-EdDSA}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@rawdrive.ai}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RawDrive}

      # Rate limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: 100/minute
      RATE_LIMIT_ONBOARDING_START: 10/minute
      RATE_LIMIT_EMAIL_VERIFICATION: 5/minute
      RATE_LIMIT_PAYMENT: 20/minute

      # Cache TTLs
      CACHE_TTL_SESSION: 600
      CACHE_TTL_STATE: 120
      CACHE_TTL_VALIDATION: 30

      # Metrics
      METRICS_ENABLED: true
      METRICS_CUSTOM_PREFIX: onboarding
      PORT: ${PORT_ONBOARDING}
    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_ONBOARDING}:${PORT_ONBOARDING}"
    volumes:
      - ../../services/onboarding-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_ONBOARDING}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
  # ============================================================================
  # Gallery Microservice
  # Dedicated service for high-performance gallery viewing and proofing
  # Optimized for 50K concurrent Magic Link views with KEDA autoscaling
  # ============================================================================
  gallery-service:
    build:
      context: ../../services/gallery-service
      dockerfile: Dockerfile
    container_name: rawdrive-gallery-service
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Service
      SERVICE_NAME: gallery-service
      SERVICE_VERSION: "1.0.0"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database (shared with backend)
      DATABASE_URL: postgresql://rawdrive:rawdrive@postgres:${PORT_POSTGRES}/rawdrive
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      DB_POOL_MIN_SIZE: ${GALLERY_DB_POOL_MIN_SIZE:-10}
      DB_POOL_MAX_SIZE: ${GALLERY_DB_POOL_MAX_SIZE:-100}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-60}

      # PgBouncer connection pooler (for 5000+ concurrent scaling)
      PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-false}
      PGBOUNCER_HOST: ${PGBOUNCER_HOST:-pgbouncer}
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}

      # Redis - Multi-tier caching
      REDIS_URL: redis://redis:${PORT_REDIS}/0
      REDIS_MAX_CONNECTIONS: ${GALLERY_REDIS_MAX_CONNECTIONS:-50}

      # JWT (must match backend - EdDSA with public key)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: ${JWT_ALGORITHM:-EdDSA}

      # CORS
      CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: "1000/minute"

      # Cache TTLs (seconds)
      CACHE_TTL_GALLERY_METADATA: 300
      CACHE_TTL_GALLERY_ASSETS: 120
      CACHE_TTL_PROOFING_STATE: 30
      CACHE_TTL_SIGNED_URL: 3600
      CACHE_TTL_MAGIC_LINK: 600

      # Storage (R2)
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-rawdrive}
      R2_SIGNED_URL_EXPIRY: 3600

      # WebSocket configuration
      WS_MAX_CONNECTIONS_PER_GALLERY: 1000
      WS_HEARTBEAT_INTERVAL: 30
      WS_MESSAGE_QUEUE_SIZE: 100

      # Metrics
      METRICS_ENABLED: true
      METRICS_CUSTOM_PREFIX: gallery

      # Security
      PIN_MAX_ATTEMPTS: 5
      PIN_LOCKOUT_MINUTES: 15
      PASSWORD_MAX_ATTEMPTS: 5
      PASSWORD_LOCKOUT_MINUTES: 30

      # Circuit Breaker
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT: 30

      PORT: ${PORT_GALLERY}

    ports:
      # Bind to localhost only - accessible via Traefik reverse proxy
      - "127.0.0.1:${PORT_GALLERY}:${PORT_GALLERY}"

    volumes:
      - ../../services/gallery-service:/app
      # Mount JWT public key for token verification (EdDSA)
      - ../../backend/secrets/jwtEd25519.key.pub:/run/secrets/jwt_public_key:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT_GALLERY}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
