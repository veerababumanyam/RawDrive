        activationListLength: "1"

---
# =============================================================================
# KEDA ScaledObject for Invitations Worker (Celery-based)
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rawdrive-invitations-worker-scaler
  namespace: rawdrive
  labels:
    app.kubernetes.io/name: rawdrive-invitations-worker
spec:
  scaleTargetRef:
    name: rawdrive-invitations-worker
    kind: Deployment
  
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300
  pollingInterval: 30
  
  triggers:
    # Scale based on Celery queue length
    - type: redis
      metadata:
        address: redis.rawdrive:6379
        listName: celery
        databaseIndex: "3"  # Celery uses Redis DB 3
        listLength: "10"
        activationListLength: "1"

---
# =============================================================================
# TriggerAuthentication for Redis (if auth required)
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis-auth
  namespace: rawdrive
spec:
  secretTargetRef:
    - parameter: password
      name: redis-secret
      key: redis-password
