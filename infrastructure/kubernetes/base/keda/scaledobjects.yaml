  name: rawdrive-quality-worker-scaler
  namespace: rawdrive
  labels:
    app.kubernetes.io/name: rawdrive-quality-worker
spec:
  scaleTargetRef:
    name: rawdrive-quality-worker
    kind: Deployment
  
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 30
  
