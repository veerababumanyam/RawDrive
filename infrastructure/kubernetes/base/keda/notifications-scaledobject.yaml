# KEDA ScaledObject for Notifications Service
# Scales based on HTTP request rate, notification queue depth, and latency
# Target: 2-20 pods for email/SMS delivery and notification processing

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notifications-service-scaledobject
  labels:
    app: notifications-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notifications-service
  # Polling interval for metrics
  pollingInterval: 15
  # Cooldown period before scaling down
  cooldownPeriod: 120
  # Min/max replicas
  minReplicaCount: 2
  maxReplicaCount: 20
  # Scale down gradually
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 2
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    # Primary trigger: HTTP request rate from Prometheus
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: notifications_http_requests_total
        query: |
          sum(rate(notifications_http_requests_total{service="notifications-service"}[1m]))
        threshold: "100"  # Scale up when >100 RPS per replica
        activationThreshold: "50"  # Activate scaling at 50 RPS

    # Secondary trigger: Pending notification queue depth
    # This is critical for ensuring timely notification delivery
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: notifications_queue_depth_pending
        query: |
          sum(notifications_queue_depth{queue_type="pending"})
        threshold: "100"  # Scale up when >100 pending notifications
        activationThreshold: "50"

    # Tertiary trigger: Email delivery rate
    # Scale when email sending rate is high
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: notifications_emails_sent_total
        query: |
          sum(rate(notifications_emails_sent_total{status="success"}[1m]))
        threshold: "50"  # Scale up when >50 emails/sec
        activationThreshold: "20"

    # Quaternary trigger: Request latency
    # Scale up when P95 latency exceeds threshold
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: notifications_http_request_duration_seconds
        query: |
          histogram_quantile(0.95, sum(rate(notifications_http_request_duration_seconds_bucket[1m])) by (le))
        threshold: "0.5"  # Scale up when P95 latency > 500ms
        activationThreshold: "0.3"

    # Fallback trigger: Webhook processing rate
    # Scale when receiving high volume of SendGrid callbacks
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: notifications_webhook_events_total
        query: |
          sum(rate(notifications_webhook_events_total{provider="sendgrid"}[1m]))
        threshold: "20"  # Scale up when >20 webhooks/sec
        activationThreshold: "10"

---
# Trigger Authentication for Prometheus
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: notifications-prometheus-trigger-auth
spec:
  secretTargetRef: []
  # No authentication needed for internal Prometheus
