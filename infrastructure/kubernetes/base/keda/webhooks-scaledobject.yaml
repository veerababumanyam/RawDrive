apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webhooks-service
  namespace: default
  labels:
    app: webhooks-service
    component: webhooks
spec:
  scaleTargetRef:
    name: webhooks-service
    kind: Deployment
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    # Primary trigger: Pending deliveries queue depth
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: webhook_pending_deliveries
        threshold: "500"  # Scale up when 500+ pending per replica
        query: |
          webhook_pending_deliveries

    # Secondary trigger: Delivery rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: webhook_deliveries_rate
        threshold: "100"  # 100 deliveries/min per pod
        query: |
          sum(rate(webhook_deliveries_total[1m])) * 60

    # Tertiary trigger: HTTP request rate from Traefik
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: http_requests_total
        threshold: "100"  # 100 RPS per pod
        query: |
          rate(traefik_service_requests_total{service="webhooks-service@docker"}[1m])

    # Kafka trigger: Webhook event queue lag
    # Uncomment when Kafka is enabled for event consumption
    # - type: kafka
    #   metadata:
    #     bootstrapServers: kafka:9092
    #     consumerGroup: webhooks-service
    #     topic: rawdrive.asset.events,rawdrive.gallery.events,rawdrive.subscription.events
    #     lagThreshold: "100"  # Scale when lag > 100 messages
    #     offsetResetPolicy: latest

  fallback:
    failureThreshold: 3
    replicas: 3  # Fallback to 3 replicas if metrics unavailable

  # Advanced scaling behavior
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Min
