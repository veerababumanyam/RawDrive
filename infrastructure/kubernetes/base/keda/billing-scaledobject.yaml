# KEDA ScaledObject for Billing Service
# Scales based on HTTP request rate and webhook processing load
# Target: 2-20 pods for payment processing and subscriptions

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: billing-service-scaledobject
  labels:
    app: billing-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  # Polling interval for metrics
  pollingInterval: 15
  # Cooldown period before scaling down
  cooldownPeriod: 120
  # Min/max replicas
  minReplicaCount: 2
  maxReplicaCount: 20
  # Scale down gradually
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 180
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 2
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    # Primary trigger: HTTP request rate from Prometheus
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: billing_http_requests_total
        query: |
          sum(rate(billing_http_requests_total{service="billing-service"}[1m]))
        threshold: "100"  # Scale up when >100 RPS per replica
        activationThreshold: "50"  # Activate scaling at 50 RPS

    # Secondary trigger: Webhook processing rate
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: billing_webhook_events_total
        query: |
          sum(rate(billing_webhook_events_total{service="billing-service"}[1m]))
        threshold: "10"  # Scale up when >10 webhooks/sec
        activationThreshold: "5"

    # Tertiary trigger: Request latency
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: billing_http_request_duration_seconds
        query: |
          histogram_quantile(0.95, sum(rate(billing_http_request_duration_seconds_bucket[1m])) by (le))
        threshold: "0.5"  # Scale up when P95 latency > 500ms
        activationThreshold: "0.3"

---
# Trigger Authentication for Prometheus
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: billing-prometheus-trigger-auth
spec:
  secretTargetRef: []
  # No authentication needed for internal Prometheus
