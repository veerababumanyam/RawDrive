apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rawdrive-upload-service-scaler
  namespace: rawdrive
  labels:
    app.kubernetes.io/name: rawdrive-upload-service
spec:
  scaleTargetRef:
    name: rawdrive-upload-service
    kind: Deployment

  minReplicaCount: 1
  maxReplicaCount: 50
  cooldownPeriod: 300
  pollingInterval: 15

  triggers:
    # Scale based on concurrent uploads (Prometheus metric)
    # Target: 100 concurrent uploads per pod => 50 pods = 5000 concurrent
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        metricName: upload_concurrent_total
        threshold: "100"
        query: |
          sum(upload_concurrent_total{service="upload-service"})
        activationThreshold: "10"

    # Fallback: CPU utilization
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
