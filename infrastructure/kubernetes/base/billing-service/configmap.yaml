apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  labels:
    app: billing-service
data:
  # Service Configuration
  SERVICE_NAME: "billing-service"
  SERVICE_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # Database Configuration
  DB_POOL_MIN_SIZE: "10"
  DB_POOL_MAX_SIZE: "50"
  DB_COMMAND_TIMEOUT: "60"

  # Redis Configuration
  REDIS_MAX_CONNECTIONS: "20"
  REDIS_KEY_PREFIX: "billing:"

  # JWT Configuration
  JWT_ALGORITHM: "HS256"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_API: "1000/minute"
  RATE_LIMIT_WEBHOOK: "100/minute"

  # Invoice Settings
  INVOICE_PDF_STORAGE_PATH: "workspaces/{workspace_id}/invoices/"
  COMPANY_NAME: "RawDrive"

  # Subscription Settings
  TRIAL_DAYS: "14"
  GRACE_PERIOD_DAYS: "7"

  # Circuit Breaker
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "30"

  # Metrics
  METRICS_ENABLED: "true"
  METRICS_CUSTOM_PREFIX: "billing"

  # CORS Origins (comma-separated)
  CORS_ORIGINS: "https://rawdrive.io,https://*.rawdrive.io"
