apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  labels:
    app: billing-service
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/rawdrive"
  DATABASE_READ_REPLICA_URL: "postgresql://USER:PASSWORD@REPLICA-HOST:5432/rawdrive"

  # Redis
  REDIS_URL: "redis://HOST:6379/0"

  # JWT (must match main backend)
  JWT_SECRET: "your-jwt-secret-here"

  # Payment Providers
  RAZORPAY_KEY_ID: "rzp_live_xxx"
  RAZORPAY_KEY_SECRET: "your-razorpay-secret"
  RAZORPAY_WEBHOOK_SECRET: "whsec_xxx"
  STRIPE_SECRET_KEY: "sk_live_xxx"
  STRIPE_PUBLISHABLE_KEY: "pk_live_xxx"
  STRIPE_WEBHOOK_SECRET: "whsec_xxx"

  # Storage (R2) for invoice PDFs
  R2_ENDPOINT: "https://ACCOUNT_ID.r2.cloudflarestorage.com"
  R2_ACCESS_KEY_ID: "your-access-key"
  R2_SECRET_ACCESS_KEY: "your-secret-key"
  R2_BUCKET_NAME: "rawdrive-prod"

  # Company Info
  GST_NUMBER: "YOUR_GST_NUMBER"
  COMPANY_ADDRESS: "Your Company Address"
