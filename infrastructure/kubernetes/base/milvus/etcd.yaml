apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-etcd
  namespace: rawdrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus-etcd
  template:
    metadata:
      labels:
        app: milvus-etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.5
        command:
        - etcd
        - -advertise-client-urls=http://127.0.0.1:2379
        - -listen-client-urls=http://0.0.0.0:2379
        - --data-dir=/etcd
        - --auto-compaction-mode=revision
        - --auto-compaction-retention=1000
        ports:
        - containerPort: 2379
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd
      volumes:
      - name: etcd-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: rawdrive
spec:
  ports:
  - port: 2379
    targetPort: 2379
  selector:
    app: milvus-etcd
