# RawDrive Tmux Configuration
# Prefix: Ctrl-a (more ergonomic than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal to 256 colors
set -g default-terminal 'screen-256color'

# Increase scrollback buffer size
set -g history-limit 50000

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar more often
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Source file
unbind r
bind r source-file ~/.tmux.conf \; display 'Config reloaded!'

# Better split shortcuts
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-like copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-paste --type=text > /dev/null || xclip -selection clipboard -o'

# Status bar customization
set -g status-bg '#1e1e2e'
set -g status-fg '#cdd6f4'
set -g status-left-length 40
set -g status-left '#[fg=#89b4fa]RawDrive #[fg=#74c7ec]%a %H:%M '
set -g status-right '#[fg=#a6e3a1]#(git -C #{pane_current_path} branch -show-current 2>/dev/null) #[fg=#cba6f7]%Y-%m-%d'

# Window status
setw -g window-status-format '#[fg=#6c7086]#I:#W '
setw -g window-status-current-format '#[fg=#cdd6f4 bold]#I:#W* '

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# RawDrive Workspace Layout
bind W new-window -n 'RawDrive' -c '~/Desktop/RawDrive2'
bind F new-window -n 'Frontend' -c '~/Desktop/RawDrive2/frontend' \; send-keys 'pnpm dev' C-m
bind B new-window -n 'Backend' -c '~/Desktop/RawDrive2/backend' \; send-keys 'uvicorn app.main:app --reload --port 8000' C-m
bind D new-window -n 'Docker' -c '~/Desktop/RawDrive2' \; send-keys 'docker compose -f infrastructure/docker/docker-compose.yml logs -f' C-m

# Quick access to common commands
bind T command-prompt -p 'Test:' 'new-window -n Test %%'
bind G command-prompt -p 'Git:' 'new-window -n Git %%'
