[alembic]
script_location = migrations

# DATABASE_URL must be set as environment variable before running alembic
# PowerShell: $env:DATABASE_URL = "postgresql://rawdrive:rawdrive@localhost:5432/rawdrive"
# Bash: export DATABASE_URL="postgresql://rawdrive:rawdrive@localhost:5432/rawdrive"
# Note: Use sync driver (postgresql://) not async (postgresql+asyncpg://)
sqlalchemy.url = ${DATABASE_URL}

env.py_location = migrations/env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
