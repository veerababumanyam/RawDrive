[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawdrive-backend"
version = "0.1.9"
description = "RawDrive FastAPI backend for authentication, RBAC, and workspace services"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RawDrive", email = "engineering@rawdrive.in" }]
license = { text = "MIT" }
keywords = ["fastapi", "multitenant", "rawdrive", "rbac", "auth"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Authentication",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "redis[hiredis]>=5.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "email-validator>=2.1",
  "alembic>=1.13",
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pyotp>=2.9",
  "geoip2>=4.7",
  "qrcode>=7.4",
  "Pillow>=10.0",
  "structlog>=25.5.0",
  # Celery for background task processing
  "celery[redis]>=5.3.6",
]

[project.optional-dependencies]
dev = [
  # Testing framework
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=4.1",
  "pytest-xdist>=3.5",
  "pytest-timeout>=2.2",
  "pytest-mock>=3.12",
  # Property-based and data generation
  "hypothesis>=6.100",
  "faker>=25.0",
  # Coverage
  "coverage[toml]>=7.4",
  # Linting and type checking
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis>=4.6",
  "asyncpg-stubs>=0.29",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
# Asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Command-line options
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]

# Python path configuration
pythonpath = ["src"]

# Deprecation and warning filters
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# Test markers for categorization and filtering
markers = [
    "unit: Unit tests (fast, isolated, no external dependencies)",
    "integration: Integration tests (may require database/redis)",
    "e2e: End-to-end tests (full system tests)",
    "performance: Performance and benchmark tests",
    "load: Load testing",
    "security: Security-focused tests",
    "property: Property-based tests using Hypothesis",
    "slow: Tests that take more than 5 seconds",
    "database: Tests requiring PostgreSQL database",
    "redis: Tests requiring Redis connection",
    "external: Tests requiring external services (APIs, cloud)",
]

# Timeout configuration (requires pytest-timeout)
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["src/app"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
    "*/venv/*",
    "*_test.py",
    "test_*.py",
    "conftest.py",
]

[tool.coverage.paths]
source = ["src/app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC" ]

[tool.mypy]
python_version = "3.10"
plugins = []
warn_unused_configs = true
ignore_missing_imports = true
