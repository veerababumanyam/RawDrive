# Pytest configuration file
# Most configuration is in pyproject.toml, but this file provides
# additional options and serves as a marker for the test root directory.

[pytest]
# Minimum pytest version required
minversion = 8.0

# Test discovery patterns
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Console output settings
console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging for test runs
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings (requires pytest-timeout)
timeout = 300
timeout_method = thread

# xdist settings for parallel execution
# Use: pytest -n auto (auto-detect CPU count)
# Use: pytest -n 4 (use 4 workers)

# Cache settings
cache_dir = .pytest_cache
