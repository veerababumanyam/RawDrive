name: rawdrive-dev

services:

  # ── Infrastructure ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rawdrive
      POSTGRES_USER: rawdrive
      POSTGRES_PASSWORD: rawdrive_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rawdrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -m 8222

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Face recognition sidecar (Python + insightface) ───────────────
  # Internal-only; exposed on host port 8085 for the integration test
  # (backend/internal/face/client_test.go) and ad-hoc curl smoke checks,
  # but the backend service reaches it via the compose network at
  # http://face-svc:8000. See services/face-svc/README.md.
  face-svc:
    build:
      context: ./services/face-svc
      dockerfile: Dockerfile
    environment:
      FACE_SVC_LOG_LEVEL: INFO
      FACE_SVC_MIN_DET_SCORE: "0.5"
    ports:
      - "8085:8000"
    volumes:
      # Persist the ~280 MB buffalo_l model download across container restarts.
      - face_svc_models:/home/facesvc/.insightface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz | grep -q '\"ready\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Cold start: model download on first run can take >60s on slow links.
      start_period: 180s

  # ── One-shot migration runner ─────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: postgresql://rawdrive:rawdrive_dev@postgres:5432/rawdrive?sslmode=disable
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Backend API ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/usr/local/bin/api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rawdrive:rawdrive_dev@postgres:5432/rawdrive?sslmode=disable
      VALKEY_URL: redis://valkey:6379
      NATS_URL: nats://nats:4222
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_SECURITY: auto
      # Internal face-svc URL inside the compose network. The Go client
      # (backend/internal/face/client.go) reads this env var. Health gate
      # in face-svc means depends_on:condition:service_healthy below.
      FACE_SVC_URL: http://face-svc:8000
      APP_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — points browser fetch calls
        # at the backend exposed on the host's port 8080.
        NEXT_PUBLIC_API_URL: http://localhost:8080
        # Baked into Next.js rewrites — this runs inside the frontend
        # container, where localhost is the frontend container itself.
        INTERNAL_API_BASE_URL: http://backend:8080
    environment:
      # Browser-visible API origin; host browsers can reach this port.
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # Server-side rewrites use Compose DNS from inside the container.
      INTERNAL_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  face_svc_models:
