<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect class="background" width="400" height="300" fill="#F5F5DC"/>
  <circle class="vinyl" cx="100" cy="150" r="80" fill="url(#vinylGrad)"/>
  <circle class="center" cx="100" cy="150" r="20" fill="#C0A080"/>
  <rect class="album-cover" x="200" y="60" width="160" height="180" fill="#1F2937" rx="3"/>
  <text class="title" x="280" y="150" font-size="13" font-weight="600" text-anchor="middle" fill="#E5E7EB" font-family="system-ui">Gallery</text>
</svg>