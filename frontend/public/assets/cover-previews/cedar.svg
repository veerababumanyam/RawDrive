<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <pattern id="woodGrain" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#6B4423"/>
      <path d="M 0,10 Q 25,8 50,12 T 100,10" stroke="#5A3A1F" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M 0,30 Q 25,28 50,32 T 100,30" stroke="#4A2818" stroke-width="1" fill="none" opacity="0.5"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78704C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A4A3A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect class="background" width="400" height="300" fill="url(#bgGrad)"/>
  <rect class="wood-overlay" width="400" height="300" fill="url(#woodGrain)" opacity="0.4"/>
  <rect class="photo-area" x="40" y="40" width="320" height="160" fill="#8B7355" opacity="0.5" rx="2"/>
  <ellipse cx="80" cy="80" rx="12" ry="20" fill="#5A7C3E" opacity="0.4"/>
  <ellipse cx="320" cy="100" rx="15" ry="25" fill="#5A7C3E" opacity="0.3"/>
  <text class="title" x="200" y="260" font-size="14" font-weight="600" text-anchor="middle" fill="#E8D7BC" font-family="system-ui">Cedar</text>
</svg>