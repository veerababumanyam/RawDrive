<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect class="background" width="400" height="300" fill="#FFFFFF"/>
  <rect class="photo-area" x="20" y="20" width="360" height="180" fill="url(#photoGrad)" rx="2"/>
  <rect class="stripe" x="20" y="220" width="360" height="60" fill="#0F172A" opacity="0.9"/>
  <text class="title" x="200" y="255" font-size="16" font-weight="600" text-anchor="middle" fill="#FFFFFF" font-family="system-ui">Gallery Title</text>
</svg>