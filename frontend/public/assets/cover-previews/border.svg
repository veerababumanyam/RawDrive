<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect class="outer-border" width="400" height="300" fill="#2F1F4F" stroke="#8B5CF6" stroke-width="6"/>
  <rect class="photo-area" x="30" y="30" width="340" height="240" fill="url(#photoGrad)" rx="2"/>
  <text class="title" x="200" y="260" font-size="13" font-weight="600" text-anchor="middle" fill="#E9D5FF" font-family="system-ui">Gallery Title</text>
