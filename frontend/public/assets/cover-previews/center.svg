<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect class="background" width="400" height="300" fill="url(#bgGrad)"/>
  <rect class="photo-area" x="20" y="20" width="360" height="200" fill="#1e1b4b" opacity="0.3" rx="2"/>
  <text class="title" x="200" y="250" font-size="18" font-weight="600" text-anchor="middle" fill="#ffffff" font-family="system-ui">Gallery Title</text>
  <text class="subtitle" x="200" y="270" font-size="12" text-anchor="middle" fill="#e0e7ff" font-family="system-ui">Centered Layout</text>
</svg>