<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect class="background" width="400" height="300" fill="url(#grad1)"/>
  <polygon class="panel1" points="20,120 120,80 120,180 20,220" fill="url(#grad2)"/>
  <polygon class="panel2" points="140,60 240,40 240,200 140,220" fill="#3B82F6" opacity="0.4"/>
  <polygon class="panel3" points="260,100 360,60 360,200 260,240" fill="#1E40AF" opacity="0.5"/>
  <text class="title" x="200" y="260" font-size="14" font-weight="600" text-anchor="middle" fill="#E0E7FF" font-family="system-ui">Cliff</text>
</svg>