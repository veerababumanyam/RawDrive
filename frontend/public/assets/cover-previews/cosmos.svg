<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2E1065;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect class="background" width="400" height="300" fill="url(#bgGrad)"/>
  <circle cx="60" cy="50" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="150" cy="40" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="280" cy="60" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="350" cy="80" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="120" cy="200" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="320" cy="220" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="200" cy="240" r="1" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="200" cy="100" rx="60" ry="40" fill="#A78BFA" opacity="0.15" filter="url(#glow)"/>
  <text class="title" x="200" y="280" font-size="14" font-weight="600" text-anchor="middle" fill="#E9D5FF" font-family="system-ui" filter="url(#glow)">Cosmos</text>
</svg>