<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AA8C2C;stop-opacity:1" />
    </linearGradient>
    <filter id="film">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"/>
    </filter>
  </defs>
  <rect class="background" width="400" height="300" fill="url(#bgGrad)"/>
  <rect class="photo-area" x="40" y="40" width="320" height="160" fill="#6B5D47" opacity="0.3" rx="1" filter="url(#film)"/>
  <rect class="border" x="35" y="35" width="330" height="170" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.7"/>
  <text class="title" x="200" y="230" font-size="16" font-weight="700" text-anchor="middle" fill="#8B7355" font-family="Georgia" letter-spacing="2">GALLERY</text>
</svg>