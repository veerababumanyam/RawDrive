<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main logo container -->
  <rect width="200" height="60" rx="8" fill="url(#logoGradient)" opacity="0.1"/>

  <!-- Camera icon -->
  <g transform="translate(10, 15)">
    <!-- Camera body -->
    <rect x="5" y="10" width="25" height="15" rx="3" fill="#2563EB" stroke="#06B6D4" stroke-width="1"/>
    <!-- Lens -->
    <circle cx="17.5" cy="17.5" r="6" fill="#06B6D4" opacity="0.8"/>
    <circle cx="17.5" cy="17.5" r="4" fill="#0891B2"/>
    <circle cx="17.5" cy="17.5" r="2" fill="#ffffff"/>
    <!-- Flash -->
    <rect x="27" y="8" width="3" height="6" fill="#FFD700"/>
  </g>

  <!-- Text -->
  <text x="50" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2563EB">RawDrive</text>
  <text x="50" y="42" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Professional Photography Management</text>

  <!-- Decorative elements -->
  <circle cx="180" cy="20" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="175" cy="35" r="2" fill="#0891B2" opacity="0.4"/>
  <circle cx="185" cy="40" r="2.5" fill="#2563EB" opacity="0.5"/>
</svg>
