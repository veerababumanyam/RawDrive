<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Offline – RawDrive</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f4ef;
      --fg: #1a1a1a;
      --muted: #666;
      --accent: #d4af37;
      --card: rgba(255,255,255,0.6);
      --border: rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #f5f5f5;
        --muted: #a0a0a0;
        --card: rgba(255,255,255,0.03);
        --border: rgba(255,255,255,0.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      max-width: 28rem;
      padding: 2.5rem 2rem;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 0.5rem;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 600;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0.75rem 0;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 500;
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      min-height: 44px;
      min-width: 120px;
    }
    button:hover { opacity: 0.9; }
    small {
      display: block;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <p style="margin-top:0"><span class="dot"></span>Offline</p>
    <h1>You're not connected</h1>
    <p>Your gallery will be here when you reconnect. Cached photos from your last visit may still be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Powered by RawDrive</small>
  </div>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
