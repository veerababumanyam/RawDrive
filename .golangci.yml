version: "2"
run:
  go: "1.25"
  modules-download-mode: readonly
linters:
  enable:
    - misspell
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - _cobolt-output
      - _cobolt-docker
      - node_modules
      - .claude
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/rawdrive
  exclusions:
    generated: lax
    paths:
      - _cobolt-output
      - _cobolt-docker
      - node_modules
      - .claude
      - third_party$
      - builtin$
      - examples$
