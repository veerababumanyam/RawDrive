# CPU Deployment for AI Processing Workers
# Handles duplicate detection, content moderation, and AI tagging

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-processing-cpu
  namespace: default
  labels:
    app: ai-processing
    component: cpu
    tier: ai-processing
spec:
  replicas: 2  # Managed by KEDA
  selector:
    matchLabels:
      app: ai-processing
      component: cpu
  template:
    metadata:
      labels:
        app: ai-processing
        component: cpu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8009"
        prometheus.io/path: "/metrics"
    spec:
      # Anti-affinity to spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ai-processing
                  component: cpu
              topologyKey: kubernetes.io/hostname

      containers:
      - name: ai-processor
        image: rawdrive/ai-processing-service:latest
        imagePullPolicy: Always

        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"

        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SERVICE_NAME
          value: "ai-processing-cpu"
        - name: UPSCALE_GPU_ENABLED
          value: "false"

        # Database
        - name: DATABASE_HOST
          value: "postgres.rawdrive"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password

        # Redis
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url

        # Kafka
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.rawdrive:9092"

        # Milvus
        - name: MILVUS_ENABLED
          value: "true"
        - name: MILVUS_HOST
          value: "milvus.rawdrive"
        - name: MILVUS_PORT
          value: "19530"

        # Google Cloud APIs
        - name: GOOGLE_VISION_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-api-secret
              key: vision-api-key
        - name: GOOGLE_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-api-secret
              key: gemini-api-key

        ports:
        - containerPort: 8009
          name: http

        livenessProbe:
          httpGet:
            path: /health
            port: 8009
          initialDelaySeconds: 30
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /ready
            port: 8009
          initialDelaySeconds: 10
          periodSeconds: 10

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: ai-processing-cpu
  namespace: default
  labels:
    app: ai-processing
    component: cpu
spec:
  selector:
    app: ai-processing
    component: cpu
  ports:
  - name: http
    port: 8009
    targetPort: 8009
  type: ClusterIP
