apiVersion: v1
kind: Secret
metadata:
  name: upload-service-secrets
  labels:
    app: upload-service
    component: uploads
type: Opaque
stringData:
  # Database connection
  # Replace with actual values or use external secret management (Vault, AWS Secrets Manager)
  DATABASE_URL: "postgresql+asyncpg://rawdrive:CHANGE_ME@postgres:5432/rawdrive"

  # Redis connection
  REDIS_URL: "redis://redis:6379/0"

  # JWT secret (should match main backend)
  JWT_SECRET: "CHANGE_ME_TO_64_BYTE_HEX_SECRET"

  # R2/S3 storage credentials
  R2_ENDPOINT_URL: "https://ACCOUNT_ID.r2.cloudflarestorage.com"
  R2_ACCESS_KEY_ID: "CHANGE_ME"
  R2_SECRET_ACCESS_KEY: "CHANGE_ME"
  R2_BUCKET_NAME: "rawdrive-uploads"

  # Encryption key (for file encryption)
  ENCRYPTION_KEY: "CHANGE_ME_TO_32_BYTE_HEX_KEY"
