apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: upload-service

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: upload-service
      app.kubernetes.io/part-of: rawdrive

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - kafka-credentials-secret.yaml
  - scaledobject.yaml
  - ingressroute.yaml

commonLabels:
  app: upload-service
  component: uploads

images:
  - name: rawdrive/upload-service
    newTag: latest
