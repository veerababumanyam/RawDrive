[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rawdrive-upload-service"
version = "0.1.0"
description = "RawDrive Upload Microservice - handles chunked file uploads with TUS protocol support"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RawDrive", email = "engineering@rawdrive.in" }]
license = { text = "MIT" }
keywords = ["fastapi", "upload", "microservice", "tus", "rawdrive", "chunked-upload"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  # Web framework
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",

  # Database
  "asyncpg>=0.29",
  "SQLAlchemy[asyncio]>=2.0",

  # Redis for chunk buffering and caching
  "redis[hiredis]>=5.0",

  # AWS S3/R2 storage
  "boto3>=1.34",
  "aiobotocore>=2.12",

  # Kafka for event streaming
  "kafka-python>=2.0.2",
  "aiokafka>=0.10",

  # Observability
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "opentelemetry-api>=1.23",
  "opentelemetry-sdk>=1.23",
  "opentelemetry-instrumentation-fastapi>=0.44b0",

  # Security & Auth
  "python-jose[cryptography]>=3.3",
  "cryptography>=42.0",

  # HTTP client
  "httpx>=0.27",

  # Image processing (for RAW file validation)
  "Pillow>=10.0",

  # Utilities
  "tenacity>=8.2",  # Retry logic
  "circuitbreaker>=2.0",  # Circuit breaker pattern
]

[project.optional-dependencies]
dev = [
  # Testing framework
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "pytest-timeout>=2.2",
  "pytest-mock>=3.14",

  # Property-based and data generation
  "hypothesis>=6.100",
  "faker>=25.0",

  # Coverage
  "coverage[toml]>=7.4",

  # Linting and type checking
  "ruff>=0.4",
  "mypy>=1.10",
  "types-redis>=4.6",
  "boto3-stubs[s3]>=1.34",
  "asyncpg-stubs>=0.29",

  # Load testing
  "locust>=2.24",
]

[project.scripts]
upload-service = "app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
# Asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Command-line options
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]

# Python path configuration
pythonpath = ["src"]

# Deprecation and warning filters
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# Test markers for categorization and filtering
markers = [
    "unit: Unit tests (fast, isolated, no external dependencies)",
    "integration: Integration tests (may require database/redis/kafka)",
    "e2e: End-to-end tests (full system tests)",
    "performance: Performance and benchmark tests",
    "load: Load testing with Locust",
    "slow: Tests that take more than 5 seconds",
    "database: Tests requiring PostgreSQL database",
    "redis: Tests requiring Redis connection",
    "kafka: Tests requiring Kafka broker",
    "s3: Tests requiring S3/R2 storage",
]

# Timeout configuration (requires pytest-timeout)
timeout = 300
timeout_method = "thread"

[tool.coverage.run]
source = ["src/app"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*_test.py",
    "test_*.py",
    "conftest.py",
]

[tool.coverage.paths]
source = ["src/app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "S101",   # Use of assert (allowed in tests)
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "aiokafka.*",
    "circuitbreaker.*",
    "rawpy.*",
]
ignore_missing_imports = true
