apiVersion: v1
kind: Service
metadata:
  name: gallery-service
  labels:
    app: gallery-service
    tier: microservices
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: gallery-service
---
# Headless service for WebSocket sticky sessions
apiVersion: v1
kind: Service
metadata:
  name: gallery-service-ws
  labels:
    app: gallery-service
    tier: microservices
    component: websocket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: ws
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: gallery-service
