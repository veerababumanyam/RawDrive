# RawDrive fail2ban ban action — DROP the offender in the DOCKER-USER chain.
#
# WHY (the load-bearing reason this file exists):
#   nginx runs in a container, so client traffic to it is filtered in the
#   iptables FORWARD path via the DOCKER-USER chain — NOT the host INPUT chain.
#   fail2ban's stock iptables actions insert bans into INPUT, which does NOT
#   block traffic to Docker-published ports (the same reason UFW couldn't
#   protect the data plane). Banning in DOCKER-USER, inserted at the TOP so it
#   precedes the established/related RETURN, actually drops the offender's
#   packets (incl. their existing connections) before they reach the container.
#
# NOTE: rawdrive-docker-fw.sh rebuilds DOCKER-USER on boot / docker-restart,
# which clears active bans. That is acceptable: bans are short-lived (1h) and
# re-trigger on continued abuse; the peer-allowlist (the security control) is
# what must survive, and it does.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban   = iptables -I DOCKER-USER -s <ip> -j DROP
actionunban = iptables -D DOCKER-USER -s <ip> -j DROP

[Init]
