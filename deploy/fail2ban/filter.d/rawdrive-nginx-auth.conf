# RawDrive nginx JSON access-log filter.
# Flags an IP that repeatedly draws 401 (auth failure), 403 (forbidden), or 429
# (rate-limited) responses — the signature of credential stuffing, authorization
# probing, or a client that keeps hammering past the rate limiter. The access
# log is the json_combined format defined in deploy/nginx/nginx.conf, where
# remote_addr precedes status on every line.
[Definition]
failregex = ^\{.*"remote_addr":"<HOST>",.*"status":(?:401|403|429),.*\}$
ignoreregex =
