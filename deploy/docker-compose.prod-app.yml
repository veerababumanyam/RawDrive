# Docker Compose for VPS 1 & VPS 2 (App nodes 187.127.142.42 and .44).
# Runs: pgbouncer, backend, frontend, worker, nginx, NATS cluster member,
# plus a replica (valkey on .42, postgres on .44).
#
# The NODE_NAME env var (set in deploy/.env) distinguishes which node
# this is running on — used by nats -n and by the optional replica services.

name: rawdrive-app

services:
  # One-shot migration runner — must exit 0 before backend starts.
  # Only actually gets invoked on first deploy to a node; Compose handles
  # the "exit 0 means success" semantics via depends_on condition.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rawdrive-backend:local
    container_name: deploy-migrate-1
    command: ["/usr/local/bin/migrate"]
    env_file:
      - /opt/rawdrive/app/.env
    restart: "no"
    depends_on: []
    # F-116: one-shot migration runner — small, but capped so a pathological
    # migration can't balloon memory on first deploy.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    # Pinned (F-082, re-confirmed F-114): never use a floating :latest tag for
    # the prod connection pooler — a deploy-day `docker compose pull` (the
    # deploy script even exposes a --pull flag) could otherwise silently swap
    # in a different (or compromised) image between the backend and prod
    # Postgres. The concrete 1.22.x tag also matches the pgbouncer.ini syntax
    # this repo ships. Bump deliberately, matching the pinned
    # nats/valkey/pgvector/nginx images below.
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: deploy-pgbouncer-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/databases.ini:/etc/pgbouncer/databases.ini:ro
      - /opt/rawdrive/app/deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    environment:
      - DATABASE_URL  # passed through for some edoburu image variants
    # F-116: bound the connection pooler so a runaway connection storm can't
    # starve Postgres/Valkey on the shared VPS. pgbouncer is tiny — 128M is
    # generous for the pool plus per-conn buffers.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rawdrive-backend:local
    container_name: deploy-backend-1
    restart: unless-stopped
    command: ["/usr/local/bin/api"]
    env_file:
      - /opt/rawdrive/app/.env
    ports:
      - "8080:8080"  # exposed for peer failover from the OTHER app node
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # F-116: the API can spike during WebP-derivative generation and JetStream
    # consumption. Cap it so an in-process pile-up OOM-kills the backend (which
    # restarts: unless-stopped) instead of the shared Postgres/Valkey, which
    # would risk in-flight WAL corruption.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      # Backend's health endpoint is /health (not /api/v1/health — that's
      # a plan doc typo). Confirmed via backend/cmd/api/main.go:1245.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* env vars are read at BUILD time by next build and
        # baked into the client bundle. Setting this points all
        # frontend fetch('${API_BASE}/...') calls at the real API
        # subdomain instead of defaulting to localhost:8080 (which is
        # the frontend container's own loopback and always fails).
        NEXT_PUBLIC_API_URL: https://api.rawdrive.in
    image: rawdrive-frontend:local
    container_name: deploy-frontend-1
    restart: unless-stopped
    env_file:
      - /opt/rawdrive/app/.env
    ports:
      - "3000:3000"  # exposed for peer failover
    depends_on:
      backend:
        condition: service_healthy
    # F-116: Next.js SSR memory is fairly stable; cap it so a leak can't grow
    # unbounded and pressure the shared host.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      # Frontend runtime has curl (installed in Dockerfile) not wget.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  worker:
    # Worker stub — same image as backend, different command.
    # IMPORTANT: current backend may not have a separate worker entry
    # point. If the --mode=worker flag is unsupported, this service
    # stays inactive behind the 'worker' profile and image processing
    # runs inline in the api container. No code change required.
    image: rawdrive-backend:local
    container_name: deploy-worker-1
    restart: unless-stopped
    command: ["/usr/local/bin/api", "--mode=worker"]
    env_file:
      - /opt/rawdrive/app/.env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - worker  # optional — start with `docker compose --profile worker up`
    # F-116: same image as backend, runs the WebP/AI processing loop — cap it
    # so batch processing can't OOM the shared host.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  nats:
    image: nats:2.11-alpine
    container_name: deploy-nats-1
    restart: unless-stopped
    command:
      - -c
      - /etc/nats/nats-server.conf
      - -n
      - ${NATS_NODE_NAME}  # "nats-1" on .42, "nats-2" on .44
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    # F-116: cap JetStream memory so a consumer pile-up can't grow unbounded
    # and OOM the shared host. NATS also enforces store/memory limits in its
    # own config; this is the hard backstop.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey replica — only started on .42 via profile
  valkey-replica:
    image: valkey/valkey:9.0-alpine
    container_name: deploy-valkey-replica-1
    restart: unless-stopped
    command:
      - valkey-server
      - /etc/valkey/valkey-replica.conf
      - --replicaof
      - 187.127.142.46
      - "6379"
      - --masterauth
      - ${VALKEY_PASSWORD}
      - --requirepass
      - ${VALKEY_PASSWORD}
    volumes:
      - valkey_replica_data:/data
      - ./valkey/valkey-replica.conf:/etc/valkey/valkey-replica.conf:ro
    # F-116: bound the replica's dataset memory. valkey-replica.conf should
    # also set maxmemory below this hard cap so eviction kicks in before the
    # OOM killer does.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M
    profiles:
      - valkey-replica  # only .42 uses this

  # Postgres replica — only started on .44 via profile. Uses a bind-mount
  # override in Phase B.5 to point at /var/lib/rawdrive/postgres-replica/
  # (populated by pg_basebackup from .46).
  postgres-replica:
    image: pgvector/pgvector:pg17
    container_name: deploy-postgres-replica-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # only peer-open, UFW blocks public
    # F-116: bound the standby. shared_buffers + work_mem in the replica's
    # config must stay comfortably under this cap so a heavy read query can't
    # OOM the standby and break streaming replication.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          memory: 512M
    profiles:
      - postgres-replica  # only .44 uses this

  # Python face-detection + ArcFace embedding sidecar. Backend reaches
  # it on the compose network at http://face-svc:8000 via FACE_SVC_URL.
  # Not in backend.depends_on — backend works without it (face endpoints
  # return 503 when face-svc is unreachable), so adding the coupling
  # would gate startup unnecessarily and slow rolling deploys.
  #
  # First boot downloads the buffalo_l model (~280 MB) into the named
  # volume. Subsequent recreates reuse the cached weights and are
  # instant. Without the volume every deploy would re-download.
  #
  # No exposed ports — internal-only, no peer-failover semantics like
  # backend has. Each app node runs its own face-svc; the backend on
  # the same node always calls localhost (compose-DNS), so failure of
  # face-svc on .42 doesn't affect .44 (and vice versa).
  face-svc:
    build:
      context: ../services/face-svc
      dockerfile: Dockerfile
    image: rawdrive-face-svc:local
    container_name: deploy-face-svc-1
    restart: unless-stopped
    volumes:
      - face_svc_models:/home/facesvc/.insightface
    # F-116: the buffalo_l model + per-image inference tensors are the largest
    # memory consumer on the node. Cap it so a batch of large images can't OOM
    # the shared host; restart: unless-stopped recovers the sidecar (face
    # endpoints return 503 in the meantime, by design).
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s   # first boot downloads buffalo_l from upstream
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: deploy-nginx-1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/rawdrive.conf.template:/etc/nginx/templates/rawdrive.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    environment:
      - PEER_NODE_IP=${PEER_NODE_IP}
    # F-116: nginx is the edge proxy/cache — cap it so a flood of buffered
    # responses or a large proxy cache can't pressure the shared host.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 64M
    # envsubst only substitutes the named variables, leaving nginx's own
    # $var references alone. Also delete the default.conf that ships
    # with the nginx:alpine image (server localhost block that catches
    # requests before our templated site). Then exec nginx in foreground.
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && envsubst '$${PEER_NODE_IP}' < /etc/nginx/templates/rawdrive.conf.template > /etc/nginx/conf.d/rawdrive.conf && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  nats_data:
    driver: local
  valkey_replica_data:
    driver: local
  postgres_replica_data:
    driver: local
  nginx_cache:
    driver: local
  # Persists ~280 MB buffalo_l model across container recreates.
  # Without this the model re-downloads on every deploy.
  face_svc_models:
    driver: local
