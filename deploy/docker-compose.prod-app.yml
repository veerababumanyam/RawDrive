# Docker Compose for VPS 1 & VPS 2 (App nodes 187.127.142.42 and .44).
# Runs: pgbouncer, backend, frontend, worker, nginx, NATS cluster member,
# plus a replica (valkey on .42, postgres on .44).
#
# The NODE_NAME env var (set in deploy/.env) distinguishes which node
# this is running on — used by nats -n and by the optional replica services.

name: rawdrive-app

services:
  # One-shot migration runner — must exit 0 before backend starts.
  # Only actually gets invoked on first deploy to a node; Compose handles
  # the "exit 0 means success" semantics via depends_on condition.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rawdrive-backend:local
    container_name: deploy-migrate-1
    command: ["/usr/local/bin/migrate"]
    env_file:
      - /opt/rawdrive/app/.env
    restart: "no"
    depends_on: []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: deploy-pgbouncer-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/databases.ini:/etc/pgbouncer/databases.ini:ro
      - /opt/rawdrive/app/deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    environment:
      - DATABASE_URL  # passed through for some edoburu image variants
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rawdrive-backend:local
    container_name: deploy-backend-1
    restart: unless-stopped
    command: ["/usr/local/bin/api"]
    env_file:
      - /opt/rawdrive/app/.env
    ports:
      - "8080:8080"  # exposed for peer failover from the OTHER app node
    depends_on:
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Backend's health endpoint is /health (not /api/v1/health — that's
      # a plan doc typo). Confirmed via backend/cmd/api/main.go:1245.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* env vars are read at BUILD time by next build and
        # baked into the client bundle. Setting this points all
        # frontend fetch('${API_BASE}/...') calls at the real API
        # subdomain instead of defaulting to localhost:8080 (which is
        # the frontend container's own loopback and always fails).
        NEXT_PUBLIC_API_URL: https://api.rawdrive.in
    image: rawdrive-frontend:local
    container_name: deploy-frontend-1
    restart: unless-stopped
    env_file:
      - /opt/rawdrive/app/.env
    ports:
      - "3000:3000"  # exposed for peer failover
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Frontend runtime has curl (installed in Dockerfile) not wget.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  worker:
    # Worker stub — same image as backend, different command.
    # IMPORTANT: current backend may not have a separate worker entry
    # point. If the --mode=worker flag is unsupported, this service
    # stays inactive behind the 'worker' profile and image processing
    # runs inline in the api container. No code change required.
    image: rawdrive-backend:local
    container_name: deploy-worker-1
    restart: unless-stopped
    command: ["/usr/local/bin/api", "--mode=worker"]
    env_file:
      - /opt/rawdrive/app/.env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - worker  # optional — start with `docker compose --profile worker up`
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  nats:
    image: nats:2.11-alpine
    container_name: deploy-nats-1
    restart: unless-stopped
    command:
      - -c
      - /etc/nats/nats-server.conf
      - -n
      - ${NATS_NODE_NAME}  # "nats-1" on .42, "nats-2" on .44
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey replica — only started on .42 via profile
  valkey-replica:
    image: valkey/valkey:9.0-alpine
    container_name: deploy-valkey-replica-1
    restart: unless-stopped
    command:
      - valkey-server
      - /etc/valkey/valkey-replica.conf
      - --replicaof
      - 187.127.142.46
      - "6379"
      - --masterauth
      - ${VALKEY_PASSWORD}
      - --requirepass
      - ${VALKEY_PASSWORD}
    volumes:
      - valkey_replica_data:/data
      - ./valkey/valkey-replica.conf:/etc/valkey/valkey-replica.conf:ro
    profiles:
      - valkey-replica  # only .42 uses this

  # Postgres replica — only started on .44 via profile. Uses a bind-mount
  # override in Phase B.5 to point at /var/lib/rawdrive/postgres-replica/
  # (populated by pg_basebackup from .46).
  postgres-replica:
    image: pgvector/pgvector:pg17
    container_name: deploy-postgres-replica-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # only peer-open, UFW blocks public
    profiles:
      - postgres-replica  # only .44 uses this

  nginx:
    image: nginx:1.27-alpine
    container_name: deploy-nginx-1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/rawdrive.conf.template:/etc/nginx/templates/rawdrive.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    environment:
      - PEER_NODE_IP=${PEER_NODE_IP}
    # envsubst only substitutes the named variables, leaving nginx's own
    # $var references alone. Also delete the default.conf that ships
    # with the nginx:alpine image (server localhost block that catches
    # requests before our templated site). Then exec nginx in foreground.
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && envsubst '$${PEER_NODE_IP}' < /etc/nginx/templates/rawdrive.conf.template > /etc/nginx/conf.d/rawdrive.conf && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  nats_data:
    driver: local
  valkey_replica_data:
    driver: local
  postgres_replica_data:
    driver: local
  nginx_cache:
    driver: local
