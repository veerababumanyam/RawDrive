# RawDrive network performance tuning.
# Installed at /etc/sysctl.d/99-rawdrive-net.conf on every node.
# Reversible: remove this file + `sysctl --system`. Affects NEW connections only,
# so applying it never disrupts an in-flight flow (incl. your live SSH session).
#
# WHY: the nodes shipped with the kernel default cubic / fq_codel. BBR congestion
# control + the fq qdisc (the Google/Cloudflare production default) materially
# improves throughput and tail latency over the public internet — which matters
# here because there is no CDN in front and every byte is served from the origin
# to mobile-India + global visitors. The remaining knobs are standard, conservative
# web-server tunings.

# BBR + fair queueing — the headline WAN latency/throughput win.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Keep the congestion window warm across idle gaps (helps keepalive API/HTTP2 conns).
net.ipv4.tcp_slow_start_after_idle = 0

# Survive path-MTU blackholes instead of stalling the connection.
net.ipv4.tcp_mtu_probing = 1

# Reclaim closed sockets faster under connection churn.
net.ipv4.tcp_fin_timeout = 15

# Larger backlogs to absorb connection bursts (somaxconn is already 65535 here).
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
