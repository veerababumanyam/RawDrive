# PostgreSQL User Name Maps (pg_ident.conf)
# ==========================================
# Mounted read-only into the container at /etc/postgresql/pg_ident.conf (see
# deploy/docker-compose.prod-db.yml; referenced by `-c ident_file=...`).
#
# WHY: pg_hba.conf authenticates container-local maintenance over the Unix socket
# with `peer` (the kernel-reported OS user) instead of passwordless `trust`
# (F-077 forbids trust). But pgBackRest runs as the `postgres` OS user and the
# operational tooling (backup-db.sh / pg-globals-backup.sh / deploy verification /
# promote-postgres-replica.sh) runs `docker exec ... psql -U rawdrive`, which lands
# as the `root` OS user. Neither OS name equals the `rawdrive` DB role, so plain
# peer would reject them. This map lets both the `root` and `postgres` OS users
# authenticate as the `rawdrive` superuser role — passwordless, but identity is
# still verified by the kernel (only a process actually running as root or postgres
# inside the container can use it). The `local all rawdrive peer map=rawdrive_ops`
# rule in pg_hba.conf references this map.
#
# MAPNAME        SYSTEM-USERNAME   PG-USERNAME
rawdrive_ops     root              rawdrive
rawdrive_ops     postgres          rawdrive
