# PostgreSQL Client Authentication
# =================================
# Restricted to: app-node IPs (.42, .44), replication from .44, local docker.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix socket for container-local maintenance.
# pgBackRest (archive-push / stanza-create / backup / check) and the entrypoint
# init scripts run as the `postgres` OS user (uid 999, which owns $PGDATA) and
# connect over the container-local Unix socket. They authenticate via `peer` as
# the `postgres` superuser role — passwordless but NOT `trust`: peer verifies the
# kernel-reported OS user, so only a process actually running as `postgres` inside
# the container can use it (this is what F-077 requires — no passwordless trust).
# The `postgres` superuser role is created on first boot by
# init/03-create-postgres-superuser.sh, and pgbackrest.conf sets pg1-user=postgres
# to match. Every OTHER local user (including `rawdrive`) must present
# scram-sha-256 credentials; all network auth (below) is unchanged.
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# Docker internal bridge network (localhost inside container)
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# App node 1 (.42) — via pgbouncer to backend
host    rawdrive        rawdrive        187.127.142.42/32       scram-sha-256

# App node 2 (.44) — via pgbouncer to backend AND replication slot to replica
host    rawdrive        rawdrive        187.127.142.44/32       scram-sha-256
host    replication     replicator      187.127.142.44/32       scram-sha-256

# Everything else denied by absence of rule.
