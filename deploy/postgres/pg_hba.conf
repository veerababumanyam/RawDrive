# PostgreSQL Client Authentication
# =================================
# Restricted to: app-node IPs (.42, .44), replication from .44, local docker.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix socket for container-local maintenance.
# This cluster's bootstrap superuser is `rawdrive` (POSTGRES_USER=rawdrive) — there
# is NO `postgres` role — so the prior `local all postgres peer` line was dead.
# pgBackRest (archive-push / stanza-create / backup / check) connects over THIS
# container-local socket as the `rawdrive` superuser via `docker exec` (uid 0), so
# it needs a passwordless local path. `trust` is scoped to `rawdrive` ONLY and only
# over the Unix socket — i.e. only a process already INSIDE the postgres container
# (which can already read $PGDATA directly) can use it, so it adds no real exposure
# over the container's existing trust boundary. Every OTHER local user must still
# present scram-sha-256 credentials; all network auth (below) is unchanged.
local   all             rawdrive                                trust
local   all             all                                     scram-sha-256

# Docker internal bridge network (localhost inside container)
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# App node 1 (.42) — via pgbouncer to backend
host    rawdrive        rawdrive        187.127.142.42/32       scram-sha-256

# App node 2 (.44) — via pgbouncer to backend AND replication slot to replica
host    rawdrive        rawdrive        187.127.142.44/32       scram-sha-256
host    replication     replicator      187.127.142.44/32       scram-sha-256

# Everything else denied by absence of rule.
