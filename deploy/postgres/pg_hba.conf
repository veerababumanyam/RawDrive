# PostgreSQL Client Authentication
# =================================
# Restricted to: app-node IPs (.42, .44), replication from .44, local docker.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix socket for container-local maintenance — passwordless via `peer`, NOT
# `trust` (F-077 forbids trust). peer verifies the kernel-reported OS user, so
# only a process actually running inside the container as that user can connect.
#  • `postgres` peer: pgBackRest (pg1-user=postgres) + entrypoint init run as the
#    postgres OS user (uid 999, owns $PGDATA). The postgres superuser role is
#    created on first boot by init/03-create-postgres-superuser.sh.
#  • `rawdrive` peer map=rawdrive_ops: operational tooling (backup-db.sh,
#    pg-globals-backup.sh, deploy-prod.sh verification, promote-postgres-replica.sh)
#    runs `docker exec ... psql/pg_dump -U rawdrive`, landing as the root OS user.
#    pg_ident.conf maps root + postgres OS users → the rawdrive role so these stay
#    passwordless without trust. See deploy/postgres/pg_ident.conf.
# Every OTHER local user must present scram-sha-256 credentials; all network auth
# (below) is unchanged.
local   all             postgres                                peer
local   all             rawdrive                                peer            map=rawdrive_ops
local   all             all                                     scram-sha-256

# Docker internal bridge network (localhost inside container)
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# App node 1 (.42) — via pgbouncer to backend
host    rawdrive        rawdrive        187.127.142.42/32       scram-sha-256

# App node 2 (.44) — via pgbouncer to backend AND replication slot to replica
host    rawdrive        rawdrive        187.127.142.44/32       scram-sha-256
host    replication     replicator      187.127.142.44/32       scram-sha-256

# Everything else denied by absence of rule.
