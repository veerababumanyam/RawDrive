# PostgreSQL 17 tuning for Hostinger 8 GB / 2 vCPU KVM
# Derived from spec §3.3 table.
# This file is mounted into pgvector/pgvector:pg17 via docker-compose.

listen_addresses = '*'
port = 5432
max_connections = 100

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_buffers = 64MB

# WAL / replication (primary; replica overrides with hot_standby=on)
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
synchronous_commit = on

# --- WAL archiving for pgBackRest PITR (F-PITR) — INERT / COMMENTED BY DEFAULT -
# Point-In-Time-Recovery needs continuous WAL archiving. This block is shipped
# COMMENTED OUT on purpose. Flipping archive_mode off→on requires a postgres
# RESTART (it is NOT reloadable), and — critically — if archive_command runs
# before the pgBackRest stanza exists it fails on every WAL segment, which makes
# WAL accumulate in pg_wal until the disk fills and the primary stops. So this
# stays inert until docs/runbooks/pitr-restore.md §(a) is followed IN ORDER:
#   1. rebuild the postgres container from deploy/postgres/Dockerfile (adds the
#      pgbackrest binary that archive_command shells out to)
#   2. set the PGBACKREST_* secrets in /opt/rawdrive/app/.env on .46
#   3. UNCOMMENT the three directives below
#   4. restart postgres, then run deploy/scripts/pgbackrest-init.sh (stanza-create)
#   5. take the first full backup, then install the backup crons
# wal_level=replica (above) is already sufficient for physical PITR — no change
# to wal_level / max_wal_senders / max_replication_slots is needed. archiving is
# ASYNC (archive-async=y in pgbackrest.conf) so a slow/blippy B2 link queues to
# the local spool instead of back-pressuring the WAL writer. archive_timeout
# forces a segment switch every 60s so the offsite RPO is bounded to ~60s.
#archive_mode = on
#archive_command = 'pgbackrest --stanza=rawdrive archive-push %p'
#archive_timeout = 60s

# Query planning
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging — structured, short retention
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'

# pg_stat_statements — required for observability follow-up
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# Timezone
timezone = 'Asia/Kolkata'
log_timezone = 'Asia/Kolkata'

# Autovacuum — more aggressive than default to keep bloat down at 10k users
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
