; PgBouncer database routing.
; THIS FILE CHANGES DURING FAILOVER. When Postgres primary moves from
; .46 to .44, the `host=` value here gets rewritten and pgbouncer is
; reloaded with SIGHUP. See docs/runbooks/postgres-failover.md.
;
; AFTER the Patroni cutover (docs/runbooks/patroni-failover.md) this manual
; rewrite goes away: host= becomes the LOCAL HAProxy (127.0.0.1:5432), which
; always forwards to the current Patroni leader, so failover needs no edit here.
; The cutover script (deploy/scripts/patroni-bootstrap.sh, Step 5) makes that
; change and backs up this file first. DO NOT pre-set host=127.0.0.1 now — there
; is no HAProxy until the cutover, so it would break the pgbouncer→postgres leg.

[databases]
rawdrive = host=187.127.142.46 port=5432 dbname=rawdrive auth_user=rawdrive
