# NATS JetStream 3-node cluster across the three VPSes.
# All three nodes run identical config; the Compose file sets the
# server_name via -n flag at container start.
#
# SECRETS: this file is committed, so it contains NO literal credentials.
# Both the client token and the cluster password are interpolated from the
# nats-server process environment at boot ($NATS_AUTH_TOKEN and
# $NATS_CLUSTER_SEED). nats-server FAILS TO START if either variable is
# unset, so a misconfigured deploy fails closed (no broker) rather than
# open (no auth). The Compose `nats` service MUST therefore pass these
# two variables into the container (env_file: /opt/rawdrive/app/.env or
# an explicit `environment:` block). See deploy/.env.example.

# Client port
port: 4222

# Client connection authentication (F-036).
# Without this block ANY host that can reach 4222 could publish/subscribe
# JetStream subjects (inject fake image/email/face-detection jobs, leak
# upload paths and workspace IDs). The backend authenticates by carrying
# the same token via the NATS_AUTH_TOKEN client option.
authorization {
  token: $NATS_AUTH_TOKEN
}

# HTTP monitoring port (internal only, firewalled from public)
http_port: 8222

# JetStream: durable streams for background work (image derivs, email,
# face detection). Raft quorum requires all 3 nodes online for writes;
# tolerates 1 node failure for reads.
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256M
  max_file_store: 8G
}

# Cluster topology — each node connects to the other two
cluster {
  name: rawdrive-nats
  port: 6222

  # NATS cluster authorization does not support `token`; route auth uses
  # a non-secret username plus a password. Explicit listed routes must
  # include the same credentials because this block is not applied to
  # outgoing route URLs.
  authorization {
    user: rawdrive_route
    password: $NATS_CLUSTER_SEED
    timeout: 2
  }

  routes: [
    nats-route://rawdrive_route:$NATS_CLUSTER_SEED@187.127.142.42:6222
    nats-route://rawdrive_route:$NATS_CLUSTER_SEED@187.127.142.44:6222
    nats-route://rawdrive_route:$NATS_CLUSTER_SEED@187.127.142.46:6222
  ]
}

# Logging
debug: false
trace: false
logtime: true

# Client connection limits
max_connections: 1000
max_payload: 4MB

# Graceful shutdown
write_deadline: "10s"
