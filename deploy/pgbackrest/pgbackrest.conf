# pgBackRest configuration for the RawDrive production primary (.46).
# =====================================================================
# WHY pgBackRest: the existing nightly logical pg_dump (deploy/scripts/backup-db.sh)
# gives an RPO of up to 24h — everything written between the 02:00 IST dump and a
# failure is lost (see docs/runbooks/disaster-recovery-from-r2.md "Write loss
# accounting"). pgBackRest adds CONTINUOUS WAL archiving + incremental physical
# backups so we can do Point-In-Time-Recovery to within ~archive_timeout (≈60s)
# of any moment. The two layers are complementary, not redundant — see
# docs/runbooks/pitr-restore.md §(f).
#
# This file is mounted READ-ONLY into the postgres container at
# /etc/pgbackrest/pgbackrest.conf (see deploy/docker-compose.prod-db.yml). It is
# committed to git, so it MUST contain NO secrets. Every credential and the repo
# cipher passphrase are supplied at runtime via PGBACKREST_* environment
# variables (pgBackRest maps PGBACKREST_<OPTION_WITH_UNDERSCORES> → that option).
#
# REQUIRED env vars the operator MUST set in /opt/rawdrive/app/.env (NOT here):
#   PGBACKREST_REPO1_S3_KEY         → B2 S3 AccessKeyID      (repo1-s3-key)
#   PGBACKREST_REPO1_S3_KEY_SECRET  → B2 S3 SecretAccessKey  (repo1-s3-key-secret)
#   PGBACKREST_REPO1_CIPHER_PASS    → repo encryption passphrase (repo1-cipher-pass)
# These three are passed through to the container in the compose `environment:`
# block. NEVER inline them in this file or in any committed YAML.
#
# Activation: this config is INERT until archiving is switched on. pgBackRest is
# only exercised once postgresql.conf sets archive_mode=on + archive_command and
# the stanza is created (deploy/scripts/pgbackrest-init.sh). Until then nothing
# here runs. Full cutover procedure: docs/runbooks/pitr-restore.md §(a).

[global]
# --- Repository 1: Backblaze B2 via the S3-compatible API ---------------------
# B2's S3 gateway requires PATH-style addressing (repo1-s3-uri-style=path);
# the default host/virtual style breaks on B2 endpoints. The endpoint, region
# and bucket below are the literal B2 values (NOT secrets) and mirror the media
# bucket's S3 settings — but backups live under a SEPARATE path (/pgbackrest)
# and a SEPARATE bucket from media so a media-bucket compromise can't trample
# them. Set repo1-s3-bucket to the dedicated BACKUP bucket, not "rawdriveclientfiles".
repo1-type=s3
repo1-s3-endpoint=s3.us-east-005.backblazeb2.com
repo1-s3-region=us-east-005
repo1-s3-bucket=rawdriveadminfiles
repo1-s3-uri-style=path
repo1-path=/pgbackrest

# --- Repo encryption (defence in depth, mirrors backup-db.sh's GPG posture) ---
# B2 keys grant read access to the bucket, so client-side encryption is what
# stops leaked B2 creds from yielding a readable physical backup. aes-256-cbc
# with the passphrase from PGBACKREST_REPO1_CIPHER_PASS (env, never committed).
# LOSS OF THIS PASSPHRASE = UNRECOVERABLE BACKUPS — stash it in the password
# manager exactly like BACKUP_GPG_PASSPHRASE.
repo1-cipher-type=aes-256-cbc

# --- Retention ----------------------------------------------------------------
# Keep 4 full backups. With a weekly full (Sunday) that is ~1 month of full
# anchors; expiring a full auto-expires the diffs/incrementals that depend on
# it. Keep 14 differentials so any day in the last fortnight is a fast
# delta-restore base. WAL needed to reach the oldest retained full is kept
# automatically; older archive is expired by `pgbackrest expire` (run via the
# backup driver).
repo1-retention-full=4
repo1-retention-diff=14

# --- Compression & parallelism ------------------------------------------------
# zstd at level 6 is a strong size/CPU trade-off for photo-DB WAL+heap; it keeps
# B2 egress/storage cost and restore-download time down without starving the
# 2-vCPU box. process-max=2 matches the 2 vCPUs — backups run alongside the live
# primary, so we do NOT oversubscribe.
compress-type=zst
compress-level=6
process-max=2

# --- Backup behaviour ---------------------------------------------------------
# start-fast=y issues an immediate checkpoint at backup start instead of waiting
# for the next scheduled one, so cron-driven backups don't stall.
start-fast=y

# --- Asynchronous WAL archiving ----------------------------------------------
# archive-async=y decouples archive-push from the WAL-writer's critical path:
# WAL segments are queued to a local spool and shipped to B2 by a background
# process, so a slow/blippy B2 link can't back-pressure (and eventually stall)
# the primary. The spool dir is a dedicated volume (see compose deliverable B).
# This is the single most important setting for not letting offsite backup
# latency hurt foreground write throughput.
archive-async=y
spool-path=/var/spool/pgbackrest

# --- Logging ------------------------------------------------------------------
# Console at info for cron/stdout capture; file at detail for post-incident
# forensics. The log dir is a dedicated volume so logs survive container
# recreation. Container json-file log caps still apply to console output.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[rawdrive]
# --- Stanza: the RawDrive cluster --------------------------------------------
# One stanza per cluster. pg1-path is $PGDATA inside the postgres container;
# pg1-port/pg1-socket-path let pgBackRest reach the running cluster for backups
# (it connects as the postgres superuser over the local Unix socket — no
# password needed, no TCP exposure). The database name/user are not credentials.
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=rawdrive
pg1-database=rawdrive
