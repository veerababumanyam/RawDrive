# Docker Compose for VPS 3 (DB node, 187.127.142.46).
# Runs: Postgres primary, Valkey primary, NATS cluster member 3.
# PgBouncer is NOT here — it runs on the app nodes (see prod-app.yml).

name: rawdrive-db

services:
  postgres:
    # Locally built from deploy/postgres/Dockerfile = pgvector/pgvector:pg17 +
    # pinned pgBackRest. The binary MUST live in this container because
    # archive_command (postgresql.conf) shells out to `pgbackrest archive-push`
    # from the postgres backend's process space. INERT until the PITR cutover:
    # archiving stays off (postgresql.conf ships it commented) and the image
    # behaves identically to stock pgvector until then. Build/recreate on .46:
    #   docker compose -f deploy/docker-compose.prod-db.yml build postgres
    #   docker compose -f deploy/docker-compose.prod-db.yml up -d postgres
    build:
      context: ./postgres
    image: rawdrive-postgres:local
    container_name: deploy-postgres-1
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      # pgBackRest reads PGBACKREST_<OPTION> from the env so the committed
      # deploy/pgbackrest/pgbackrest.conf carries NO secrets. Sourced from
      # /opt/rawdrive/app/.env on .46. Empty/unset = archiving inert; nothing
      # breaks until the PITR cutover sets them (docs/runbooks/pitr-restore.md).
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # pgBackRest config (read-only; secrets come from the env above, not here).
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Async WAL spool — must survive container recreation so queued segments
      # aren't lost across a restart mid-flush.
      - pgbackrest_spool:/var/spool/pgbackrest
      - pgbackrest_log:/var/log/pgbackrest
    ports:
      # Bind to the DB node's own host IP, NOT 0.0.0.0. Docker publishes
      # ports via its own iptables chain (DOCKER), which is evaluated
      # BEFORE UFW's INPUT rules — a "0.0.0.0:5432" publish is reachable
      # on every interface and silently bypasses UFW. App nodes (.42/.44)
      # reach this primary cross-host via the public IP (see
      # pgbouncer/databases.ini host=187.127.142.46), so loopback-only
      # binding (as pgbouncer uses) would break them; instead we scope the
      # publish to this single host IP. pg_hba.conf still restricts to
      # .42/.44 with scram-sha-256 as defense-in-depth.
      - "${DB_NODE_IP:-187.127.142.46}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  valkey:
    image: valkey/valkey:9.0-alpine
    container_name: deploy-valkey-1
    restart: unless-stopped
    command:
      - valkey-server
      - /etc/valkey/valkey.conf
      - --requirepass
      - ${VALKEY_PASSWORD}
    environment:
      # Required by the healthcheck command; the --requirepass flag
      # above handles the listener but doesn't set this env var inside
      # the container, so the healthcheck's $${VALKEY_PASSWORD}
      # expansion would otherwise resolve to empty.
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    ports:
      # Same rationale as postgres above: scope the publish to this host's
      # IP instead of 0.0.0.0 so Docker's iptables doesn't expose Valkey on
      # every interface and bypass UFW. App nodes reach this cross-host via
      # the public IP (VALKEY_URL=redis://...@187.127.142.46:6379), so a
      # loopback-only bind would break them. requirepass remains the
      # defense-in-depth control.
      - "${DB_NODE_IP:-187.127.142.46}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  nats:
    image: nats:2.11-alpine
    container_name: deploy-nats-1
    restart: unless-stopped
    env_file:
      - path: /opt/rawdrive/app/.env
        required: false
    command:
      - -c
      - /etc/nats/nats-server.conf
      - -n
      - nats-3
      - -cluster_name
      - rawdrive-nats
    volumes:
      - nats_data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "${DB_NODE_IP:-187.127.142.46}:4222:4222"
      - "${DB_NODE_IP:-187.127.142.46}:6222:6222"
      - "${DB_NODE_IP:-187.127.142.46}:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  nats_data:
    driver: local
  # pgBackRest async-archive spool + logs (used only after the PITR cutover).
  pgbackrest_spool:
    driver: local
  pgbackrest_log:
    driver: local
