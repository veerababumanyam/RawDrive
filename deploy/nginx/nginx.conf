user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS resolver — enables dynamic upstream resolution so we can
    # reference container names and peer IPs that resolve at runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Restore true visitor IPs before defining rate-limit zones. Without this,
    # Cloudflare-proxied traffic is keyed by the shared edge IP and legitimate
    # auth traffic can trip the /auth/ limiter for unrelated users.
    include /etc/nginx/cloudflare-real-ip.conf;

    # Logging — JSON for future log shipping
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"req_time":$request_time,'
        '"ups_time":"$upstream_response_time",'
        '"ups_addr":"$upstream_addr",'
        '"ups_status":"$upstream_status",'
        '"cf_ray":"$http_cf_ray",'
        '"cf_ip":"$http_cf_connecting_ip"'
      '}';

    access_log /var/log/nginx/access.log json_combined buffer=64k flush=5s;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Abuse hardening: promptly free slow / timed-out client connections and
    # bound the response-send time (slowloris / slow-read defense). client_*
    # timeouts above already bound the request side.
    reset_timedout_connection on;
    send_timeout 30s;

    client_max_body_size 128m;  # photo uploads go direct to R2, but API payloads can be large
    client_body_timeout 60s;
    client_header_timeout 10s;

    # --- HA: fast upstream failover (defaults inherited by every proxy_pass) ---
    # The site config makes the LOCAL backend/frontend primary and the peer node
    # the backup upstream. nginx's DEFAULT proxy_connect_timeout is 60s, so when
    # a local container is down a request would hang up to 60s before failing
    # over to the healthy peer. Drop the connect timeout to 2s so failover is
    # near-instant, and bound the retry budget. Per-location blocks may still
    # override proxy_read_timeout (e.g. long API calls). proxy_next_upstream is
    # set here so even locations that don't declare it (static) fail over too.
    proxy_connect_timeout 2s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # --- Edge cache for immutable Next.js build assets ---
    # /_next/static/* is content-hashed and immutable, so the edge can cache it
    # and stop re-proxying every cold/cross-client request to the Next.js
    # upstream. Backed by the nginx_cache volume already mounted at
    # /var/cache/nginx. Only the static location opts in (see the site config);
    # nothing dynamic is cached.
    proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:10m
                     max_size=1g inactive=7d use_temp_path=off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml font/woff2;

    # Rate limiting zones (spec: 100 req/s API, 30 req/min auth)
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=30r/m;

    # Connection-count cap per client IP — blunts slowloris / connection-
    # exhaustion floods at the origin (there is no CDN in front, so the origin
    # is the only line of defense). Generous enough that HTTP/2 clients (one
    # multiplexed connection per origin) and shared-NAT users are unaffected;
    # only abusive connection storms from a single source hit the ceiling.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn conn_per_ip 100;

    # Return 429 (Too Many Requests), not the default 503, when a limiter trips —
    # clearer client signal and keeps limiter hits out of 5xx-based alerting.
    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Include the templated site config (envsubst applied at container start)
    include /etc/nginx/conf.d/*.conf;
}
